#generic
generic_dreadnought_arms_race:0 "Dreadnought Arms Race"
generic_dreadnought_arms_race_desc:0 "More ships! Bigger guns!"
generic_SA_civil_war:0 "Civil War"
generic_global_revolution_idea:0 "Global Revolution"
generic_wartime_food_shortage_1:0 "Rationing Measures"
generic_wartime_food_shortage_1_desc:0 "Food supplies are tightening, forcing the government to introduce rationing. The situation is manageable—for now.\n§LWill be removed if there is no war.§!"
generic_wartime_food_shortage_2:0 "Severe Food Shortages"
generic_wartime_food_shortage_2_desc:0 "Rationing has failed to meet demand. Hunger is spreading, and morale is beginning to crumble.\n§LWill be removed if there is no war.§!"
generic_wartime_food_shortage_3:0 "Nationwide Food Crisis"
generic_wartime_food_shortage_3_desc:0 "Starvation grips the nation as food reserves vanish. Civil order and fighting spirit are collapsing.\n§LWill be removed if there is no war.§!"
generic_defiant_spirit_idea:0 "Defiant Spirit"
generic_defiant_spirit_idea_desc:0 "The people of this nation are tough and defiant, and will not submit easily to foreign rule."
generic_neutral_complacency:0 "Neutral Complacency"
generic_neutral_complacency_desc:0 "This nation has long been protected by its neighbors, and thus has put little effort into its own army."
generic_balkan_nationalism:0 "Balkan Nationalism"
generic_balkan_nationalism_desc:0 "The people of the Balkans are experiencing a surge of nationalism, and the ranks of their armies have swelled with many eager to fight for their country."
generic_submarine_production:0 "Submarine Production"
generic_convoy_production:0 "Convoy Production"
generic_poor_quality_weapons:0 "Poor Quality Weapons"
generic_poor_quality_weapons_desc:0 "The quality of the weapons produced by this country are notoriously poor, and their troops suffer from reduced combat effectiveness as a result."
generic_war_exhaustion1:0 "Mild War Exhaustion"
generic_war_exhaustion1_desc:0 "The war has gone on longer than expected, however our people are still in good spirits."
generic_war_exhaustion2:0 "Moderate War Exhaustion"
generic_war_exhaustion2_desc:0 "The war is beinning to tire our people, with many asking when it will end."
generic_war_exhaustion3:0 "Severe War Exhaustion"
generic_war_exhaustion3_desc:0 "The war has become intolerable, and our people are on the brink of revolt."
generic_russian_seperatism:0 "Russian Separatism"
generic_russian_seperatism_desc:0 "Parts of Ukraine are ethnically Russian, and wish to return to the Motherland.  This has caused instability in the nation."
generic_liberation_of_balkans:0 "Liberation of the Balkans"
generic_liberation_of_balkans_desc:0 "The time has come to free the Balkans from Turkish rule.  Onwards my Slavic brothers!"
generic_balkan_war_league_lost_idea:0 "War Indemities to the Ottomans"
generic_balkan_war_league_lost_idea_desc:0 "As part of the peace treaty with the Ottomans we have been saddled with hefty war indemities."
generic_truck_production:0 "Truck Production"
generic_rifle_production:0 "Streamlined Rifle Design"
generic_battleship_production_idea:0 "Battleship Production"
generic_light_arty_production:0 "Streamlined Field Gun Design"
generic_mg_production:0 "Streamlined MG Design"
generic_increase_military_production:0 "Increased Military Production"
generic_infrastructure_building:0 "Funded Road Construction"
generic_supplyline_building:0 "Funded Railway Construction"
generic_naval_guns_school:0 "Naval Gunnery Schools"
generic_army_collapse_idea:0 "Army Collapse"
generic_army_collapse_idea_desc:0 "Our soldiers have lost the will to fight and are deserting or surrendering to the enemy en masse.  Our frontline is collapsing."
generic_reserve_divisions_idea:0 "Expanded Reserves Corps"
generic_deterrence_idea:0 "Deterrence"
generic_mobilizing_economy_idea:0 "Mobilizing Economy"
generic_home_defense_idea:0 "Home Defense"
generic_army_desertions_minor:0 "Minor Desertions"
generic_army_desertions_minor_desc:0 "Reports of soldiers abandoning their posts are increasing, particularly among disaffected units. While the army still fights, discipline and cohesion are beginning to erode."
generic_army_desertions_moderate:0 "Widespread Desertions"
generic_army_desertions_moderate_desc:0 "Desertion has become commonplace, with whole companies melting away overnight. Morale is collapsing, and the armed forces struggle to remain effective in the field."
generic_army_desertions_severe:0 "Mass Desertions"
generic_army_desertions_severe_desc:0 "The military is disintegrating. Tens of thousands have thrown down their weapons, and many now march home or even join local militias. The war effort is on the verge of total collapse."
generic_foriegn_capital_loans_idea:0 "Foreign Capital Loans"
generic_foriegn_capital_loans_idea_desc:0 "Foreign lenders provide much-needed capital, easing economic pressures and boosting state finances."
generic_foriegn_military_advisors_idea:0 "Foreign Military Advisors"
generic_foriegn_military_advisors_idea_desc:0 "Experienced foreign officers assist in training and doctrine, improving the effectiveness of our army."
generic_foriegn_naval_advisors_idea:0 "Foreign Naval Advisors"
generic_foriegn_naval_advisors_idea_desc:0 "Foreign naval experts help modernize our fleet and refine our maritime doctrine."
generic_foriegn_railway_loans_idea:0 "Foreign Railway Loans"
generic_foriegn_railway_loans_idea_desc:0 "International loans fund critical improvements to our railways and infrastructure."
generic_civilian_investments_idea:0 "Civilian Investments"
generic_civilian_investments_idea_desc:0 "Increased funding and incentives directed toward civilian industry accelerate general construction and factory development."
generic_military_investments_idea:0 "Military Investments"
generic_military_investments_idea_desc:0 "Expanded military budgets and contracts strengthen the arms industry and speed up construction of key facilities."
generic_naval_investments_idea:0 "Naval Investments"
generic_naval_investments_idea_desc:0 "Focused investment into shipyards and maritime infrastructure boosts naval construction efforts across the board."
generic_democratric_growth_idea:0 "Democratic Drift"
generic_democratric_growth_idea_desc:0 ""
generic_fascism_growth_idea:0 "Fascist Drift"
generic_fascism_growth_idea_desc:0 ""
generic_communism_growth_idea:0 "Communist Drift"
generic_communism_growth_idea_desc:0 ""
generic_neutrality_growth_idea:0 "Monarchist Drift"
generic_neutrality_growth_idea_desc:0 ""
generic_free_market_idea:0 "Free Market Reforms"
generic_free_market_idea_desc:0 "Competition is encouraged and regulations eased to let industry flourish."
generic_land_of_opportunity_idea:0 "Land of Opportunity"
generic_land_of_opportunity_idea_desc:0 "Innovation thrives where ambition is rewarded and doors remain open."
generic_consumer_protections_idea:0 "Consumer Protections"
generic_consumer_protections_idea_desc:0 "Safeguarding citizens from exploitation fosters trust in both markets and government."
generic_wellfare_state_idea:0 "Welfare State"
generic_wellfare_state_idea_desc:0 "A robust social safety net ensures that no citizen is left behind."
generic_armed_neutrality_idea:0 "Armed Neutrality"
generic_armed_neutrality_idea_desc:0 "Prepared for danger yet unwilling to provoke, the nation strengthens its defenses without taking sides."
generic_volunteer_corps_idea:0 "Volunteer Corps"
generic_volunteer_corps_idea_desc:0 "Patriotic citizens step forward to defend freedom abroad."
generic_why_we_fight_idea:0 "Why We Fight"
generic_why_we_fight_idea_desc:0 "The people understand the cause and stand ready to defend their homeland with unwavering resolve."
generic_paramilitarism_idea:0 "Paramilitarism"
generic_paramilitarism_idea_desc:0 "Loose bands of party loyalists organize into street militias, enforcing ideology through intimidation and drill."
generic_militarism_idea:0 "Militarism"
generic_militarism_idea_desc:0 "Military discipline and service are ingrained into the very fabric of society."
generic_expansionism_idea:0 "Expansionist Fervor"
generic_expansionism_idea_desc:0 "The nation embraces a destiny of conquest, seeking to grow its borders by force."
generic_worker_council_idea:0 "Workers' Councils"
generic_worker_council_idea_desc:0 "Grassroots factory committees form to represent laborers, asserting influence before true soviet power emerges."
generic_collectivization_idea:0 "Collectivization"
generic_collectivization_idea_desc:0 "Private enterprises are folded into state-run collectives to reshape society from the ground up."
generic_socialism_one_country_idea:0 "Socialism in One Country"
generic_socialism_one_country_idea_desc:0 "The revolution consolidates within our own borders, focusing on strengthening the state internally."
generic_global_revolution_idea:0 "Global Revolution"
generic_global_revolution_idea_desc:0 "The fires of revolution must spread abroad, inspiring workers everywhere to rise up."
generic_ideological_fanaticism_idea:0 "Ideological Fanaticism"
generic_ideological_fanaticism_idea_desc:0 "Utter devotion to the cause steels soldiers and citizens alike for any sacrifice required."


#ww1
neutral_complacency_idea:0 "Neutral Complacency"
neutral_complacency_idea_desc:0 "With their neutrality guaranteed by the great powers of Europe, Luxembourg and Belgium have lapsed into a false sense of security, not spending much effort on the army and mantaining only a skeleton border guard."
unexpected_assault:0 "Unexpected Assault"
unexpected_assault_desc:0 "The the enemy assault has caught us completely by surprise."
outflanked_through_belgium:0 "Outflanked Through Belgium"
outflanked_through_belgium_desc:0 "We did not expect the German army to attack through Belgium, and are unprepared to defend the little country."  

#USA
USA_remembrance_idea:0 "Remembrance"
USA_remembrance_day_desc:0 "After two humiliating defeats in the 19th century at the hands of the Confederacy and her allies, the USA established Remembrance Day.  This national holiday, taking place on April 22, embodies the national anguish of the people of the United States.  Having sworn vengeance on the Confederacy, the US is determined that the next time they will come out victorious, no matter the cost."
USA_usgc_idea:0 "United States General Staff" 
USA_usgc_idea_desc:0 "The establishment of the United States General Staff came about in the reforms after the debacle of the Second Mexican War.  Instructed by Prussian advisors, the U.S. General Staff has adopted much of the German-thinking on waging war.  Vastly reformed, the United States Army has become a formidable fighting force--though its true mettle in battle remains untested."
USA_socialist_opposition:0 "Socialist Opposition"
USA_socialist_opposition_desc:0 "The pervasive wealth inequality in the United States has seen its Socialist movement grow to unprecedent size.  Although still below the Democrats in terms of popularity, the Socialist Party of America is now out-polling the defunct Republican Party--making them the primary opposition.  The Democrats will soon have to take notice, and decide whether they want to approach the Socialists with the carrot, or the stick."
USA_throttled_military_spending:0 "Throttled Military Spending"
USA_throttled_military_spending_desc:0 "The Socialist Party has blocked our military spending bills in an attempt to force us to make concessions on the labor front.  Although the army will be able to operate as usual for some time, it will be difficult to expand its size."
USA_corporate_trusts:0 "Corporate Trusts"
USA_corporate_trusts_desc:0 "The trusts have come to dominate U.S. industry, holding large shares across the market.  Although they are quite efficient at producing stuff, many have begun to call for their break-up, citing that they hamper the free market and treat their workers poorly."
USA_limited_socialist_opposition:0 "Limited Socialist Opposition"
USA_limited_socialist_opposition_desc:0 "Although the Socialist still oppose us on key labor issues, they recognize that winning the current war is more important.  For the time being, they have mostly agreed to set aside their differences with us."
USA_workers_rights_idea:0 "Workers' Rights Bill"
USA_wealth_tax_idea:0 "Wealth Tax"
USA_nationalize_industries_idea:0 "Nationalized Industries"
USA_socialist_block_war_funds:0 "Blocked War Funds"
USA_secret_military_funds_idea:0 "Secret Military Funding"
USA_secret_military_funds_idea_desc:0 "By moving around some money and borrowing from other allocated funds, we have been able to increase the funding to our army without the Socialists noticing."
USA_usgc_empowered_idea:0 "Military Oversight of the Nation"
USA_usgc_empowered_idea_desc:0 "With the ongoing war, the need has arisen to vastly widen the authority of the General Staff--including into previously civilian areas such as the direction of industry and allocation of national resources.  In this way, the entire country can be better focused to defeating our enemies."
USA_usgc_empowered_2_idea:0 "Military Oversight of the Nation"
USA_usgc_empowered_2_idea_desc:0 "With the ongoing war, the need has arisen to vastly widen the authority of the General Staff--including into previously civilian areas such as the direction of industry and allocation of national resources.  In this way, the entire country can be better focused to defeating our enemies."
USA_angered_socialists_idea:0 "Angered Socialists"
USA_socialist_banned_idea:0 "Socialist Outlawed"
USA_american_militarism_idea:0 "American Militarism"
USA_imposed_tarrifs_idea:0 "European Tariffs"
USA_demoralized_army_idea:0 "Demoralized Military"
#  USA_socialist_administration_idea:0 "Socialist Administration"
#  USA_socialist_administration_idea_desc:0 "The Socialists place a large emphasis on helping the working class and are viciously anti-war.  As a result, our industry has been retasked away from military equipment, and army morale is low, since the soldiers dont see much of a reason to find for an administration that doesn't back them."
USA_worker_strikes:0 "Strikes"
USA_worker_strikes_desc:0 "Discontent with labor conditions, workers have gone on strike."
USA_strike_appeasement_measures:0 "Strike Appeasemnent Measures"
USA_come_ye_saints:0 "Come Ye' Saints"
USA_come_ye_saints_desc:0 "The Mormons are fanatical fighters, who will fight to the last to defend their home."
USA_more_battleships:0 "Funded Dreadnought Production"
USA_remembrance_offensive_idea:0 "Remembrance Offensive"
USA_remembrance_offensive_idea_desc:0 "The time has come to smash those Rebs once and for all.  Onwards!"


#CSA
CSA_southern_social_heriarchy:0 "Legacy of the Old South"
CSA_southern_social_heriarchy_desc:0 "The old South was dominated by the plantantion system, which saw a few prominent white families amass great wealth.  The decendants of these plantantion owners still retain much of the power in Confederate society today, and are generally resistant to any reforms that would threaten their status.  The vast majority of whites remain poor tenant farmers or industrial laborers, and have a limited influence in the national politics."
CSA_racial_segregation:0 "Segregated Populace"
CSA_racial_segregation_desc:0 "The Confederacy was founded upon slavery, and although abolished in 1882 at the end of the Second Mexican War, blacks are not considered citizens and must abide by strict racial laws.  Chief among these are the prohibitions to own arms or serve in the Confederate military."
CSA_agricultural_nation:0 "Agricultural Economy"
CSA_agricultural_nation_desc:0 "The South is still predominantly an agricultural economy, with A substantial portion of the population living in the countryside.  As a result, construction, manufacturing, and literacy all remain low."
CSA_military_nepotism:0 "Military Nepotism"
CSA_military_nepotism_desc:0 "Lack of a rigious education system in the South, along with the tendancy to reserve officer roles for the nobility, have seen the pool of Confederate officers remain small and often underqualifed."
CSA_military_nepotism2:0 "Military Nepotism"
CSA_military_nepotism2_desc:0 "Lack of a rigious education system in the South, along with the tendancy to reserve officer roles for the nobility, have seen the pool of Confederate officers remain small and often underqualifed."
CSA_military_traditions:0 "Southern Militarism"
CSA_military_traditions_desc:0 "The South was born in war, and as such is fiercely protective of its sovereignty. Military service is viewed as an integral part of any man's life, with men are taught from boyhood how to shoot, ride a horse, and navigate the countryside. Were any foriegn invader dare to step foot into Dixie, they would encounter murch resistance."
CSA_lee_warplan_idea:0 "War Plan Lee"
CSA_military_traditions_2:0 "Southern Militarism"
CSA_military_traditions_2_desc:0 "The South was born in war, and as such is fiercely protective of its sovereignty. Military service is viewed as an integral part of any man's life, with men are taught from boyhood how to shoot, ride a horse, and navigate the countryside. Were any foriegn invader dare to step foot into Dixie, they would encounter murch resistance."
CSA_industrializing_economy:0 "Industrializing Economy"
CSA_industrializing_economy_desc:0 "The reforms of President Wilson have seen the Confederate economy move away from tis traditional agricultural roots to a more modern and manufacturing basis."
CSA_industrializing_economy_2:0 "Industrializing Economy"
CSA_industrializing_economy_2_desc:0 "The reforms of President Wilson have seen the Confederate economy move away from tis traditional agricultural roots to a more modern and manufacturing basis."
CSA_more_officers:0 "Expanded Officer Corps"
CSA_black_factory_workers:0 "Black Factory Workers"
CSA_black_soldiers:0 "Black Soldiers"
CSA_black_soldiers_desc:0 "In a desperate bid, the Confederacy has begun recruiting from its black populace to fill the army ranks."
CSA_black_soldiers_improved_rights:0 "Black Soldiers"
CSA_black_soldiers_improved_rights_desc:0 "In a desperate bid, the Confederacy has begun recruiting from its black populace to fill the army ranks."
CSA_black_soldiers_worsened_rights:0 "Black Soldiers"
CSA_black_soldiers_worsened_rights_desc:0 "In a desperate bid, the Confederacy has begun recruiting from its black populace to fill the army ranks."
CSA_defend_the_south_idea:0 "The South Will Live"
CSA_better_battleships_idea:0 "Bigger Naval Guns"
CSA_confederate_war_loan:0 "Confederate War-time Loan"
CSA_volunteer_corps:0 "The Volunteer Corp"
CSA_reorganized_general_staff:0 "Purge of the General Staff"

#HAI
HAI_french_debt:0 "Enormous French Indemnity"
HAI_french_debt_desc:0 "As the price of independence, France demanded an outrageous sum of 150 million francs—allegedly as compensation for property lost by former slaveowners during the Haitian Revolution. This crushing debt continues to strangle Haiti’s economy, consuming much of the national budget and leaving little room for growth or development."
HAI_political_turmoil:0 "Turbulent Political Scene"
HAI_political_turmoil_desc:0 "Haiti's political landscape is plagued by instability, with coups and uprisings marking its recent history. President François Antoine Simon himself came to power by overthrowing his predecessor, Pierre Nord Alexis—and his own position remains precarious amid factional tensions."
HAI_ragtag_army:0 "Ragtag Army"
HAI_ragtag_army_desc:0 "The Haitian army suffers from chronic underfunding and poor organization. Many soldiers lack proper uniforms and equipment, and must take on side jobs just to survive. Discipline is weak, and morale is even weaker."
HAI_illiterate_populace:0 "Widespread Illiteracy"
HAI_illiterate_populace_desc:0 "The majority of Haiti's population remains illiterate, a legacy of colonial neglect and ongoing underinvestment in public education. This hinders both national development and the ability to build a modern, informed society."

# LATAM
latam_banana_republic:0 "Banana Republic"
latam_banana_republic_desc:0 "This country's economy is dominated by the cultivation and export of bananas and other tropical fruit, much of it controlled by powerful foreign corporations. These companies exert immense influence over national politics, infrastructure, and labor practices, turning the state into a client of foreign business interests. Local governance is often weak, corrupt, or beholden to external demands, leaving little room for national sovereignty or sustainable development."
latam_cauldillo_ruler:0 "Regime of the Cauldillo"
latam_cauldillo_ruler_desc:0 "The term 'caudillo' refers to a type of charismatic strongman leader common in Latin American history—often a military figure who commands loyalty through personal appeal rather than institutions. These rulers typically centralize power, suppress dissent, and maintain order through patronage networks, force, and nationalist rhetoric, sidelining democratic norms in favor of authoritarian control."


#CAN
CAN_american_menance_idea:0 "The Yankee Threat"
CAN_american_menance_idea_desc:0 "Twice before Canada has been invaded by the United States - in the War of 1812 and again in the Second Mexican War.  With the increasingly militatistic attitude of our neighbor to the South, we must prepare for the eventuality that U.S. troops will one day cross over into our lands again."
CAN_american_menance_2_idea:0 "The Yankee Threat"
CAN_american_menance_2_idea_desc:0 "Twice before Canada has been invaded by the United States - in the War of 1812 and again in the Second Mexican War.  With the increasingly militatistic attitude of our neighbor to the South, we must prepare for the eventuality that U.S. troops will one day cross over into our lands again."
CAN_reliance_on_uk:0 "Reliance on the Britain"
CAN_reliance_on_uk_desc:0 "With a small population and fledging industry, we will need to rely heavily on the Mother country for protection and economic security."
CAN_economic_boom:0 "Economic Boom"
CAN_economic_boom_desc:0 "The late 19th century saw an economic boom for Canada, as immigrants came in droves to settle the Central and Western plains."
CAN_quebec_nationalism:0 "Quebecois Nationalism"
CAN_quebec_nationalism_desc:0 "The Quebecois Question has been a thorn in the side of Canadian policy makers ever since the creation of the Dominion in 1867.  With the increasingly nationalist tone of modern day politics, many in Quebec have begun to call for greater autonomy or outright independence."
CAN_rapidly_expanded_army:0 "Rapidly Expanded Army"
CAN_rapidly_expanded_army_desc:0  "The Canadian Army has been rapidly expanded to be able to face the threat of the United States to the south.  Unfortunately, this has left it with an insufficent officer corp, and with troops that are often undertrained and undersupplied."
CAN_army_numbers_focus:0 "Rapidly Expanded Army"
CAN_army_numbers_focus_desc:0 "Although the quality of our troops may suffer from further expanding the army, quantity has a quality of its own."
CAN_army_quality_focus:0 "Rapidly Expanded Army"
CAN_army_quality_focus_desc:0 "Having a lot of men isnt enough.  Our men must be good soldiers too."
CAN_professional_army:0 "Professional Army"
CAN_guriella_fighters_idea:0 "Canadian Guerilla Fighters"
CAN_million_bayonets_idea:0 "A Million Bayonets"
CAN_native_rifles_idea:0 "Native Rifle Model"
CAN_native_artillery_idea:0 "Native Artillery Model"
CAN_we_stand_guard_idea:0 "We Stand On Guard For Thee"
CAN_we_stand_guard_idea_desc:0 "The Americans are at the gates.  Hold them back at all costs."
CAN_defensive_mindset:0 "Defensive Mindset"
CAN_hold_out_for_british:0 "Hold Out For the British!"
CAN_hold_out_for_british_desc:0 "Alone Canada would never stand a chance against the US.  Fortunately the Mother Country is with us.  We just need to hold on till help arrives."
CAN_frontiersmen:0 "Frontiersmen"
CAN_frontiersmen_desc:0 "The Canadian people are use to the harsh terrain of Canada, and thus can move around and survive in it with ease."

#ENG
ENG_dense_urban_country:0 "Urban-dense Homeland"
ENG_dense_urban_country_desc:0 "The British Isles are small, as a result space has to be used more efficiently."
ENG_professional_army:0 "Professional Army"
ENG_professional_army_desc:0 "The British Empire was the only nation in Europe to field a fully professional army.  As a result, although small in numbers, each British soldier was worth 10 of the enemy."
ENG_imperial_overextension:0 "Overextension"
ENG_imperial_overextension_desc:0 "The empire is large and needy, and our resources are strained due to the fact."
ENG_lords_opposition:0 "Lords Opposition"
ENG_lords_opposition_desc:0 "The House of Lords has blocked our newest spending bill, bringing our government to a standstill.  We must reduce their power so our government can act freely again."
ENG_usual_business_idea:0 "Business as Usual"
ENG_british_industry_loans:0 "British Loans"

#FRA
 FRA_unstable_domestic_politics:0 "Unstable Parliamentary System"
 FRA_unstable_domestic_politics_desc:0 "The Third Republic is plagued by fragile coalitions, ideological factionalism, and frequent cabinet collapses. Governments rise and fall in rapid succession, sapping political authority and undermining national cohesion."
 FRA_artisanal_industries:0 "Artisanal Industries"
 FRA_artisanal_industries_desc:0 "French industry remains dominated by small workshops and traditional methods. While this preserves craftsmanship, it limits standardization, efficiency, and the rapid expansion of modern heavy industry."
 FRA_french_revanchism:0 "French Revanchism"
 FRA_french_revanchism_desc:0 "The humiliation of 1871 and the loss of Alsace–Lorraine remain unforgotten. Though the nation is not yet prepared for war, resentment toward Germany fuels nationalist sentiment and a growing willingness to mobilize."
 FRA_legacy_of_dreyfus_affair:0 "Legacy of the Dreyfus Affair"
 FRA_legacy_of_dreyfus_affair_desc:0 "The Dreyfus Affair deeply fractured French society and the officer corps alike. Political distrust, ideological purges, and lingering resentment continue to undermine army cohesion and effective command."
 FRA_republican_control_of_army:0 "Republican Control of the Army"
 FRA_republican_control_of_army_desc:0 "In the aftermath of the Dreyfus Affair, the Republic moved decisively to secure its authority over the armed forces. Political vetting, enforced loyalty to civilian rule, and the removal of unreliable officers reduced overt factionalism within the army. While discipline and obedience to the Republic improved, professional confidence and initiative were temporarily constrained."
 FRA_french_revanchism_2:0 "French Revanchism"
 FRA_french_revanchism_2_desc:0 "The humiliation of 1871 and the loss of Alsace–Lorraine remain unforgotten. As tensions rise in Europe, calls to reclaim lost territories grow louder. Public opinion increasingly accepts the necessity of war, and mobilization efforts gain political momentum."
 FRA_french_elan_idea:0 "Élan Vital"
 FRA_french_elan_idea_desc:0 "French military doctrine emphasizes offensive spirit, courage, and the will to attack. While inspiring, this belief often prioritizes morale and aggression over firepower and modern tactical realities."
 FRA_rifle_production:0 "Expanded Rifle Production"
 FRA_rifle_production_desc:0 "Domestic arms manufacturers have increased the production of service rifles, ensuring that the expanding army can be adequately equipped for large-scale mobilization."
 FRA_light_arty_production:0 "Light Artillery Production"
 FRA_light_arty_production_desc:0 "French industry focuses on producing light, mobile artillery pieces designed to support rapid infantry advances and offensive operations."
 FRA_mg_production:0 "Machine Gun Production"
 FRA_mg_production_desc:0 "The army begins to adopt modern automatic weapons, though their integration into doctrine and unit organization remains incomplete."
 FRA_chauchat_production:0 "Chauchat Production"
 FRA_chauchat_production_desc:0 "The Chauchat light machine gun is rushed into mass production to provide mobile firepower. While innovative in concept, its reliability and effectiveness leave much to be desired."
 FRA_renault_production:0 "Renault Barrel Production"
 FRA_renault_production_desc:0 "Renault’s industrial facilities are directed toward the development and production of light armored vehicles. Emphasizing simplicity and mass production over heavy armor, this effort lays the groundwork for France’s early tank forces and mechanized doctrine."
FRA_champagne_riots_idea:0 "Champagne Riots"
FRA_champagne_riots_idea_desc:0 "Economic hardship and regulatory disputes in the Champagne region have erupted into widespread unrest. Riots, strikes, and property destruction have disrupted production and strained public order, forcing the government to divert attention and resources to internal stability."
FRA_modernizing_industries:0 "Modernizing Industry"
FRA_modernizing_industries_desc:0 "France has begun modernizing its industrial sector, investing in mechanization, standardized production, and heavy industry expansion. While traditional artisanal methods remain, these reforms improve efficiency, output, and the capacity to equip a growing military and consumer economy."
FRA_build_more_railways:0 "Railway Construction Effort"
FRA_memories_of_1871:0 "Memories of 1871"
FRA_memories_of_1871_desc:0 "The defeat in the Franco-German war was a humiliating moment for the French people. While many are eager to avenge that which was lost, there is a general uncertainty as to whether France is capable of defeating Germany in another war."
FRA_military_advisors_in_russia_idea:0 "Military Mission to Russia"
FRA_military_advisors_in_russia_idea_desc:0 "French officers have been dispatched to assist in the reorganization of the Russian Army. The mission strengthens military cooperation and provides valuable insight into large-scale continental warfare."
FRA_military_advisors_in_russia_idea:0 "French Military Mission"
FRA_military_advisors_in_russia_idea_desc:0 "A French military mission is assisting in the modernization of our army. Their expertise supports ongoing reforms and strengthens coordination with our ally."
FRA_loans_for_russia_rearm_idea:0 "French Rearmament Loans"
FRA_loans_for_russia_rearm_idea_desc:0 "French financial support is helping fund our military expansion. The credit eases fiscal strain and accelerates the implementation of the Great Military Program."
FRA_conscript_colonials_idea:0 "Colonial Troops"
FRA_boost_war_effort_idea:0 "Boost the War Effort"
FRA_they_shall_not_pass_idea:0 "Ils Ne Passeront Pas"
FRA_union_sacree_idea:0 "Union Sacrée"
FRA_union_sacree_idea_desc:0 "In the face of war, France’s political factions agree to suspend internal conflicts in favor of national unity. Social and ideological disputes are subordinated to the defense of the Republic."
FRA_prowar_propganda_idea:0 "Revanchist Propaganda Campaign"
FRA_income_tax_idea:0 "Income Tax"
# FRA_french_army_mutiny:0 "French Army Mutinies"
# FRA_french_army_mutiny_desc:0 "The soldiers of the French army have had enough of useless slaughter and are deserting the army in the tens of thousands."
# FRA_french_revanchism:0 "French Revanchism"
# FRA_french_revanchism_desc:0 "We have been robbed of our rightful territories by our enemies.  It is time to remake the map of Europe."
# FRA_french_industry_loans:0 "French Loans"
# FRA_champion_of_weak_idea:0 "Champion of the Weak"
# FRA_champion_of_weak_idea_desc:0 "Evil forces threaten weak nations around the world. Who will stand up for them if not us?"
# FRA_army_mutinies:0 "Army Mutinies"
# FRA_army_mutinies_desc:0 "Our soldiers are sick and tired of wasteful offensives that repeatedly failed to bring results.  Some among the ranks have begun to outright refuse attack orders, although it seems most are still willing to defend their position - for now."
# FRA_worsened_army_mutinies:0 "Severe Army Mutinies"
# FRA_worsened_army_mutinies_desc:0 "Our efforts to crack down on the budding mutiny backfired, and now soldiers are deserting en masse.  It will take time to restore order, and until we do so we will be quite vulnerable."
# FRA_halt_army_offensives:0 "Halted Offensive Operations"
# FRA_halt_army_offensives_desc:0 "We have given into the mutinieers demands and decided to halt all offensives for now.  Its not great, but at least our soldiers have agreed to remain defending the line."
# FRA_french_military_advisors:0 "French Military Advisors"
# FRA_exhausted_populace:0 "Exhausted Populace"
# FRA_exhausted_populace_desc:0 "Our people tire of war."


#GER
GER_north_german_confederation:0 "Norddeutscher Bund Legacy"
GER_north_german_confederation_desc:0 "The Protestant northern German states were long ago brought under the Prussian fold, and form a solid bedrock of support for the monanrchy.  The Catholic south.. less so."
GER_ohl_idea:0 "Oberste Heeresleitung"
GER_ohl_idea_desc:0 "The Oberste Heeresleitung (also known as OHL) is the high command of the German Army.  They are responsible for drafting Germany's war plans and waging war when the time comes."
GER_prussian_militarism:0 "Prussian Militarism"
GER_prussian_militarism_desc:0 "Referred to as 'an army with a state', the small nation of Prussia is renown for its militaristic nature and heritage.  Now composing the bulk of the German Empire, this ideology has begun to diffuse to the other German states."
GER_prussian_militarism_2:0 "Prussian Militarism"
GER_prussian_militarism_2_desc:0 "Referred to as 'an army with a state', the small nation of Prussia is renown for its militaristic nature and heritage.  Now composing the bulk of the German Empire, this ideology has begun to diffuse to the other German states."
GER_ohl_idea2:0 "Oberste Heeresleitung"
GER_ohl_idea2_desc:0 "The Oberste Heeresleitung (also known as OHL) is the high command of the German Army.  They are responsible for drafting Germany's war plans and waging war when the time comes. Lately they have also begun to take a more active role in economic and civilian affairs."
GER_ohl_idea3:0 "Oberste Heeresleitung"
GER_ohl_idea3_desc:0 "The Oberste Heeresleitung (also known as OHL) is the high command of the German Army.  They are responsible for drafting Germany's war plans and waging war when the time comes. Lately they have also begun to take a more active role in economic and civilian affairs."
GER_naval_law_1908:0 "Naval Law of 1908"
GER_naval_law_1908_desc:0 "The Naval Law of 1908 commits the Empire to an accelerated program of fleet construction and replacement, intended to challenge British naval dominance. While it has significantly expanded the size of the German Navy, the sustained political and financial burden of the program increasingly strains civilian support."
GER_naval_law_1912_low:0 "Naval Law of 1912 (Reduced)"
GER_naval_law_1912_low_desc:0 "The Naval Law of 1912 revises Germany’s naval program in response to rising costs and shifting strategic priorities. Fleet expansion continues on a more restrained footing, easing political pressure while preserving the core structure of the High Seas Fleet."
GER_naval_law_1912_high:0 "Naval Law of 1912 (Expanded)"
GER_naval_law_1912_high_desc:0 "The Naval Law of 1912 reaffirms Germany’s commitment to naval expansion despite mounting political and financial resistance. By accelerating ship construction and naval development, the law seeks to sustain the High Seas Fleet as a central instrument of German power, albeit at considerable domestic cost."
GER_army_law_1913:0 "Army Law of 1913"
GER_army_law_1913_desc:0 "The Army Law of 1913 authorizes a major expansion of Germany’s land forces amid rising concerns over continental security. It marks a clear shift in priorities toward the army, boosting manpower levels and increasing investment in the production of infantry equipment and artillery. This reorientation, however, carries significant political and financial costs."
GER_military_mission_turkey_idea:0 "German Military Mission to Turkey"
GER_military_mission_turkey_idea_desc:0 "German officers are temporarily embedded within the Ottoman Army to advise on training, organization, and modern doctrine."
GER_loan_for_turkish_rearmament:0 "Loans for Ottoman Rearmament"
GER_loan_for_turkish_rearmament_desc:0 "German financial support enables the modernization of Ottoman infantry and artillery, and the strengthening of local arms production."
GER_german_industry_loans:0 "German Loans"
GER_german_controlled_planning:0 "German-Controlled Planning"
GER_blimp_production:0 "Zeppelin Bomber Production"
GER_schlieffen_plan:0 "Schliffen Plan"
GER_schlieffen_plan_desc:0 "Our plan to win the war before the full forces of the Entente can be brought to bear.  We will strike through Belgium and eliminate the French, before turning to deal with the Russians."
GER_kaisers_battle:0 "Kaiser's Battle"
GER_kaisers_battle_desc:0 "This is our last ditch attempt to win the war.  If this doesnt work, who knows what will happen."
GER_implement_rationing:0 "Food Rationing"
GER_implement_rationing_desc:0 "We will have to restrict the populace's consumption of food, in order maximize the time we can withstand the British blockade."
GER_blockade_effects:0 "Food Shortage Crisis"
GER_blockade_effects_desc:0 "We have run out of food to feed both our populace and army.  This is a crisis."
GER_german_military_advisors:0 "German Military Advisors"
GER_limited_navy_treaty:0 "Limited Navy Treaty"
GER_limited_navy_treaty_desc:0 "As per the Treaty of Understanding & Detente, we have agreed to limit our navy to 60% of the size of the Royal Navy."

#TUR
TUR_ethnic_strife:0 "Ethnic Stife"
TUR_ethnic_strife_desc:0 "The Ottoman Empire has long suffered from internal ethnic conflicts, and the Sultan's handling of them has not made them better."
TUR_jihad:0 "Jihad"
TUR_jihad_desc:0 "The Sultan has called for a Holy War against the infidels!\n§RWill be removed if at peace§!"
TUR_supremacy_of_italian_navy:0 "Supremacy of the Italian Navy"
TUR_supremacy_of_italian_navy_desc:0 "The Italian Navy is vastly superior to ours, and dominates the Mediterranean."
TUR_outdated_army:0 "Army of a Bygone Era"
TUR_outdated_army_desc:0 "The Ottoman Army is seriously obsolete and in much need of reform.  Until these reforms are complete it is unlikely to be an effective fighting force."
TUR_outdated_army_2:0 "Army of a Bygone Era"
TUR_outdated_army_2_desc:0 "Although the Ottoman Army was once seriously outdated, various reforms have improved its state.  However its effectiveness on the battlefield is still questionable."
TUR_outdated_army_3:0 "Army of a Bygone Era"
TUR_outdated_army_3_desc:0 "Although the Ottoman Army was once seriously outdated, various reforms have improved its state.  However its effectiveness on the battlefield is still questionable."
TUR_victory_in_firstbalkan_war:0 "Victory in the First Balkan War"
TUR_victory_in_firstbalkan_war_desc:0 "The successful defense of our European territories from the aggression of the Balkan League has reinvigorated our national pride, and the war indemities from the defeated states will help with reconstruction/"

#ITA
ITA_fragile_unification:0 "The Incomplete Risorgimento"
ITA_fragile_unification_desc:0 "The Risorgimento — the great movement that unified Italy in 1861 — forged a kingdom, but not yet a cohesive nation. Chief among its divisions is the gulf between the industrial North and the poor, neglected South. Regional loyalties endure, and even the army mirrors the uneven bonds of this young state. To make matters worse, Parliamentary intrigue and Transformismo politics have sapped public confidence in Rome, while socialist agitation gathers strength in the cities. Though Italy may be one nation on paper, it remains far from one people."
ITA_sluggish_industralization:0 "Sluggish Industrialization"
ITA_sluggish_industralization_desc:0 "Italy’s economic modernization lags behind that of the great powers. Regional disparities, poor infrastructure, and limited access to capital have slowed the transformation from an agrarian to an industrial society."
ITA_messina_earthquake_aftermath:0 "Aftermath of the Messina Earthquake"
ITA_messina_earthquake_aftermath_desc:0 "The devastating earthquake of 1908 leveled the cities of Messina and Reggio Calabria, leaving hundreds of thousands dead or displaced. Reconstruction efforts continue to drain the national treasury."
ITA_messina_earthquake_aftermath_reduced:0 "Aftermath of the Messina Earthquake"
ITA_messina_earthquake_aftermath_reduced_desc:0 "The devastating earthquake of 1908 leveled the cities of Messina and Reggio Calabria, leaving hundreds of thousands dead or displaced. Reconstruction efforts continue to drain the national treasury."
ITA_humiliation_of_1896:0 "Legacy of the 1896 Humiliation"
ITA_humiliation_of_1896_desc:0 "The disastrous defeat at Adwa in 1896 still casts a long shadow over Italy. The army’s reputation remains tarnished, recruitment is sluggish, and public confidence in the military establishment is weak."
ITA_fake_alliance:0 "The Triple Alliance"
ITA_fake_alliance:0 "The Triple Alliance"
ITA_fake_alliance_desc:0 "Bound by treaty to Germany and Austria-Hungary, Italy remains nominally a member of the Triple Alliance. In truth, distrust and conflicting ambitions make this pact little more than a diplomatic formality, limiting Italy’s freedom to pursue its own course abroad.\n\n§RItaly is unable to join other factions while it retains this national spirit.§!"
ITA_public_support_for_libya_invasion_idea:0 "Propaganda Effort for the Conquest of Libya"
ITA_conquest_of_libya:0 "Conquest of Libya"
ITA_conquest_of_libya_desc:0 "Public enthusiasm surges as Italy embarks on its new colonial venture. The people believe victory will be quick and glorious, and the nation rallies behind the campaign."
ITA_conquest_of_libya_2:0 "Conquest of Libya"
ITA_conquest_of_libya_2_desc:0 "The campaign in Libya has lasted far longer than expected. Mounting costs and stubborn resistance have weakened public support, and frustration begins to replace the early optimism."
ITA_libyan_supply_lines:0 "Libyan Supply Lines"
TA_mountaineer_bonus_idea:0 "Alpini Traditions"
ITA_mountaineer_bonus_idea_desc:0 "Forged in the high Alps, Italy’s Alpini represent a proud mountain warfare tradition. Trained to endure harsh climates and rugged terrain, these specialized troops form the backbone of our defenses in the north."
ITA_mass_mobilization_idea:0 "Mass Mobilization"
ITA_mass_mobilization_idea_desc:0 "With Europe descending into war, Italy accelerates the call to arms. Entire classes of men are called to the colors as the army expands at speed. Though training and preparation may suffer in haste, sheer numbers will strengthen Italy’s hand on the battlefield."
ITA_mil_logistics_idea:0 "Military Logistics Expansion"
ITA_mil_logistics_idea_desc:0 "Recognizing the importance of supply and transport in modern warfare, the state invests in railways, supply hubs, and essential equipment. A stronger logistical network ensures our forces remain provisioned and mobile."


#JAP
JAP_warrior_traditions_idea:0 "Warrior Traditions"
JAP_warrior_traditions_idea_desc:0 "The warrior traditions of the Japanese fueled their drive for conquest and battle, and even drove their soliders to fanaticism on the battlefield."

#RUS
RUS_general_staff:0 "Imperial General Staff"
RUS_general_staff_desc:0 "The Imperial General Staff remains a deeply conservative institution, shaped by court politics, rigid hierarchy, and lingering rivalries between senior officers. Coordination between fronts is weak, operational planning is slow, and doctrine has failed to keep pace with the realities of modern industrial warfare."
RUS_bloated_imperial_army:0 "Army of Clay"
RUS_bloated_imperial_army_desc:0 "Vast on paper, the Imperial Army's rank and file are drawn overwhelmingly from an illiterate peasantry — poorly fed, poorly equipped, and bound to service by conscription rather than conviction. Rifle and artillery stocks fall well short of mobilization requirements, and the gap between theoretical strength and battlefield effectiveness is wide."
RUS_agrarian_economy:0 "Agrarian Economy"
RUS_agrarian_economy_desc:0 "The Russian Empire remains predominantly agrarian, with the vast majority of its population tied to subsistence farming. Industrialization is uneven and concentrated in a few urban centers, while infrastructure across much of the empire is sparse and underdeveloped. This imbalance restricts construction, limits access to resources, and slows scientific and technological advancement."
RUS_threat_of_revolution:0 "Threat of Revolution"
RUS_threat_of_revolution_desc:0 "Although the 1905 Revolution was suppressed, its causes were never resolved. Political repression, rural poverty, and industrial unrest continue to erode confidence in the Tsarist regime. Revolutionary organizations remain active underground, and any prolonged crisis risks reigniting mass unrest and undermining national unity."
RUS_tsushima_humiliation:0 "Tsushima Humiliation"
RUS_tsushima_humiliation_desc:0 "The annihilation of the Baltic Fleet at Tsushima was a national humiliation that exposed profound weaknesses in Russia’s naval command, training, and logistics. The defeat shattered public confidence in the fleet and discredited naval leadership, leaving the empire wary of maritime conflict and burdened by the immense cost of rebuilding."
RUS_bloated_imperial_army_2:0 "Army of Clay"
RUS_bloated_imperial_army_2_desc:0 "Vast on paper, the Imperial Army's rank and file are drawn overwhelmingly from an illiterate peasantry — poorly fed, poorly equipped, and bound to service by conscription rather than conviction. Rifle and artillery stocks fall well short of mobilization requirements, and the gap between theoretical strength and battlefield effectiveness is wide."
RUS_land_reorganization_act_idea:0 "Land Reorganization Act"
RUS_land_reorganization_act_idea_desc:0 "The breakup of the communal mir system and the consolidation of strip holdings into private farmsteads is gradually transforming the Russian countryside. Peasants with a stake in their own land work it harder, and agricultural output is slowly rising as a result."
RUS_tsushima_humiliation_reduced:0 "Shadow of Tsushima"
RUS_tsushima_humiliation_reduced_desc:0 "The wounds of Tsushima have not fully healed. Reconstruction is underway and confidence is slowly returning, but the doctrinal lessons of the defeat remain incompletely absorbed, and the shipyards have not yet recovered their full capacity."
RUS_naval_rearmament_act_idea:0 "Naval Rearmament Programme"
RUS_naval_rearmament_act_idea_desc:0 "A substantial naval bill has secured funding for new construction across the Baltic and Black Sea fleets. Dockyards are expanding, orders for modern capital ships are placed, and the navy begins to recover something of its former ambition — though the financial burden on the treasury is considerable."
RUS_lena_massacre_fallout_idea:0 "Lena Massacre Fallout"
RUS_lena_massacre_fallout_idea_desc:0 "The killing of striking workers on the Lena River has sent shockwaves through Russian society. Strikes and work stoppages spread across the industrial centers, while socialist agitators exploit the outrage to recruit and organize. The government's credibility among the laboring classes is badly damaged, and the unrest shows no sign of subsiding quickly."
RUS_great_military_program_idea:0 "Great Military Program"
RUS_great_military_program_idea_desc:0 "The Tsar has launched an ambitious program to expand armaments production and modernize the army, seeking to bring Russia closer to parity with its European rivals. While the initiative has been met with enthusiasm, it places heavy demands on the state, and its full benefits will take time to become apparent."
RUS_improved_literacy:0 "Country-wide Literacy Programs"
RUS_improve_railways:0 "Infrastructure Development Project"
RUS_modernizing_empire:0 "A Modernizing Empire"
RUS_restricted_press_idea:0 "Restricted Press"
RUS_prioritize_army_supplies:0 "Prioritize Army Supplies"
RUS_prioritize_civilian_supplies:0 "Prioritize Civilian Supplies"
RUS_great_retreat_idea:0 "The Great Retreat"
RUS_dual_power_system:0 "Shared Power with the Soviets"
RUS_dual_power_system_desc:0 "Following the abdication of the Tsar, the Provisional Government must share authority with the Petrograd Soviets. Political indecision and the councils’ influence slow governance and hinder recruitment efforts."
RUS_order_no_1_idea:0 "Order No. 1"
RUS_order_no_1_idea_desc:0 "The Petrograd Soviet has issued Order No. 1, instructing soldiers to obey the councils rather than the Provisional Government. As a result discipline has broken down and offensive operations have been halted."
RUS_kerensky_offensive_idea:0 "Kerensky Offensive"
RUS_kerensky_offensive_idea_desc:0 "Our last chance to win the war. Its now or never."
RUS_social_reforms_idea:0 "Social Reforms"
RUS_unstable_political_situation:0 "Unstable Political Situation"
RUS_unstable_political_situation_desc:0 "The situation in Russia is rapidly deteriorating, as various political factions vie for power in the wake of the Tsar's abdication.  If the center parties do not restore order soon, more radical forces may yet prevail."
RUS_unstable_white_alliance:0 "Fractured White Alliance"
RUS_unstable_white_alliance_desc:0 "Although the White parties have joined forced to fight the Reds, there are vast ideological differences between the different subfactions.  Effective coordination will be difficult."
RUS_workers_revolution:0 "The Workers' Revoution"
RUS_workers_revolution_desc:0 "The Workers' Revoution has come!  To arms comrades!"
RUS_antiwar_pressure:0 "Food Shortages" 
RUS_antiwar_pressure_desc:0 "The people tire of war, and demand bread."
RUS_increased_revolutionary_activity:0 "Increased Revolutionary Activity"
RUS_increased_revolutionary_activity_desc:0 "The war turns unpopular, and more and more people flock to the Bolshevik banner."

#AUH
AUH_hungarian_oppposition:0 "Hungarian Opposition"
AUH_hungarian_oppposition_desc:0 "The Hungarians have long been a thorn in our side, never full satisfied with the Ausgleich of 1866. Recently though they have been more oppositional than ever, blocking even the most simple bills from passing."
AUH_multiethnic_army:0 "Multi-ethnic Army"
AUH_multiethnic_army_desc:0 "The Austro-Hungarian state is made up of over fifteen nationalities, and deep cultural and linguistic divides make forging a truly united army nearly impossible."
AUH_general_staff:0 "Österreichischer Generalstab"
AUH_general_staff_desc:0 "The Austro-Hungarian General Staff is marked by rigid planning and poor coordination. Its leadership favors aggressive strategies but consistently overlooks the empire’s logistical weaknesses and ethnic divisions. As a result, the empire is ill-prepared for modern war."
AUH_diplomatic_isolation:0 "Diplomatic Isolation"
AUH_diploamtic_isolation_desc:0 "Over the past decades, Austria-Hungary has become increasingly isolated on the diplomatic stage. Among our friends now we can only really count Germany, and even that is a maybe."
AUH_house_of_cards_1:0 "House of Cards"
AUH_house_of_cards_1_desc:0 "The Austro-Hungarian Empire has always been rife with ethnic tension, but the ongoing war has brought the issue to the forefront.  The longer this war continues, the worse the situation will get!"
AUH_house_of_cards_2:0 "House of Cards"
AUH_house_of_cards_2_desc:0 "The Austro-Hungarian Empire has always been rife with ethnic tension, but the ongoing war has brought the issue to the forefront.  The longer this war continues, the worse the situation will get!"


# SER
SER_agrarian_nation_idea:0 "Agrarian Nation"
SER_agrarian_nation_idea_desc:0 "Serbia remains overwhelmingly rural, its economy built on smallholder farming and livestock rather than industry or commerce. The population is growing, but the country lacks the industrial base, technical expertise, and capital to modernize quickly."
SER_aftermath_of_may_coup_idea:0 "Aftermath of the May Coup"
SER_aftermath_of_may_coup_idea_desc:0 "The regicide of 1903 brought the Karađorđević dynasty to power but shocked the crowned heads of Europe, prompting several powers to withdraw their ministers from Belgrade. Relations have since been formally restored, but Serbia remains viewed with suspicion abroad. At home, the officers who carried out the coup remain powerful, and civilian authority over the military is far from assured."
SER_narodna_odbrana_org:0 "Narodna Odbrana"
SER_narodna_odbrana_org_desc:0 "The People's Defense organization, founded in response to Austria-Hungary’s annexation of Bosnia in 1908, has become a significant force in mobilizing and training the population for war. Its networks span Serbian society, coordinating Serbian nationalist paramilitaries, and cultivating a reserve of men prepared to fight for the national cause."
SER_black_hand_org:0 "The Black Hand"
SER_black_hand_org_desc:0 "The secret society known as Ujedinjenje ili smrt — Union or Death — has established deep roots within the Serbian officer corps. Fiercely pan-Slavic and contemptuous of civilian authority, it pursues Serbian unification through means the government cannot openly endorse, and increasingly operates beyond its control."
SER_narodna_odbrana_org_2:0 "Narodna Odbrana"
SER_narodna_odbrana_org_2_desc:0 "The People's Defense organization, founded in response to Austria-Hungary’s annexation of Bosnia in 1908, has become a significant force in mobilizing and training the population for war. Its networks span Serbian society, coordinating Serbian nationalist paramilitaries, and cultivating a reserve of men prepared to fight for the national cause."
# SER_pan_serbism:0 "Pan-Serbism"
# SER_pan_serbism_desc:0 "Pan-Serbism champions the unification of all Serb lands into a single national state. This ideology fuels widespread patriotic fervor, though its territorial aspirations have sharply increased tensions with neighboring empires—most notably Austria-Hungary."
SER_reduce_illiteracy_idea:0 "Literacy Campaigns"
SER_reduce_illiteracy_idea_desc:0 "Expanding rural schooling and literacy programs is slowly producing a more educated population, with benefits felt across industry, administration, and the officer corps."
SER_improving_economy_idea:0 "Economic Development"
SER_improving_economy_idea_desc:0 "Modest but deliberate investment in infrastructure and domestic industry is beginning to bear fruit, gradually expanding Serbia's productive capacity."



## Balkan Nations
BUL_balkan_prussia:0 "The Prussia of the Balkans"
BUL_balkan_prussia_desc:0 "Bulgaria’s sweeping military reforms and large, modern army have earned it the moniker 'the Prussia of the Balkans.' Confident in its martial strength, Sofia increasingly views force of arms as the path towards achieving a 'Greater Bulgaria.'"
GRE_megali_idea:0 "Megali Idea"
GRE_megali_idea_desc:0 "The Megali Idea envisions a Greater Greece uniting historic and ethnic Greek populations across the Aegean and Anatolia. This expansive national dream energizes public support, accelerates mobilization, and drives the state’s commitment to naval investment and territorial expansion."
GRE_national_schism_idea:0 "The National Schism"
GRE_national_schism_idea_desc:0 "The dismissal of Venizelos has split Greece into bitterly opposed camps—royalists and Venizelists—undermining political unity, weakening national cohesion, and pushing the country toward open internal conflict."
AdO_expeditionary_force_idea:0 "Expeditionary Force"




