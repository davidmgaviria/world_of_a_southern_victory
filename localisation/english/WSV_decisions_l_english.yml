# First Balkan War
balkan_league_cat:0 "The Balkan League"
balkan_league_cat_desc:0 "The Ottoman Empire is in terminal decline, and recent events have shown its army is more ineffective than ever.  Yet to the South are many of our Slav brothers still under the Ottoman yoke.  If we can set aside our differnces with the other Balkan states, together we may have the power to finally push the Turks out of Europe."
league_territorial_negotiations_timer:0 "Negotiations On the Paritition of Ottoman Lands"
league_needs_two_major_members_tt:0 "Has fewer than §Y2§! major League members (§YSerbia, Greece, Bulgaria§!)."
state_claimed_by_balkan_member:0 "State is claimed by a Balkan League member"
fb_is_claiming_state:0 "Is currently claiming a state"
firstbalkan_war_cat:0 "The First Balkan War"
firstbalkan_war_cat:0 "The First Balkan War"
firstbalkan_war_cat_desc:0 "The Balkan League has taken up arms against the Ottoman Empire, seeking to liberate the remaining lands still under Constantinople’s rule. The fighting is fierce, and the final shape of the Balkans will depend on the course of the campaign. But the region is a powderkeg—and instability rises as borders shift and rival ambitions clash. The Great Powers watch uneasily, knowing that even a single misstep could ignite a far wider war."
firstbalkan_peace_implementation_delay:0 "Negotiating the Terms of Peace"
firstbalkan_peace_implementation_delay_desc:0 "The First Balkan War is over.  Now the borders of southeastern Europe must be decided."
league_claim_state_x:0 "Lay Claim to [From.GetName]"
league_max_claims_at_a_time_tt:0 "May claim up to two states at a time"
league_withdraw_from_conference:0 "Withdraw from the Talks"
league_withdraw_from_conference_desc:0 "The talks have proven unproductive in advancing our interests. It is time to withdraw."
leave_league_and_forfit_claims_tt:0 "§RWithdrawing from the talks will forfeit all your claims to any territory the League may seize from the Ottomans in war.§!"
league_collapses_tt:0 "§RAs the faction leader, withdrawing from the talks will cause the League to collapse.§!"

# Second Balkan War
secondbalkan_war_cat:0 "Second Balkan War"
secondbalkan_war_cat_desc:0 "The fragile peace forged after the First Balkan War has shattered. Bulgaria, deeply dissatisfied with the division of conquered territories, now seeks by force what it believes was unjustly denied in the treaty."
secondbalkan_countdown_to_war:0 "Preparations for War"
secondbalkan_war_prep_over:0 "War Preparations Complete"
secondbalkan_serbia_prevent_war:0 "Hand Over Macedonia"
secondbalkan_serbia_prevent_war_desc:0 "The recent Austrian ultimatum has drastically altered our strategic position. Serbia cannot hope to weather a two-front war against Austria-Hungary and Bulgaria simultaneously. Perhaps it is wiser to concede Macedonia and appease Bulgaria, thus avoiding disaster."
bulgaria_will_halt_war_prep_tt:0 "§GBulgaria will cease its war preparations.§!"
secondbalkan_bulgaria_offers_peace:0 "Request for Peace"
secondbalkan_bulgaria_offers_peace_desc:0 "Our invasion of Macedonia has failed horribly and we are greatly outnumbered.  It is time to sue for peace."
secondbalkan_serbia_offers_peace:0 "Request Bulgaria for Peace"
secondbalkan_serbia_offers_peace_desc:0 "Despite our combined efforts, Bulgaria has managed to wrest away Macedonia from us.  The war is lost."
secondbalkan_bulgaria_wins_tt:0 "§LBulgaria will take Serbian and Greek Macedonia as well as North Dobruja.§!"

## Nicaragua Crisis
nicaragua_crisis_cat:0 "The Nicaragua Crisis"
nicaragua_crisis_cat_desc:0 "The landing of Confederate Marines in Managua has sparked an international crisis.  Now the Great Powers must deftly manuever to reach a peaceful resolution, or else what was a regional disagreement could turn into a global conflict."
time_to_rescue_confederate_garrison:0 "Days Until Confederate Garrison Surrenders"
time_to_rescue_confederate_garrison_desc:0 "The American blockade has left the Confederate garrison in Managua cut off from supply and surrounded by a hostile populace."
great_power_response_nicaragua_tt:0 "The Great Powers have reacted to the crisis"
csa_send_terms_to_us:0 "Send Terms to the U.S."
csa_send_terms_to_us_desc:0 "The United States is clearly hostile to our move in Nicaragua and aims for us to back down.  Perhaps by making some concessions we will be able to reach an agreement."
csa_peace_terms_nicaragua_tt:0 "§LIn exchange for recognizing Nicaragua as our protectorate, we promise not to build a canal in the area without U.S. consultation, and further promise to recognize Haiti as a U.S. protectorate.  The United States must agree to these terms.§!"
sent_peace_terms_nicaragua:0 "Awaiting U.S. Response to Peace Terms"
csa_force_open_blockade:0 "Force Open the Blockade"
csa_force_open_blockade_desc:0 "Diplomacy has proven ineffective, and time is running out for our troops.  We have no choice but to respond with force."
will_lead_to_war_with_usa_tt:0 "§RWill mean war with the United States.§!"
negoctiation_for_help_from_england_tt:0 "§REngland will not come to our aid because we have not negociated.§!"
england_backs_csa_in_war_tt:0 "§GBritain will stand with us.§!"
germany_supports_usa_in_nicaragua:0 "Stand with the United States"
germany_supports_usa_in_nicaragua_desc:0 "The United States is facing aggression from its southern neighbor.  As a good ally we should back them."
britain_supports_csa_in_nicaragua:0 "Stand with the Confederate States"
britain_supports_csa_in_nicaragua_desc:0 "The Confederate States is facing aggression from its northern neighbor.  As a good ally we should back them."

## July Crisis
july_crisis_cat:0 "The July Crisis"
july_crisis_cat_desc:0 "The death of the Archduke in Sarajevo has sparked a European crisis.  The Austrians are likely to react punitively to the Serbs, and may outright invade the country.  Russia however will not tolerate this, and if France and Germany both back their respective allies, a European war may soon begin from some damn foolish thing in the Balkans."
austrian_investigation_mission:0 "Austrian Investigation in Progress"
austrian_investigation_mission_desc:0 "The Austrians are conducting an investigation into the death of the Archduke."
austrian_investigation_complete:0 "Austrian Investigation Complete"
russia_backs_serbia:0 "Mobilize in Defense of Serbia"
russia_backs_serbia_desc:0 "The Austrian seem poised to sweep down into Serbia.  If we do not do something to prevent this, the tiny Slavic nation will be overrun."
usa_mobilizes_for_crisis:0 "Mobilize in Support of Germany"
usa_mobilizes_for_crisis_desc:0 "Tensions in Europe are at a boiling point, and the German Empire will likely soon be at war with Great Britain and France.  Now is our time to act."


## Salonika Front
macedonia_commitment_overview:0 "Macedonian Commitment Overview"
macedonia_commitment_overview_desc:0 "§WThe Allied Army of the Orient currently fields [?global.ARMY_ORIENT_ACTUAL.num_armies|Y0] divisions.\n\nOur contribution:\n\tDivisions deployed: [?num_orient_divisions|Y0]\n\tManpower committed: [?manpower_sent_to_orient|Y0]\n\n§LOur manpower contribution will gradually increase over time to replace casualties sustained by our divisions serving in the Army of the Orient.§!"



build_ports_in_salonika:0 "Expand the Salonika Port"
build_ports_in_salonika_desc:0 "The Allied build-up at Salonika has strained Greece’s limited port capacity, leaving the Army of the Orient undersupplied and vulnerable. Expanding the harbor facilities will secure a steadier flow of men, matériel, and provisions into Macedonia."
decision_cost_build_ports_in_salonika_cost:0 "£command_power  §Y25§!  £civ_factory §Y3§!"
decision_cost_build_ports_in_salonika_blocked:0 "£command_power  §R25§!  £civ_factory  §R3§!"
decision_cost_build_ports_in_salonika_tooltip:0 "It costs £command_power  §Y25§! and  £civ_factory  §Y3§! to take the decision"
bolster_salonika_front:0 "Reinforce the Salonika Front"
bolster_salonika_front_desc:0 "The Allied Army of the Orient is holding the line around Salonika, but the front remains dangerously undermanned. By dispatching additional divisions, we can help strengthen the Entente presence there."
max_orient_divisions_tt:0 "Can send up to sent up to [?0.15|%Y0] of our ([?num_armies|Y0]) divisions to Salonika"
decision_cost_bolster_salonika_front:0 "£manpower_texticon §Y41K§!  £command_power §Y10§!"
decision_cost_bolster_salonika_front_blocked:0 "£manpower_texticon §R41K§!  £command_power §R10§!"
decision_cost_bolster_salonika_front_tooltip:0 "Taking this decision costs £manpower_texticon §Y41K§!  £command_power §Y10§!"
open_macedonia_front_theatre:0 "Open the Macedonian Front"
open_macedonia_front_theatre_desc:0 "With sufficient forces now concentrated at Salonika, the Army of the Orient can finally launch a full-scale offensive into Macedonia. 
macedonia_front_premove_tt:0 "§CActivating this theater will transfer key Greek territories to Allied control.§!"
decision_cost_open_macedonia_front_theatre:0 "£command_power §Y25§!"
decision_cost_open_macedonia_front_theatre_blocked:0 "£command_power §R25§!"
decision_cost_open_macedonia_front_theatre_tooltip:0 "Taking this decision costs £command_power §Y25§!"


