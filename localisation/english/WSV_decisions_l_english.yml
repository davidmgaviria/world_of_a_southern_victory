# Germany
germany_effects_of_blockade:0 "Effects of the Blockade"
germany_effects_of_blockade_desc:0 "The British are attempting to starve us into submission by blockading our coast.  We may have to implement rationing soon to delay the worst of the effects."
germany_ran_out_of_food:0 "Food Crisis"
germany_ran_out_of_food_desc:0 "The effects of the British blockade are starting to be felt.  If we cannot secure a food resource within the next few years, famine is likely to ensue."
greatwar_germany_offers_peace:0 "Request France for Peace"
greatwar_germany_offers_peace_desc:0 "Although we fought hard, the tide of war has turned against us.  The Entente is simply too strong.  We should cut our losses and sue for peace."

# AUH
 AUH_seperatism_in_the_empire_cat:0 "Separatism in the Empire"
 AUH_seperatism_in_the_empire_cat_desc:0 "The Austro-Hungarian Empire is a patchwork of nations and peoples, each with its own ambitions. Nationalist groups are demanding greater autonomy—or outright independence—threatening the fragile unity of the Dual Monarchy. If left unchecked, their agitation could tear the empire apart."
 AUH_italian_seperatists:0 "Italian Separatists"
 AUH_italian_seperatists_desc:0 "Italian nationalists in Trentino and along the southern frontier are agitating for separation from the empire. Their agitation undermines stability at home."
 AUH_galician_seperatists:0 "Galician Separatists"
 AUH_galician_seperatists_desc:0 "In Galicia, Polish and Ruthenian groups call for independence, challenging imperial control and fueling discontent."
 AUH_romanian_seperatists:0 "Romanian Separatists"
 AUH_romanian_seperatists_desc:0 "Romanian communities in Transylvania and Bukovina are agitating for unification with Romania, eroding stability within the empire."
 AUH_bosnian_rebels:0 "Bosnian Agitation"
 AUH_bosnian_rebels_desc:0 "Bosnian nationalist groups grow bolder, organizing underground resistance. Their efforts fuel unrest and increase resistance to imperial authority in Bosnia."
 AUH_seperatist_movements_map:0 "These states have seperatist movements."

AUH_empire_collapse_countdown:0 "Collapse of the Empire"
AUH_empire_collapse_countdown_desc:0 "The war has driven the Austro-Hungarian state to its breaking point, and now cracks are starting to appear.  If the war does not end soon, all will be lost."
greatwar_auh_offers_peace:0 "Request for Peace"
greatwar_auh_offers_peace_desc:0 "Although we fought hard, the tide of war has turned against us.  The Entente is simply too strong.  We should cut our losses and sue for peace."
