## Generic
politic_allow_suppress_opposition:0 "Can suppress opposition parties"
political_actions:0 "Political Actions"
anti_fascist_raids:0 "Anti-Fascist Raids"
anti_fascist_raids_desc:0 "We must crack down on fascist elements in our nation for the sake of long-term domestic stability. Their cult of violence and ultranationalist rhetoric risks dragging the country toward chaos."
anti_democratic_raids:0 "Anti-Democratic Raids"
anti_democratic_raids_desc:0 "We must crack down on democratic elements in our nation for the sake of long-term domestic stability. Their calls for elections and liberal reforms threaten to weaken state authority and fracture national unity."
anti_communist_raids:0 "Anti-Communist Raids"
anti_communist_raids_desc:0 "We must crack down on communist elements in our nation for the sake of long-term domestic stability. Their revolutionary agendas and efforts to mobilize the working class may spark unrest against the government."
anti_neutrality_raids:0 "Anti-Monarchist Raids"
anti_neutrality_raids_desc:0 "We must crack down on monarchist elements in our nation for the sake of long-term domestic stability. Their loyalty to the old order and ambitions to restore royal authority could endanger the government."
ban_fascist_party:0 "Ban Fascism"
ban_fascist_party_desc:0 "In the current situation, allowing fascist parties to continue to organize would undermine our ability to govern effectively. Drastic measures will need to be taken."
ban_fascist_party_tt:0 "Change in popularity of Fascism: §G-§![?.Root.party_popularity@fascism|%0G].\n"
ban_democratic_party:0 "Ban Democratic Parties"
ban_democratic_party_desc:0 "The parties in the political center have been a thorn in the side of our government for too long. Their insistence on the 'rights' of the individual undermine our efforts to create a better nation for the whole of our population."
ban_democratic_party_tt:0 "Change in popularity of Democracy: §G-§![?.Root.party_popularity@democratic|%0G].\n"
ban_communist_party:0 "Ban Communism"
ban_communist_party_desc:0 "The Communist Party has been protesting against the government at every turn, sowing discontent and making it hard to govern. It is time to crack down on this."
ban_communist_party_tt:0 "Change in popularity of Communism: §G-§![?.Root.party_popularity@communism|%0G].\n"
ban_neutrality_party_tt:0 "Change in popularity of Authoritarianism: §G-§![?.Root.party_popularity@neutrality|%0G].\n"
ban_neutrality_party:0 "Ban Monarchism"
banned_democratic_flag:0 "Has banned democratic parties"
banned_fascism_flag:0 "Has banned fascist parties"
banned_communism_flag:0 "Has banned communist parties"
banned_neutrality_flag:0 "Has banned monarchist parties"





