l_english:


# USA
USA_socialist_movement_cat:0 "The Socialist Movement"
USA_socialist_movement_cat_desc:0 "The previous decade has seen the Socialist Party grow in size like never before.  Previously a fringe minorities, the Socialists have now grown to eclipse the Republican Party, and stand as the main opposition against the Democrats.  Although a peaceful party for now, a radical wing has begun to emerge which espouses a more violent call to action.\n"
usa_socialist_militancy_cat_desc:0 "If this value reaches 100, Revolution will trigger."
american_socialist_revolution:0 "American Socialist Revolution has Occured"
usa_socialist_militancy_icon:0 "[?USA.usa_socialist_militancy|0H]"
usa_socialist_militancy_breakdown:0 "Socialist Militancy is currently at [?USA.usa_socialist_militancy|0H].\n§RIf this value reaches 100, there will be a revolution.§!"
USA_conduct_democrat_rally:0 "Conduct Democrat Rally"
USA_conduct_democrat_rally_desc:0 "The Socialists have been gaining in the polls.  We must double our own efforts."
USA_concessions_to_socialists:0 "Concessions to Socialists"
USA_concessions_to_socialists_desc:0 "Although not a savory idea, making concessions to the Socialists might temporarily satisfy them and prevent the more radical elements of the party from gaining too much traction."
militancy_lower_bounds_tt:0 "Has more than §Y35§! Socialist Militancy."
militancy_upper_bounds_tt:0 "Has less than §Y100§! Socialist Militancy."
USA_warplans_cat:0 "War Plans Department"
USA_warplans_cat_desc:0 "The War Plans Department is in charge of drafting up battle plans against possible future adversaries.  This means that if war comes, we will be more prepared to strike against whoever it may be."
USA_warplan_grey:0 "War Plan Grey"
USA_warplan_grey_desc:0 "We have yet to win a war with the Confederate states. Now, that changes."
USA_warplan_red:0 "War Plan Red"
USA_warplan_red_desc:0 "Canada has long represented a thorn in our northern flank. It is time to elimiante them."
USA_warplan_green:0 "War Plan Green"
USA_warplan_green_desc:0 "Mexico is a puppet of the Confederacy. It is time to elimiante them."
USA_barrel_roll_offensive:0 "Barrel Roll Offensive"
USA_barrel_roll_mission_desc:0 "If we amass enough barrels, we will surely be able to break through the Confederate lines.\n§RFailure to secure victory within 90 days of the start of the offensive will result in a drop in national morale.§!"
USA_barrel_roll_mission:0 "Barrel Roll Offensive Timeline"
greatwar_usa_offers_peace:0 "Request the CSA for Peace"
greatwar_usa_offers_peace_desc:0 "Although we fought hard, the tide of war has turned against us.  A war on two fronts is simply too much to bear.  We should cut our losses and sue for peace."
USA_new_monroe_doctrine_cat:0 "New Monroe Doctrine"
USA_new_monroe_doctrine_cat_desc:0 "We have declared the revival of the Monroe Doctrine, which stipulates that no European power should be involved in the Americas.  It is time to enforce this doctrine."
USA_liberate_mexico:0 "Liberate Mexico"
USA_liberate_cuba:0 "Liberate Cuba"
USA_liberate_puerto_rico:0 "Liberate Puerto Rico"
USA_liberate_the_caribbean:0 "Liberate the West Indies"

USA_struggle_in_latam_category:0 "The 'Little Game' in Latin America"
USA_struggle_in_latam_category_desc:0 "Since its inception, the Confederate States has sought to expand into Latin America -- annexing Cuba in the 1870's and northern Mexico in 1881. Now the CSA wishes to expand even further, and ultimately to build a canal in Nicaragua. We cannot allow this to happen. Our foothold in Haiti is a start, but we must do more if we are to win this 'Little Game'.\n"
usa_influence_in_latam_icon:0 "[?Root.usa_influence_in_latam|0H]"
usa_influence_in_latam_breakdown:0 "[Root.GetNameDefCap] has [?Root.usa_influence_in_latam|+0] §HInfluence§! in Latin America"
USA_send_guns_haiti:0 "Send Guns to the Haitian Government"
USA_send_guns_haiti_desc:0 "The Haitian government is in dire need of firearms. We should send over some spares."
sent_guns_to_haiti_flag:0 "Sent Guns to the Haitian Government"
USA_send_warship_support_haiti:0 "Bombard Rebel Positions in Haiti"
USA_send_warship_support_haiti_desc:0 "Although the Haitian government lacks artillery, our cruisers can provide much needed fire support to the governemt forces.\n§RWill raise tensions with the CSA.§!"



# CSA
greatwar_csa_peace_with_america:0 "Request the United States for Peace"
greatwar_csa_peace_with_america_desc:0 "Although we fought hard, the tide of war has turned against us.  There are just too many damn Yankees, and not enough of us.  We should cut our losses and sue for peace."
CSA_warplans:0 "War Plans"
CSA_warplan_DESC:0 "If we are to fight the U.S. in the future, we must be fully prepared for the struggle to come.  Drafting plans for a future war will aid us in this."
CSA_warplan_lee:0 "War Plan Lee"
CSA_warplan_lee_desc:0 "Named after the famous offensive mastermind Robert E. Lee, this plan calls for a lightning strike into Maryland, taking Washington D.C. and Philadelphia to knock out the US in one decisive blow."
CSA_warplan_stonewall:0 "War Plan Stonewall"
CSA_warplan_stonewall_desc:0 "Named after the famous defensive mastermind 'Stonewall' Jackson, this plan calls for a defensive and attritional style war, to wear down the U.S. forces before counter-attacking."
CSA_actions_in_latam_category:0 "Expansion in Latin America"
CSA_actions_in_latam_category_desc:0 "There are many in the Confederacy that have long advocated for expansion into Latin America--particularly the Caribbean and Central America.  Now that we have built a robust army and navy, and have a President sympathetic to the idea, we should work to expand our economic, political, and military influence here.\n"
csa_influence_in_latam_icon:0 "[?Root.csa_influence_in_latam|0H]"
csa_influence_in_latam_breakdown:0 "[Root.GetNameDefCap] has [?Root.csa_influence_in_latam|+0] §HInfluence§! in Latin America"
CSA_expand_confederate_business:0 "Expand Confederate Business Holdings"
CSA_expand_confederate_business_desc:0 "Expanding Confederate businesses throughout the region will strengthen our economic power, as well as give us plausible pretext for furture interventions."
CSA_support_conservative_regimes:0 "Support Conseravtive Regimes"
CSA_support_conservative_regimes_desc:0 "The nationalists and liberals in Latin America oppose our influence in the region.  Providing military support to the local conservative governments will allow us to suppress these movements."
CSA_decision_cost_support_conservatives:0 "£infantry_equipment_text_icon §Y2500§!"
CSA_decision_cost_support_conservatives_blocked:0 "£infantry_equipment_text_icon  §R2500§!"
CSA_intervene_in_nic_conflict:0 "Intervention in Nicaragua"
CSA_intervene_in_nic_conflict_desc:0 "The violence in Nicaragua threatens to damage our businesses and threaten our citizens in the region.  An intervention in the country is thus not only necessary, but our duty.  In any case, occupying the country might allow us to build that canal we always wanted...\n§RThe United States will likely oppose our move!§!"
has_latam_influence_2_tt:0 "Has §Y50§! or more §YInfluence§! in Latin America"
nicaragua_intervention:0 "Intervened in Nicaragua"
csa_intervened_in_nicaragua:0 "The Confederacy Intervened in Nicaragua"
nicaragua_crisis_over:0 "Nicaragua Crisis Is Over"
CSA_conquer_latam_country:0 "Conquer [From.GetNameDef]"
CSA_conquer_latam_country_desc:0 ""
latam_country_not_with_major_tt:0 "Is not in a faction with or protected by a major."
CSA_build_nicaragua_canal:0 "Build the Nicaragua Canal"
CSA_build_nicaragua_canal_desc:0 "We can finally achieve the dream of connecting the Pacific Ocean and Caribbean Sea."
CSA_decision_cost_build_nicaragua_canal:0 "£pol_power  §Y100§!  £civ_factory  §Y5§!"
CSA_decision_cost_build_nicaragua_canal_blocked:0 "£pol_power  §R100§!  £civ_factory  §R5§!"
CSA_decision_cost_build_nicaragua_canal_tooltip:0 "It costs £pol_power  §Y100§! and  £civ_factory  §Y5§! to take the decision"
opens_nicaragua_canal_tt:0 "Opens the §YNicaragua Canal§! for transit."
CSA_send_guns_haiti:0 "Send Guns to Haitian Rebels"
CSA_send_guns_haiti_desc:0 "Although the conflict in Haiti isnt much of our concern, sending guns to the rebels could prolonge the conflict and weaken the U.S. presence in the area."
CSA_send_guns_DR:0 "Send Guns to the Dominican Government"
CSA_send_guns_DR_desc:0 "The Dominican government is in dire need of firearms. We should send over some spares."
sent_guns_to_dr_flag:0 "Sent Guns to the Dominican Government"
CSA_send_warship_support_DR:0 "Bombard Rebel Positions in the DR"
CSA_send_warship_support_DR_desc:0 "Although the Dominican government lacks artillery, our cruisers can provide much needed fire support to the governemt forces.\n§RWill raise tensions with the USA.§!"
CSA_red_rebellion_management_cat:0 "Red Rebellion"
CSA_red_rebellion_management_cat_desc:0 "Blacks across the South have taken up arms against us and are attempting to establish their own 'socialist republics'.  If the situation continues to deteriorate, it could seriously hamper our war efforts against the United States.  We must crush these revolts as quickly as possible."
CSA_red_rebellion_state_management_map:0 "These states contain Red rebels."
CSA_red_rebels_resistance_escalation_mission:0 "Red Rebellion Escalates"
contains_red_rebels:0 "Contains Red Rebels"
less_than_two_operations_ongoing_tt:0 "Has less than two Ongoing Operations"
CSA_counter_rebels_in_virginia:0 "Counter Rebels in Virginia"
CSA_counter_rebels_in_north_carolina:0 "Counter Rebels in North Carolina"
CSA_counter_rebels_in_south_carolina:0 "Counter Rebels in South Carolina"
CSA_counter_rebels_in_gerogia:0 "Counter Rebels in Georgia"
CSA_counter_rebels_in_alabama:0 "Counter Rebels in Alabama"
CSA_counter_rebels_in_missisippi:0 "Counter Rebels in Mississippi"
CSA_counter_rebels_in_louisiana:0 "Counter Rebels in Louisiana"
CSA_decision_cost_red_rebels:0 "£command_power  §Y10§!"
CSA_decision_cost_red_rebels_blocked:0 "£command_power  §R10§!"
anti_rebel_operation_cooldown:0 "Recently Conducted Counter-Rebel Operation"
CSA_loans_to_allies_cat:0 "War Loans to Allies"
CSA_loans_to_allies_cat_desc:0 "Although we are not currently at war with Germany, they nevertheless represent a threat to our allies and thus our vital interests.  We can help our allies in their fight by sending them war loans."
CSA_send_loan_to_country:0 "Send War Loan to [From.GetName]"
CSA_fallout_red_revolt_cat:0 "Fallout of the Red Revolt"
CSA_fallout_red_revolt_cat_desc:0 "Our preliminary investigation into the Red Revolt revealed some shocking evidence of corruption within the military, which hindered our response to the Red Revolt.  We should take steps to eradicate this corruption."
CSA_ban_personal_servants:0 "Outlaw Personal Servants at the Front"
CSA_ban_personal_servants_desc:0 "More than one revolutionary was originally employed at the front as a personal servant.  Some of these were reported for suspicious activity shortly before the Red Revolt, but were shielded from investigation by their master.  The practice of personal servants must thus go."
CSA_ban_personal_servants_cost:0 "£command_power  §Y10§!  £pol_power  §Y25§!"
CSA_ban_personal_servants_blocked:0 "£command_power  §R10§!  £pol_power  §R25§!"
CSA_ban_personal_servants_tooltip:0 "It costs £command_power  §Y10§! and  £pol_power  §Y25§! to take the decision"
investigation_1_complete:0 "Has Outlawed Personal Servants"
CSA_expand_officer_corps:0 "Expand the Officer Corps"
CSA_expand_officer_corps_desc:0 "An effective military response to the Red Revolt was originally hampered due to large amounts of incompetent officers, who had only attained their position through family ties.  We must thus fire these officers and expand our officer corps."
CSA_expand_officer_corps_cost:0 "£command_power  §Y10§!  £pol_power  §Y50§!"
CSA_expand_officer_corps_blocked:0 "£command_power  §R10§!  £pol_power  §R50§!"
CSA_expand_officer_corps_tooltip:0 "It costs £command_power  §Y10§! and  £pol_power  §Y50§! to take the decision"
investigation_2_complete:0 "Has Expanded the Officer Corps"
CSA_purge_general_staff:0 "Purge the General Staff"
CSA_purge_general_staff_desc:0 "It turns out the corruption and nepotism in our military extends all the way up to the General Staff. Although firing them would be the right thing to do, it may have serious effects on our military preformance in the immediate aftermath."
CSA_purge_general_staff_cost:0 "£command_power  §Y25§!  £pol_power  §Y100§!"
CSA_purge_general_staff_blocked:0 "£command_power  §R25§!  £pol_power  §R100§!"
CSA_purge_general_staff_tooltip:0 "It costs £command_power  §Y25§! and  £pol_power  §Y100§! to take the decision"
removed_as_unit_leader_tt:0 "§RWill be removed as a General§!."
removed_nepotism_tt:0 "§GWill remove Military Nepotism§!."

# CAN
CAN_warplans_cat:0 "War Plans Office"
CAN_warplan_white:0 "War Plan White"
CAN_warplan_red:0 "War Plan Red"

# GER
germany_schliffen_plan:0 "Schliffen Plan"
germany_schliffen_plan_desc:0 "The brainchild of Field Marshal Alfred von Schlieffen, this plan calls for a rapid thrust through the Lowlands in order to outflank the French Army and capture Paris with ease.  However, there is one significant drawback: the independence of Belgium is guaranteed by Great Britain."
germany_build_supply_in_belgium:0 "Build Supply Lines in Belgium"
germany_build_supply_in_belgium_cost:0 "£command_power  §Y25§!  £civ_factory §Y3§!"
germany_build_supply_in_belgium_blocked:0 "£command_power  §R25§!  £civ_factory  §R3§!"
germany_build_supply_in_belgium_tooltip:0 "It costs £command_power  §Y25§! and  £civ_factory  §Y3§! to take the decision"

# ENG
england_make_faction_with_csa:0 "Form the 'Americas Defense Coalition'"
csa_must_agree_to_faction_tt:0 "§RThe Confederate States must agree to form a faction.§!"
csa_declined_faction_with_england:0 "Confederates declined to form a faction with us."

# FRA
FRA_unrest_in_morocco:0 "Unrest in Morocco"
FRA_unrest_in_morocco_desc:0 "French authority in Morocco remains fragile. Tribal resistance, urban agitation, and the weakness of the Sultanate threaten to undo years of diplomatic pressure and informal control. Unless order is restored, French influence may collapse entirely."
FRA_ongoing_revolt_in_morocco:0 "Ongoing Revolt in Morocco"
FRA_ongoing_revolt_in_morocco_desc:0 "Insurrectionary forces across Morocco challenge French advisors and loyalist authorities. Without decisive action, the situation may spiral beyond our control, jeopardizing French interests and prestige in North Africa."
morocco_is_free_or_fake_tt:0 "§YMorocco§! is either independent or does not exist."
failure_in_morocco_effect_tt:0 "§RFailure to crush the revolt will result in Morocco breaking free from France.§!"
france_failing_army_morale:0 "Failing Army Morale"
france_failing_army_morale_desc:0 "The prolonged war and high casualties from fruitless offensives have shattered the morale of the average French soldier.  Whispers have broken out amongst the ranks of disobeying orders."
FRA_warplan_17_decision:0 "Activate Plan XVII"
FRA_warplan_17_decision_desc:0 "The time has come to embrace offensive doctrine. Our armies stand ready to advance into Alsace-Lorraine, seize the initiative, and carry the war onto German soil through speed and determination."
FRA_warplan_15_decision:0 "Activate Plan XV"
FRA_warplan_15_decision_desc:0 "We prepare to meet the German assault with discipline and caution. By holding the frontier and coordinating with our allies, we will absorb the initial blow before launching a decisive counteroffensive."


# RUS
RUS_lena_massacre_aftermath_category:0 "The Lena Massacre"
RUS_conduct_brief_investigation:0 "Order a Brief Inquiry"
RUS_conduct_brief_investigation_desc:0 "Commission a swift internal review of the incident. The findings will be kept narrow and the conclusions favorable to the authorities involved."
RUS_conduct_long_investigation:0 "Open a Full Investigation"
RUS_conduct_long_investigation_desc:0 "Appoint an independent commission to conduct a thorough inquiry into the killings. The process will be lengthy and the findings unpredictable, but it may be the only way to credibly address public outrage."
RUS_provisional_gov_category:0 "Russian Provisional Government"
RUS_provisional_gov_category_desc:0 "The Tsar has abdicated, and Russia now stands at a crossroads. The Provisional Government, born from the ashes of autocracy, must steer the nation through chaos while sharing power with the Soviets. They demand peace, land, and bread—while we struggle to preserve order, the front, and our fragile democracy. If we cannot stabilize the situation soon, our hard-won revolution may give way to something far more radical."
RUS_distribute_grain:0 "Distribute Grain to the People"
RUS_distribute_grain_desc:0 "Unrest in the countryside threatens the stability of the government. By releasing grain reserves to feed the hungry, we can calm tempers and restore faith in the Provisional Government."
RUS_patriotic_speeches:0 "Deliver Patriotic Speeches"
RUS_patriotic_speeches_desc:0 "Through passionate appeals to national pride and duty, we can remind the people of the importance of continuing the struggle and strengthen support for the war effort."
RUS_prepare_kerensky_offensive:0 "Prepare the Kerensky Offensive"
RUS_prepare_kerensky_offensive_desc:0 "Plans are being drawn up for a large-scale summer offensive intended to restore confidence in the army and the government. Supplies are gathered, officers are briefed, and preparations begin."
RUS_decision_cost_prepare_keresky_off:0 "£command_power  §Y25§!"
RUS_decision_cost_prepare_keresky_off_blocked:0 "£command_power  §R25§!"
RUS_launch_kerensky_offensive:0 "The Kerensky Offensive"
RUS_launch_kerensky_offensive_desc:0 "The time has come to act. With the plans drawn and the army prepared, the Provisional Government orders the Kerensky Offensive to commence—our last chance to salvage victory from chaos."
RUS_decision_cost_start_keresky_off:0 "£command_power  §Y10§!"
RUS_decision_cost_start_keresky_off_blocked:0 "£command_power  §R10§!"
RUS_october_revolution:0 "Impending Bolshevik Coup"
RUS_october_revolution_desc:0 "The Bolsheviks grow bolder with each passing day, rallying soldiers, workers, and peasants to their cause. Their agitation threatens to ignite a full-scale uprising against our government. If we cannot suppress their influence and stabilize the country before it’s too late, they will seize power by force — plunging Russia into civil war. Time is running out."

# TUR
TUR_military_reforms_cat:0 "Ottoman Army Reforms"
TUR_military_reforms_cat_desc:0 "The Tripolitania War and the First Balkan War have show us just how out of date our army is.  We must conduct serious reforms in order to turn it into a modern fighting force."
TUR_military_reform_cost:0 "£command_power  §Y10§!  £pol_power  §Y50§!"
TUR_military_reform_cost_blocked:0 "£command_power  §R10§!  £pol_power  §R50§!"
TUR_military_reform_cost_tooltip:0 "It costs £command_power  §Y10§! and  £pol_power  §Y50§! to take the decision"
conducting_ottoman_army_reform:0 "Currently conducting army reforms"
TUR_reform_conscription_law:0 "Reform the Conscription Law"
TUR_reform_conscription_law_desc:0 "Various excemptions have allowed many in our empire to avoid service in the army.  We must get rid of these excemptions."
TUR_purge_army_officers:0 "Purge Army Officers"
TUR_purge_army_officers_desc:0 "Many officers proved themselves incompetent during the past two wars.  We must get rid of them."
TUR_purchase_foriegn_equipment:0 "Purchase Foriegn Equipment"
TUR_purchase_foriegn_equipment_desc:0 "The equipment of our army is seriously outdated. We should purchase new equipment for our troops."

# SER
SER_flee_through_albania:0 "Flee Through Albania"
SER_flee_through_albania_desc:0 "Our forces are in retreat, and in danger of being cut off.  Luckily we can flee through neutral and lawless Albania to reach the sea and escape."

# BUL
bulgaria_offers_peace:0 "Request the Entente for Peace"
bulgaria_offers_peace_desc:0 "The war is lost, it is time to sue for peace."

# GRE
GRE_national_schism_cat:0 "Greek National Schism"
GRE_national_schism_cat_desc:0 "The Entente landings have caused a political crisis in Greece, and our government is torn over whether to aid the Entente or to remain neutral. The Prime Minister supports the former, while the King supports the later.  One of the two must give."
greek_political_standoff:0 "Political Stand-Off in Greece"
greek_political_standoff_desc:0 "Greece is a ticking timebomb. It is not long before the country splits in two."
greek_splits_in_two_tt:0 "§RThe Greek National Front will take control over Northern Greece and join the Entente.§!"

# JAP
japan_whitepeace_with_germany:0 "Peace Out with Germany"
japan_whitepeace_with_germany_desc:0 "The Entente has lost the war.  We should quit fighting while we are ahead."
japan_whitepeace_with_USA:0 "Peace Out with United States"
japan_whitepeace_with_USA_desc:0 "The Entente has lost the war.  We should quit fighting while we are ahead."

# Agadir Crisis
agadir_crisis_cat:0 "The Agadir Crisis"
agadir_crisis_cat_desc:0 "The French occupation of Morocco has sparked a crisis amongst the European powers.  Germany claims France has exceeded its mandate in Morocco, and refuses to let this go unopposed.  If Europe does not tread carefully, it may find itself embroiled in a colonial war."
agadir_relevance_of_morocco_occupation:0 "Relevance of the Morocco Occupation"
agadir_relevance_of_morocco_occupation_desc:0 "Europe will only care about the French occupation for so long.  We thus have a limited time to act."
france_occupies_morocco:0 "France Has Occupied Morocco"
agadir_crisis_over:0 "Agadir Crisis is Over"
britain_response_to_agadir:0 "Britain Responded to the Crisis"
agadir_germany_send_gunboat:0 "Send a Gunboat to Agadir"
agadir_germany_send_gunboat_desc:0 "We cannot let the French take Morocco unopposed.  Send a gunboat to assert our interests."
agadir_germany_demands_compensation:0 "Demand Territorial Compensation"
agadir_germany_demands_compensation_desc:0 "We will accept French occupation of Morocco, so long as they give us something in return."
agadir_negoitations_begin_tt:0 "§LWe will demand territory in Africa from France as compensation for their occupation of Morroco.  The nature of the compensation will be determined by the negotiations.§!"
agadir_negotiations_ongoing:0 "Ongoing Negotiations over the Agadir Crisis"
agadir_negotiation_timeout_mission:0 "Ongoing Negotiations over Compensation"
agadir_negotiation_timeout_mission_desc:0 "The Germans and French are busy discussing a diplomatic resolution to the Agadir Crisis. Let us hope they can come to an agreement, for everyone's sake."
end_of_negotiations_is_bad_tt:0 "§RFailure to reach a compromise through negotiation will have negative reprocussions."
agadir_germany_escalates_crisis:0 "Escalate the Crisis"
agadir_germany_escalates_crisis_desc:0 "The French have exceeded their mandate by occupying Morocco.  They must withdraw at once."
likely_war_with_france_tt:0 "§RWill likely lead to war with France.§!"
we_can_intervene_in_agadir_tt:0 "Unlocks the §YAgadir Crisis§! Decisions."
agadir_compromise_implementation_delay_mission:0 "Implementing the Agadir Agreement"
agadir_compromise_implementation_delay_mission_desc:0 "The terms of the Agadir settlement are currently being processed. Final transfers and arrangements will be completed once the implementation period expires."

# Italo-Turkish War
italoturkish_war_cat:0 "Italo-Turkish War"
italoturkish_war_cat_desc:0 "Italy has asserted its claim over Libya and launched a military expedition to seize the region by force. Though the Ottomans are stretched thin, local resistance and the harsh desert may yet slow the Italian advance. The world now watches to see whether this colonial gamble will succeed."
ITA_libyan_theatre_map:0 "Area of operations in Libya§W\n\n§YStats:§!\n\tAction Points availabe: [?italoturkish_action_points|Y0]\n\tActive troops: [?italoturkish_troops_active|Y0]\n\tCasualties: [?italoturkish_casualties|Y0]\n\n"

italoturkish_expedition_first_deadline:0 "Promise of a Short War"
italoturkish_expedition_first_deadline_desc:0 "The government promised a rapid victory in Libya, claiming the Ottomans would collapse after a brief show of force. As the days pass, pressure mounts to achieve visible success before support begins to waver."
italoturkish_expedition_second_deadline:0 "Great Power Intervention"
italoturkish_expedition_second_deadline_desc:0 "After over a year of stalemate in North Africa, the Great Powers are growing impatient. European diplomats pressure both Rome and Constantinople to put down their arms and negotiate — the world no longer tolerates this costly war."
ongoing_combat_action:0 "Has ongoing combat."

italy_attack_libyan_state_x:0 "Launch Offensive in [From.GetName]"
italy_moves_left_in_libya_tt:0 "Has free moves available in Libya"
ITA_attack_libyan_state_cost:0 "£command_power  §Y10§!"
ITA_attack_libyan_state_cost_blocked:0 "£command_power  §R10§!"
italoturkish_recuperating_from_attack:0 "Troops are regrouping after an attack"
italoturkish_is_preparing_attack:0 "Is preparing an attack"
italy_increase_war_spending:0 "Increase Spending for the War Effort"
italy_increase_war_spending_desc:0 "The war in Libya has dragged on for longer than we anticipated.  We need to increase funding to ensure our army can secure victory in the field."
ITA_italoturkish_long_war:0 "Italo-Turkish war is dragging on."
italy_sieze_the_dodecanese:0 "Seize the Dodecanese Islands"
italy_sieze_the_dodecanese_desc:0 "After over half a year of war, our naval command proposes a swift strike into the Aegean. By landing forces on Rhodes and the surrounding Dodecanese, we can tighten the pressure on the Ottomans and undermine their control of the Eastern Mediterranean. The operation is expected to be brief but decisive."
ITA_dodecanese_operation_cost:0 "£command_power  §Y50§!"
ITA_dodecanese_operation_cost_blocked:0 "£command_power  §R50§!"
ITA_italoturkisk_delay_for_dodecanese:0 "Italo-Turkish war has lasted over 7 months."
TUR_raise_libyan_troops_decision:0 "Raise Local Libyan Troops"
TUR_raise_libyan_troops_decision_desc:0 "Although the Italian navy is blocking our supply lines to Libya, we can still raise local Libyan fighters to defend the province."
TUR_raise_libyan_troops_cost:0 "£command_power  §Y25§!"
TUR_raise_libyan_troops_cost_blocked:0 "£command_power  §R25§!"

