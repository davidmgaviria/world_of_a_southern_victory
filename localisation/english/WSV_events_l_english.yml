l_english:


# Intro
# TODO -- breaking something, idk why
wsv_intro.1.t:0 "Introduction" 
wsv_intro.1.d:0 "Welcome to World of a Southern Victory!  This mod is an adaptation of Harry Turtledove’s “Southern Victory” series, and attempts to replicate the canonical events of the series while also giving players some flexibility in how events play out.  Keep in mind that due to being a one-man team, I have had to focus my efforts on developing content for North America, and have thus neglected aspects of the European nations.  Furthermore, as there is already a World War II mod for Southern Victory, I focused my work more on the Great War section of this mod.  However, I hope to be able to create content for Europe and the Second Great War some time in the future.\n\nI would also like to acknowledge the Wolferos Great War mod, on which this mod is built upon, as well as Kaiserreich, Road to 56, and the Great War Redux, which I have taken some content and ideas from."
wsv_intro.1.a:0 "Continue"
wsv_intro.2.t:0 "Scripted Peace Deals" 
wsv_intro.2.d:0 "In order to mirror the events of the novels as closely as possible, I have included the canonical peace deals of the series for the Great War.  Although I understand these may limit the freedom of the players, I felt it was the best way to represent the series in game.  However, to maintain flexibility, I have also included an alt-alt history peace deal for the Confederacy winning in the Great War, as well as the OTL peace deals of World War I for the Central Powers.  In the future I hope to expand these peace deals into the Second Great War." 
wsv_intro.2.a:0 "Continue" 
wsv_intro.3.t:0 "A Note on Deals" 
wsv_intro.3.d:0 "Due to the being a one-man team, this mod is not compatible with most DLCS.  Specifically, it is NOT compatible with either La Resistance, Man the Guns, No Step Back, and By Blood Alone.  Thus, if you see tech issues with either tanks, the aircraft, or navy, you likely have one of these DLCS enabled.  The other HoI4 DLCS (Waking the Tiger, Death Before Dishonor, and Together for Victory) may work with the mod, but compatibility is not guaranteed." 
wsv_intro.3.a:0 "Understood, lets get started!"  


# USA
wsv_usa.1.t:0 "Remembrance Day"
wsv_usa.1.d:0 "As another April 22 dawns, the United States once again mourns the day of Remembrance.  All across the nations, solemn parades are held, the American flag waving upside down to mark the distress of the people.  Hundreds of thousands of men in uniform march silently; behind them the veterans of the Second Mexican War and the War of Secession follow.  For those outside the U.S. these yearly parades have become a strange almost cult-like ritual.  But for the American people, it is a reminder of what has been lost, and a promise of retribution against those who took it."
wsv_usa.1.a:0 "We will avenge that which we have lost"
wsv_usa.2.t:0 "State of U.S. Politics"
wsv_usa.2.d:0 "The current state of U.S. politics is complex.  Although the Democrats have mantained a monopoly on power for the past 30 years, the Socialists have now secured a sizeable delegation in Congress--placing them as our main rivals.  In an attempt to force us to negociate, they are now blocking many of our bills, including ones on military spending.  Some Democrats, such as Theodore Roosevlt, argue we should negociate with the Socialists.  Others still suggest that by strengthing the influence of the Army, we could possibly bypass our rivals all together..."
wsv_usa.2.a:0 "We must try to work together"
unlock_socialist_path_tt:0 "Will unlock §Y'Begin Negocitations with the Socialists'§! focus."
wsv_usa.2.b:0 "Reach out to the Army"
unlock_army_path_tt:0 "Will unlock §Y'Increase Influence of the Army'§! focus."
usa_work_with_socialists:0 "Has Decided to Work with the Socialists"
usa_favour_the_army:0 "Has Favored the Army"
wsv_usa.3.t:0 "1912 Presidential Election"
wsv_usa.3.d:0 "The end of 1912 brings another presidential election.  Although the Socialists have been growing in popularity in recent years, the Democrats are all but assured to win the election.  However, who will lead the Democrat party is a different matter all together.  On one hand there is Theodore Roosevelt, who is by all accounts a true patriot, but nevertheless seeks to work with the socialists in helping the working class.  On the other side is Leonard Wood, who is an even more ardent nationalist than Roosevelt, and holds nothing but contempt for the Socialists.  Who should it be...?"
wsv_usa.3.a:0 "Teddy Roosevelt for President!"
wsv_usa.3.b:0 "Leonard Wood for President!"
teddy_becomes_president_tt:0 "§LTeddy Roosevelt becomes the President§!"
wood_becomes_president_tt:0 "§LLeonard Wood becomes the President§!"
wsv_usa.4.t:0 "Theodore Roosevelt Becomes President of the U.S."
wsv_usa.4.d:0 "Theodore Roosevelt has become the new President of the United States.  A towering figure in U.S. politics, Roosevelt is known for his populist pro-labour stance, as well as being an ardent American nationalist.  He also served with distinction in the Second Mexican War, beating back a Canadian assault in the far West.  Now has president, he promises to not let the British or Confederates push the U.S. around one bit."
wsv_usa.4.a:0 "A political shake up"
wsv_usa.5.t:0 "Leonard Wood Becomes President of the U.S."
wsv_usa.5.d:0 "U.S. Army General Leonard Wood has become the new President of the United States.  Running as the Democrat candidate, he swept the election, much to the chagrin of the Socialists in the United States and abroad.  Now in office, he seems poised to expand the size of the U.S. Army, though whether he plans to do this by legal means or otherwise is yet to be seen..."
wsv_usa.5.a:0 "A political shake up"
wsv_usa.6.t:0 "Strikes!"
wsv_usa.6.d:0 "Discontent with the labor conditions, workers have gone on strike, demanding better pay.  Although simply ignoring the strikes may make them go away, more likely than not we will have to act."
wsv_usa.6.a:0 "Ignore them"
wsv_usa.6.b:0 "Attempt to negociate"
wsv_usa.6.c:0 "Send in the army"
wsv_usa.7.t:0 "Strikes End"
wsv_usa.7.d:0 "Through a combination of stalling, concessions, and force, the strikes have been broken up, and the workers have returned to work."
wsv_usa.7.a:0 "Finally"
wsv_usa.9.t:0 "Review the Naval Budget"
wsv_usa.9.d:0 "The time has come to review the spending allocated for the navy.  Should we splurge on the latest ships and guns, cut back spending drastically, or meet somewhere in the middle?"
wsv_usa.9.a:0 "Spare no expense!"
wsv_usa.9.b:0 "A moderate funding should suffice"
wsv_usa.9.c:0 "We're kind of tight on money..."
wsv_usa.10.t:0 "Failing Public Confidence"
wsv_usa.10.d:0 "Despite our promises to punish the Confederate States and Britain, we have yet to enter any war.  The public is beginning to lose confidence in our ability to lead the country, and if we dont act soon we may be voted out of office."
wsv_usa.10.a:0 "We should probably act soon"
wsv_usa.11.t:0 "The 1916 Election"
wsv_usa.11.d:0 "The 1916 election is here... and the United States isn't at war.  Well the Socialists have only been growing in power, and due to the Democrats failing to deliver the vegenance so sought by the American people, it seems like its time for a change in leadership."
wsv_usa.11:0 "The Socialist come to power"
wsv_usa.12.t:0 "Eugene V. Debs Becomes President of the United States"
wsv_usa.12.d:0 "In a stunning upset, the Socialist candidate Eugene V. Debs has won the presidency of the United States.  An ardent opponent of war, Debs has repeatedly promised that once in office he will avoid war with the Entente. Undoubtedly the ascension of the Socialists to power in the United States will prevent any offensive American war in the future."
wsv_usa.12.a:0 "Why were you sitting on your butt?"
wsv_usa.12.b:0 "An interesting turn of events"
wsv_usa.14.t:0 "Socialist Opposition to the War"
wsv_usa.14.d:0 "Although the majority of the Socialist Party has agreed to support the war effort for now, some of its more radical members have refused to do so.  They have called our war 'imperialist' and vow to oppose our efforts in Congress."
wsv_usa.14.a:0 "They may become an issue"
wsv_usa.15.t:0 "Riot in NYC on Rememberance Day"
wsv_usa.15.d:0 "With the outbreak of the war, Rememberance Day this year was particularly tense.  However in New York City emotions came to a boil when socialist activists staged an anti-war protest at the same time as the Remeberance parade.  Enraged, local onlookers attacked the protestors, and brawl eventually devolved into a general mayhem spanning several city blocks.  New York police were deployed in force to quell the fighting, and scores of socialists were arrested."
wsv_usa.15.a:0 "What a mess"
wsv_usa.16.t:0 "Anti-War Demonstations"
wsv_usa.16.d:0 "With the war dragging on and the casualty list growing every day, citizens--particularly Socialist ones--have begun calling for a diplomatic exit to the war.  Although these type of demonstrations can be seen in other nations, their existence here is troubling."
wsv_usa.16.a:0 "Have a spine cowards"
wsv_usa.17.t:0 "1916 Presidential Election"
wsv_usa.17.d:0 "The ongoing war makes the 1916 election a cruical one.  With the Democrats in favor of continuing the war on one side, and the Socialists advocating for a just peace on the other, whoever wins this election could determine whether the United States comes out of this war victorious--or defeated."
wsv_usa.17.a:0 "Teddy Roosevelt stays in office!"
TR_remains_president_tt:0 "§LTheodore Roosevelt remains President§!"
wsv_usa.17.b:0 "The Socialist pull an unexpected victory..."
debs_becomes_president_tt:0 "§LEugene V. Debs becomes President§!"
wsv_usa.18.t:0 "Socialist Block War Funds"
wsv_usa.18.d:0 "The Socialist calls for an end to the war have grown louder and louder.  Now they have decided to block funds to the military in an effort to force our hand to the negociating table with the Confederates."
wsv_usa.18.a:0 "Perhaps we can appease them somehow.."
wsv_usa.20.t:0 "Socialist Opposition to the War"
wsv_usa.20.d:0 "The majority of the Socialist Party has denounced our ongoing war as imperalist and ignoring the needs of the people.  Although a large portion of the population still supports us, the Socialist defiance should be addressed soon."
wsv_usa.20.a:0 "What a nuisance"
wsv_usa.21.t:0 "The 1916 Election"
wsv_usa.21.d:0 "The longer-than-expected duration of the war has disillusioned a large portion of the people, and the Socialists are attempting to capitalize on this by campaigning on a platform of 'peace without annexations'. It seems it is possible we might lose the election, and some of the General Staff have proposed nullifying the election results if this is the case.  Sure it won't come to that though?"
wsv_usa.21.a:0 "We win.. the scare was for nothing"
woods_remains_president_tt:0 "Leonard Wood will remain as President"
wsv_usa.21.b:0 "Debs wins... we will step down"
wsv_usa.21.c:0 "Debs wins... we must nullify the election"
likely_lead_to_usa_civil_war_tt:0 "§RWill likely lead to civil war in the near future§!"
wsv_usa.22.t:0 "Military Coup in the United States"
wsv_usa.22.d:0 "The recent elections in the U.S. saw Socialist candidate Eugene V. Debs come out victorious over the incumbent Leonard Wood.  Not willing to relinquish power and the war effort however, Wood has now declared the election results 'null and void' due to 'manipulations from enemy nations'.  He further proclaimed that until the war is over, all elections will be paused and Congress will be in recess.  American soldiers have now arrested Eugene V. Debs and have taken control of the Congress building, and Philadelphia has been placed under martial law."
wsv_usa.22.a:0 "We did what we must"
wsv_usa.22.b:0 "Unreal!"
wsv_usa.23.t:0 "Mass Protests For Democracy"
wsv_usa.23.d:0 "Protestors are gathering in the hundreds of thousands across the nation to protest the nullifcation of the election results.  Ranging from anti-war Socialists to previously staunch Democrats, it seems all of American society has mobilized to protest our actions.  We knew suspending the elections would be unpopular, but never to this degree..."
wsv_usa.23.a:0 "Send the army to disperse them"
wsv_usa.40.t:0 "Eugene V. Debs Becomes President of the United States"
wsv_usa.40.d:0 "In a stunning upset, the Socialist candidate Eugene V. Debs has won the presidency of the United States.  An ardent opponent of the war, Debs has repeatedly promised that once in office he will end the war with the Confederate States.  Whether he carries through on his promise is to be seen, but undoubtedly the ascension of the Socialists to power in the United States will seriously undermine the American war effort."
wsv_usa.40.a:0 "A catastrophe"
wsv_usa.40.b:0 "An interesting turn of events"
wsv_usa.41.t:0 "Begin Peace Negociations with the Confederates"
wsv_usa.41.d:0 "Now that the new administration has fully taken power, it is time to end this wretched war and begin peace negociations with the Confederates. Hopefully they will accept a peace with honor."
wsv_usa.41.a:0 "Begin negociations"
wsv_usa.42.t:0 "United States Sends a Peace Offer"
wsv_usa.42.d:0 "The Socialist administration of [USA.GetLeader] has sent us an offer of peace.  They are asking for 'peace without annexations', and suggest that our two countries return to a 'status quo ante bellum'. They emphasizes that they cannot accept a punitive peace, but hope that our two countries can come to an agreement for a 'peace with honor'."
wsv_usa.42.a:0 "We have our own terms"
confederate_compromise_peace_terms_tt:0 "§LWe will demand Appalachia and the Missouri Tip. We will also demand that the U.S. demilitarize Maryland, and accept our control over Haiti, the Carribean, and Mexico.§!"
wsv_usa.42.b:0 "There is no 'just' peace with you Yankees"
wsv_usa.43.t:0 "Confederates Respond with Peace Terms"
wsv_usa.43.d:0 "The Confederates have responded with their terms. They expect to be given Appalachia and the Missouri Tip as border corrections.  They also demand we demilitarize Maryland and accept their control over Haiti, the Carribean, and Mexico."
wsv_usa.43.a:0 "Very well"
wsv_usa.43.b:0 "We cannot accept this"
wsv_usa.44.t:0 "Peace with Honor in North America"
wsv_usa.44.d:0 "As a key point of his campaign, Socialist President Eugene V. Debs of the United States promises to bring an end to the war in North America.  Now he has done just that, signing essentially a 'status quo ante bellum' peace with the Confederate States. Although the United States made some minor border concessions and also recognized Confederate dominion over Latin America, Eugene V. Debs is calling the treaty a 'peace with honor' and vows to soon normalize relations with the Entente."
wsv_usa.44.a:0 "At least the war is over"
wsv_usa.45.t:0 "Confederate Reject Peace Talks"
wsv_usa.45.d:0 "The Confederates have refused to hold peace talks with us. It seems this war will only end through blood and steel."
wsv_usa.45.a:0 "So be it"
wsv_usa.46.t:0 "Peace Talks Fail in North America"
wsv_usa.46.d:0 "The Socialist administration of the United States has attempted to secure a 'status quo ante bellum' peace with the Confederate States, on the idea that it would be a 'peace with honor' for both.  However the two sides were unable to come to an agreement on the proposal, and talks seem to have concluded as warfare resumes in North America."
wsv_usa.46.a:0 "So much for peace"
wsv_usa.50.t:0 "Split of the American Socialist Party"
wsv_usa.50.d:0 "We have recieved a troubling report that the American Socialist Party has officially split in two--with its more militant members flocking to the newly formed American Communist Party under C. E. Ruthenberg. It seems the more moderate wing of the party--which held its militant members in check for so long--has finally given way."
wsv_usa.50.a:0 "Trouble is brewing"
wsv_usa.51.t:0 "Communist Militants Organizing"
wsv_usa.51.d:0 "Federal police have raided a warehouse that was occupied by Communist militants.  In the warehouse was found caches of arms, communist literature, and war preparations.  It seems the Communists are organizing for a revolution."
wsv_usa.51.a:0 "Troubling news"
wsv_usa.55.t:0 "Communist Revolution in United States"
wsv_usa.55.d:0 "Shocking news is coming from the United States, where workers in New York City have taken up arms and seized several blocks of the city, proclaiming the formation of a new Communist government.  Although the U.S. Army is insiting the situation is under control, reports indicate that workers across other American cities are following suite, and that even army personel are deserting the front.  The Socialist Party of America meanwhile has denounced the violence and called for a peaceful revolution, but the newly formed Communists are ignoring their pleas."
wsv_usa.55.a:0 "A catastrophe"
wsv_usa.56.t:0 "Revolution Erupts in the Rustbelt"
wsv_usa.56.d:0 "Following the lead of the Communists in New York, workers and Communist militants throughout the Rustbelt have taken up arms and declared their allegiance to the United Socialist States of America."
wsv_usa.56.a:0 "Terrible"
wsv_usa.100.t:0 "The Great Mormon Revolt"
wsv_usa.100.d:0 "With the USA and CSA locked in a bitter conflict, the Mormoms of Utah have taken the opportunity to rise up against the federal government.  Declaring themselves the independent nation of Deseret, the Mormons have stormed several federal forts and armories in Utah, slaughtering the garrisons and taking the arms stockpiles.  Now they have barricaded themselves inside their cities, preparing for the inevitable wrath of the United States."
wsv_usa.100.a:0 "Those bastards will pay!"
wsv_usa.100.b:0 "This could be useful..."
wsv_usa.100.c:0 "An interesting turn of events"
wsv_usa.101.t:0 "What To Do With Mormon Leaders?"
wsv_usa.101.d:0 "Now that the Nation of Deseret has surrender, we have to decide what to do with the leaders of the Mormon rebels."
wsv_usa.101.a:0 "Hang them!"
wsv_usa.101.b:0 "Imprison them"
wsv_usa.103.t:0 "United States Requests Defense Pact"
wsv_usa.103.d:0 "With the increasing aggression of the Entente members, the United States has approached us with a proposal for mutual defense.  They propose that the United States and Germany sign a defensive pact, so that if either is attacked by the Entente the other will come to their aid." 
wsv_usa.103.a:0 "They will be a useful ally"
wsv_usa.103.b:0 "We do not need foriegn entanglements"
american_german_pact_conditions_tt:0 "§YGermany§! and §Ythe United States§! will guarantee each other."
wsv_usa.104.t:0 "Germany Agrees to Defense Pact"
wsv_usa.104.d:0 "Germany has agreed to our defense pact proposal.  Our two countries will now stand together." 
wsv_usa.104.a:0 "A wise choice"
wsv_usa.105.t:0 "Germany Rejects Defense Pact"
wsv_usa.105.d:0 "Germany has rejected our proposal for a defense pact, stating they do not need any entanglements on our continent." 
wsv_usa.105.a:0 "Fools"
wsv_usa.106.t:0 "American-German Defense Pact"
wsv_usa.106.d:0 "Today, the United States and Germany announced the formation of the American-German Defense Pact. Stated to be 'purely defensive in nature', the pact stipulates that if either of the two countries were to be attacked, the other would come to its aid.  Commentators from the nations of Britain, the Confederate States, and France decried the pact however as a 'aggressive move' designed to threaten the Entente." 
american_german_pact:0 "American-German Pact Ratified"
wsv_usa.106.a:0 "We stand togeether"
wsv_usa.106.b:0 "More saber rattling"
wsv_usa.106.c:0 "The web of alliances grows larger"
wsv_usa.107.t:0 "Germany Calls Upon Us"
wsv_usa.107.d:0 "Germany is now at war with Great Britain.  As per the American-German Pact, we are obligated to come to their aid and declare war on Britain."
wsv_usa.107.a:0 "We will do our duty"
wsv_usa.107.b:0 "We are not ready"
wsv_usa.108.t:0 "United States Calls Upon Us"
wsv_usa.108.d:0 "The United States is now at war with Great Britain.  As per the American-German Pact, we are obligated to come to their aid and declare war on Britain."
wsv_usa.108.a:0 "We will do our duty"
wsv_usa.108.b:0 "We are not ready"
wsv_usa.109.t:0 "[From.GetName] Breaks Pact"
wsv_usa.109.d:0 "[From.GetNameDef] has refused to join our war against Great Britain, claiming the treaty was only applicable in the case of defensive wars.  In reality, we know they are mearly spineless cowards."
wsv_usa.109.a:0 "Damn them"
wsv_usa.110.t:0 "[From.GetName] Comes to Our Aid"
wsv_usa.110.d:0 "[From.GetNameDef] has declare war on our enemy Great Britain, fullfiling their duty as stipulated by the American-German Pact.  We can breathe easier knowing we are not alone."
wsv_usa.110.a:0 "It is good to have friends"
wsv_usa.111.t:0 "United States Sends Military Aid"
wsv_usa.111.d:0 "The United States has sent us several thousand rifles as well as military advisors to reequip and train our military."
wsv_usa.111.a:0 "We thank them"
wsv_usa.112.t:0 "United States Sends Rifles"
wsv_usa.112.d:0 "The United States has sent us several thousand rifless to help us reequip our military."
wsv_usa.112.a:0 "We thank them"
wsv_usa.113.t:0 "U.S. Troops Land in Sandwich Islands"
wsv_usa.113.d:0 "In a daring offensive, the United States has engaged the British forces stationed in the Sandwich Islands.  Caught by surprise, the British were unable to prevent the landing of US Marines and Army forces, which have stormed the island of Oahu.  Although clashes are still occuring between the U.S. and British navies, it seems for now that the Sandwich Islands have fallen into the hands of the United States."
wsv_usa.113.a:0 "Take that Brits"
wsv_usa.113.b:0 "Damn them"
wsv_usa.113.c:0 "A bold move"
wsv_usa.114.t:0 "Bombings in Canada"
wsv_usa.114.d:0 "Our occupation of Canada has proven unpopular with the locals, a few of which have taken to planting bombs on our rail lines and in our supply depots. Although a nuisance more than a real threat, the bombings have slowed down our progress up North and has affected the moral of the soldiers stationed there.  We should probably respond in some fashion to these cowardly acts."
wsv_usa.114.a:0 "Find the perpetrator"
wsv_usa.114.b:0 "Enact collective punishment"
reduce_frequency_of_canadian_rebels_tt:0 "§GWill reduce the frequency of rebel attacks in Canada.§!"
wsv_usa.115.t:0 "The Issue of Mexico"
wsv_usa.115.d:0 "Our history with Mexico is complex.  Although there is still bad blood over the Mexican-American War, the Mexican are now ruled over by a foriegn European monarch, and are essentially puppets of the Confederate States.  We could attempt to exploit this situation and aid the Mexicans in achieving their liberty.  Alternatively we could just take more of their land..."
wsv_usa.115.a:0 "A southern ally might be useful..."
wsv_usa.115.b:0 "Our differences are too great"
wsv_usa.116.t:0 "Aid the Black Rebels?"
wsv_usa.116.d:0 "With tens of thousands of blacks revolting across the South, our generals have suggested we could use this to our advantage.  By sending arms to the rebels, we could prolong the rebellion and further damage the Confederate war effort."
wsv_usa.116.a:0 "Send them guns"
wsv_usa.116.b:0 "We need our resources elsewhere"
longer_black_rebellion_tt:0 "§RWill prolong the black rebellion in the Confederate States.§!"
wsv_usa.117.t:0 "U.S. Guns Found in Black Rebel Camps"
wsv_usa.117.d:0 "Our forces have confirmed that large quantities of American rifles and other arms have been discovered in several black rebel camps across the South.  This can only mean that the Americans are funding the rebels in an effort to destabilize us."
wsv_usa.117.a:0 "Damn them"
wsv_usa.118.t:0 "Remembrance Offensive Failed"
wsv_usa.118.d:0 "Although we had promised the people that this last offensive would break the Confederate lines, it has failed to do so.  Public support in the war has take a dive as a result."
wsv_usa.118.a:0 "This isnt good"
wsv_usa.119.t:0 "United States Suggests Research Sharing"
wsv_usa.119.d:0 "The United States is suggesting we form a research group, so that we may get improved research speed for any tech they have researched and vise versa."
wsv_usa.119.a:0 "A great idea"
wsv_usa.119.b:0 "We wont share our tech"
wsv_usa.120.t:0 "Germany Agrees to Research Sharing"
wsv_usa.120.d:0 "Germany has agreed to form a research group with us. We will now get improved research speed for any tech they have researched, and vise-versa."
wsv_usa.120.a:0 "Excellent"
wsv_usa.121.t:0 "Germany Rejects Research Sharing"
wsv_usa.121.d:0 "Germany has refused to form a research group with us."
wsv_usa.121.a:0 "Fools"
wsv_usa.122.t:0 "Total Defeat of the CSA"
wsv_usa.122.d:0 "After years of war, we have finally managed to occupy nearly the entire Confederacy.  The last pockets of resistance won't hold out for long. We can finally reunite America."
wsv_usa.122.a:0 "At long last"
wsv_usa.123.t:0 "A Change of Course"
wsv_usa.123.d:0 "The recent news of a British-German Detente effectively nullifes our efforts to form an alliance with the German Empire.  We must now change course and focus on strengthening ourselves."
wsv_usa.123.a:0 "We shall stand alone and win"


## CSA
wsv_csa.1.t:0 "Woodrow Wilson Proclaims New Doctrine"
wsv_csa.1.d:0 "Earlier this week, the president of the Confederate States--Woodrow Wilson--gave a passionate speech in front of the Confederate Congress, where he declared the need to safeguard the Confederacy's sphere of influence.  He proclaimed that moving forward, the Confederacy would increase military and economic activity in the Caribbean and Central American regions, and would furthermore task itself with defending the countries there from threats--both internal and external.  This last portion--which has already been dubbed the 'Wilsonian Doctrine'--seems to have been left intentionally vague, however observers comment that it is likely a veiled warning at the United States."
wsv_csa.1.a:0 "Our rightful sphere"
wsv_csa.1.b:0 "Who do those Rebs think they are?!"
wsv_csa.1.c:0 "An interesting turn of events"
wsv_csa.2.t:0 "CSA Proposes Defense Pact"
wsv_csa.2.d:0 "Given the rising tensions around the globe, the Confederacy is expressing interest in a mutual defense pact.  This would strengthen the position of both countries against their main rival--the United States--and may facilitate greater cooperation in the future."
wsv_csa.2.a:0 "It is in our best interest"
request_british_ratification_tt:0 "§REngland must ratify the treaty.§!"
wsv_csa.2.b:0 "We have no need of them"
wsv_csa.3.t:0 "Canada Rejects Defense Pact"
wsv_csa.3.d:0 "Canada has rejected our request for a defense pact, stating that they do not need our help.  It seems for now we will stand alone."
wsv_csa.3.a:0 "Fools"
wsv_csa.4.t:0 "Confederacy Proposes Defense Pact with Canada"
wsv_csa.4.d:0 "The Confederacy has approached us with an interesting proposal.  They wish to sign a defensive pact with Canada, osstentatiously to guard against the United States.  While this would draw us into war against the United States were they to attack the Confederacy, it also means Canada will be more secure against any potential U.S. action."
wsv_csa.4.a:0 "We need all the help we can get"
wsv_csa.4.b:0 "We dont need more entanglements"
wsv_csa.5.t:0 "England Rejects Defense Pact"
wsv_csa.5.d:0 "Although Canada was supportive of the idea, England has blocked our request for a defense pact with them--stating that they do not wish to anger the United States.  It seems for now we will stand alone."
wsv_csa.5.a:0 "Fools"
wsv_csa.6.t:0 "Confederate-Canadian Treaty of Friendship"
wsv_csa.6.d:0 "Today, the Confederate States and the Dominion of Canada--with the consent of the United Kingdom--have announced the ratification of the Confederate-Canadian Treaty of Friendship.  Designed for the purpose of increasing economic and military cooperation between the two countries, the treaty also contains a clause that states an attack on one would be considered as an attack on both.  The United States immediately lambasted the treaty as an attempt to encircle the U.S., and staged provocative training excersises on their borders with Canada and the Confederacy."
wsv_csa.6.a:0 "Take that Yanks"
wsv_csa.6.b:0 "They wish to encircle us!"
wsv_csa.6.c:0 "The web of alliances grows ever larger"
wsv_csa.7.t:0 "Confederacy Purchases Rifles"
wsv_csa.7.d:0 "The Confederate States has purchased a couple thousand rifles from us to increase their arms stockpile."
wsv_csa.7.a:0 "Pleasure doing business"
wsv_csa.8.t:0 "Confederacy Purchases Artillery"
wsv_csa.8.d:0 "The Confederate States has purchased a couple hundred artillery pieces from us to increase their arms stockpile."
wsv_csa.8.a:0 "Pleasure doing business"
wsv_csa.9.t:0 "Pan-Caribbean Security Conference"
wsv_csa.9.d:0 "Today, the Confederate States hosted a summit in Havana, Cuba, where the leaders of various Central American and Caribbean nations were invited.  Stressing the need for greater cooperation between the countries bordering the Caribbean, the Confederacy put forth its plan to increase economic ties with the region.  Cojointly, it also proposed to create a body to resolve disputes between the Caribbean nations, with the Confederacy as its head. Although the leaders of the Caribbean nations seemd interested in increasing economic ties with the CSA, they seemed less thrilled about the idea of this new 'body'."
wsv_csa.9.a:0 "This is the logical next step"
wsv_csa.9.b:0 "Its nothing but a Confederate power play"
wsv_csa.100.t:0 "Blacks Revolt Across the CSA"
wsv_csa.100.d:0 "With the Confederacy locked in a grinding war against the United States, it seems that blacks across the South have seized the opportunity to revolt and free themselves of Confederate oppression.  Reports of raids and attacks by black insurgents have begun cropping up from Louisiana to Georgia to Virgina, and hundreds if not thousands of buildings have already been destroyed.  Furthermore, many of these black rebels, influenced by socialist ideology, have proclaimed the establishment of 'black socialist republics' across the South.  The Confederate government has thus dubbed the incident 'the Red Rebellion', and while they are downplaying the severity of the uprising, it is clear Confederate resources will be stretched to thier limit by this new development."
wsv_csa.100.a:0 "Those bastards will pay!"
wsv_csa.100.b:0 "This could be useful..."
wsv_csa.100.c:0 "An interesting turn of events"
wsv_csa.101.t:0 "Take Action"
wsv_csa.101.d:0 "Revolts by black socialist rebels are occuring all across the South.  Access the decision tab to take action against them."
wsv_csa.101.a:0 "We will restore order"
wsv_csa.102.t:0 "Situation in [CSA_red_rebels_state_event_target.GetName] Worsens"
wsv_csa.102.d:0 "The situation [CSA_red_rebels_state_event_target.GetName] is deteroriating, as the black rebels step up their attacks.  We must act soon before it gets any worse."
wsv_csa.102.a:0 "We must do something"
wsv_csa.103.t:0 "Successful Counter-Rebel Operation in [CSA_red_rebels_state_event_target.GetName]"
wsv_csa.103.d:0 "Our forces have led a successful counter-rebel operation in [CSA_red_rebels_state_event_target.GetName].  Before long the black rebels will be wiped from here for good."
wsv_csa.103.a:0 "Another victory"
wsv_csa.104.t:0 "Failed Counter-Rebel Operation in [CSA_red_rebels_state_event_target.GetName]"
wsv_csa.104.d:0 "Our forces have been beaten back in [CSA_red_rebels_state_event_target.GetName], suffering heavy losses.  Defeating the black rebels here may prove harder than we thought."
wsv_csa.104.a:0 "We must redouble our efforts"
wsv_csa.105.t:0 "[CSA_red_rebels_state_event_target.GetName] Cleared of Rebels"
wsv_csa.105.d:0 "Our forces have finally managed to eliminate the last pockets of black rebels in [CSA_red_rebels_state_event_target.GetName].  Now the long process of rebuilding can begin."
wsv_csa.105.a:0 "Those rebels were no match"
wsv_csa.106.t:0 "End of the Red Rebellion"
wsv_csa.106.d:0 "As Confederate forces mop up the last pockets of black socialist rebels scattered throughout the South, Confederate President [CSA.GetLeader] has declared the defeat of the Red Rebellion.  He congratulated the Confederate Army and State Guard on putting down the rebellion, but also promised to hold ‘those who had allowed this Rebellion to ferment under their nose’ accountable.  Pointedly, [CSA.GetLeader] also accused the United States of prolonging the Rebellion by funding the black rebels, and reminded Confederate citizens that the real struggle against ‘Yankee tyranny’ has yet to be won."
wsv_csa.106.a:0 "Thank God thats over"
wsv_csa.106.b:0 "It was useful while it lasted
wsv_csa.106.c:0 "It was doomed to fail"
csa_red_rebellion_defeated:0 "Red Rebllion Was Defeated"
wsv_csa.107.t:0 "1915 Presidential Election"
wsv_csa.107.d:0 "The 1915 Presidential Election is here, between Whig candiate Gabriel Semmes and Radical Liberal Doroteo Arango!  Although formally an election, the Whigs have held power ever since the formation of the CSA, and are almost guaranteed to win the election."  #This election is a critical one; leader of the nation will face challenges like no other, and ultimately mold the Confederacy's future!"
wsv_csa.107.a:0 "Gabriel Semmes for President!"
wsv_csa.107.b:0 "Doroteo Arango for President!"
gabriel_becomes_president_tt:0 "Gabriel Semmes becomes the President of the CS"
doroteo_becomes_president_tt:0 "Doroteo Arango becomes the President of the CS"
wsv_csa.108.t:0 "The Confederacy Begins Recruiting Black Soldiers"
wsv_csa.108.d:0 "With the CSA on the backfoot in their war with the United States, the Confederate Congress has passed a bill legalizing the recruitment of black soldiers.  Previously barred from serving in the military, the substantial black population of the Confederacy should provide a fresh source of manpower for the beleagured Confederates. Whether the Confederacy can withstand such a radical disruption to its rigid social and racial heirarchy however, is to be seen."
wsv_csa.108.a:0 "Desperate times call for desperate measures"
wsv_csa.108.b:0 "They must be truely desperate"
wsv_csa.109.t:0 "Tensions Rise Between Black Soldiers and White Civilians"
wsv_csa.109.d:0 "A brawl broke out today in a Confederate town, where black soldiers returning from the front on leave were jeered at and insulted by local civilians.  The black soldiers returned the insult, and soon the two groups came to blows.  Though the local police eventually broke up the fight, relations have soured between the blacks and whites in the area."
wsv_csa.109.a:0 "A worrying occurence"
wsv_csa.110.t:0 "Black Soldiers Demand Better Treatment"
wsv_csa.110.d:0 "Groups of black soldiers have begun demanding better conditions in the army.  The groups list several complaints, among these that white officers are frequently disrespectful, that black units are often thrown into the worst of the fighting, and that their pay is too low.  Adhering to these demands may raise morale amongst black troops -- though it may also make the white officers unhappy."
wsv_csa.110.a:0 "They should be happy we are letting them serve at all"
blacksoldiers_revolt_sooner_tt:0 "§RTaking a harsh approach will worsen the morale of black soldiers.§!"
wsv_csa.110.b:0 "Very well, issue a new directive"
wsv_csa.111.t:0 "Tensions Rise Between Black and White Soldiers"
wsv_csa.111.d:0 "A dispute broke out between a white Confederate officer and several black soldiers, who objected to being verbally disrespected by the officer. In anger the officer struck the black soldier--causing several other black soldiers to mob the white officer.  Though MPs eventually broke up the fight, the white officer had to be moved to a new unit."
wsv_csa.111.a:0 "A worrying occurence"
wsv_csa.112.t:0 "Tensions in the Army Explode..."
wsv_csa.112.d:0 "The worst has come to pass.  Although black soldiers put up with mistreatment from their white officers for a long time, they have become fed up and are now revolting.  Worse yet, the revolt has spread to our white soldiers, who are also tired of the war."
wsv_csa.112.a:0 "This is the end..."
wsv_csa.113.t:0 "Confederate Army Collapse"
wsv_csa.113.d:0 "Shocking reports are coming in that units of black Confederate soldiers have begun to mutiny and refuse orders.  Worse still, it seems many white Confederate soldiers -- who have grown disillusioned with the war -- have taken the chance to mutiny as well.  The result seems to be a general collapse of the Confederate Army, all along the front."
wsv_csa.113.a:0 "A catastrophe"
#  wsv_csa.3.t:0 "Send Aid to the Mormons?"
#  wsv_csa.3.d:0 "Our generals have recently proposed the idea of smuggling arms and ammunition to the Mormon rebels in Utah.  If we do, it could prolong the fighting and possibly give us the advantage we need.  On the other hand if we don't those guns and ammo could be used on our front."
#  wsv_csa.3.a:0 "We need everything we have"
#  wsv_csa.3.b:0 "We have some guns to spare"
#  wsv_csa.3.c:0 "We have way too many guns"
#  wsv_csa.4.t:0 "Fate of Mexico"
#  wsv_csa.4.d:0 "[From.GetNameDef] has demanded we submit to their rule, or face war."
#  wsv_csa.4.a:0 "To fight is hopeless..."
#  wsv_csa.4.b:0 "Mexico will never surrender!"
#  wsv_csa.5.t:0 "Mexico Submits"
#  wsv_csa.5.d:0 "Mexico has submitted to our rule."
#  wsv_csa.5.a:0 "A wise choice"
#  wsv_csa.6.t:0 "Mexico Defiant"
#  wsv_csa.6.d:0 "Mexico has refused to submit to our rule."
#  wsv_csa.6.a:0 "War it is!"
#  wsv_csa.7.t:0 "Confederate States Joins the Entente"
#  wsv_csa.7.d:0 "Since the end of the War of Secession, the Confederate States and the British and French Empires have engaged in close military cooperation, with the Confederate States adopting many of their tactics and practices in their army.  Now, the Confederacy has gone even further, formalizing a diplomatic alliance with the Entente to protect each other in the outbreak of war."
#  wsv_csa.7.a:0 "The network of entangling alliances grows ever bigger..."

#Canada
wsv_canada.1.t:0 "Canadian-American Truce"
wsv_canada.1.d:0 "Canada has requested a non-aggression pact between the US and Canada, promising us New Brunswick and Halifax in return."
wsv_canada.1.a:0 "A good deal, our true enemy is the CSA"
wsv_canada.1.b:0 "No, we will have all of Canada"
wsv_canada.2.t:0 "USA Accepts Truce"
wsv_canada.2.d:0 "The US has accepted our terms and signed a non-aggression pact."
wsv_canada.2.a:0 "Security at last"
wsv_canada.3.t:0 "USA Refuses Truce"
wsv_canada.3.d:0 "The US has refused our terms."
wsv_canada.3.a:0 "Now we are doomed"

#England
wsv_england.1.t:0 "Passing of the Parliment Act"
wsv_england.1.d:0 "With the Parliment Act passed, the power of the House of Lords has been greatly reduced.  The British government will now be able to operate more freely and pass the social reforms it so seeks."
wsv_england.1.a:0 "Time to get to business"
wsv_england.2.t:0 "Britain Proposes Defensive Pact"
wsv_england.2.d:0 "Given the rise in German aggression, Britain is suggesting that the 'Entente Cordiale' be made more formal be means of a defensive alliance."
wsv_england.2.a:0 "A great idea"
wsv_england.2.b:0 "We will not tie our hands"
wsv_england.3.t:0 "France Accepts Defensive Pact"
wsv_england.3.d:0 "France has agreed to our offer of a defensive pact."
wsv_england.3.a:0 "Excellent"
wsv_england.4.t:0 "France Rejects Defensive Pact""
wsv_england.4.d:0 "France has rejected our offer of a defensive pact."
wsv_england.4.a:0 "Fools"
wsv_england.5.t:0 "Britain Intervenes in the European War"
wsv_england.5.d:0 "Great Britain has decided to militarily intervene in the ongoing Franco-German war, siding with France and declaring war on Germany.  British troops are soon expected to begin landing in France in large numbers, as the French and British begin drawing up military plans.  The new development bodes ill for Germany."
wsv_england.5.a:0 "This will greatly help France"
wsv_england.10.t:0 "Britain Provides Loan"
wsv_england.10.d:0 "Britain has provided us with a loan to aid our industralization."
wsv_england.10.a:0 "Many thanks"
wsv_england.12.t:0 "Home Rule Negociations"
wsv_england.12.d:0 "Negociations on the new Home Rule bill have begun, with the goal of finally resolving the ethnic tensions in Ireland."
wsv_england.12.a:0 "Hopefully we can resolve our differences"
wsv_england.13.t:0 "Ireland Granted Home Rule"
wsv_england.13.d:0 "The British government has announced the passage of the Home Rule Act for Ireland, which grants Ireland a certain degree of autonomy.  Although its foriegn and military policy is still governed by the British, Ireland will now be able to set its own domestic and economic laws."
wsv_england.13.a:0 "Hopefully there is peace"
wsv_england.14.t:0 "The Easter Rising"
wsv_england.14.d:0 "With Great Britain locked in a bitter conflict, Irish rebels in Dublin have taken the chance to revolt and proclaim the Republic of Ireland.  Although they have much courage, the rebels lack local support and heavy arms, and are likely to be quickly put down by the British Army.  However perhaps this is just the beginning."
wsv_england.14.a:0 "An interesting turn of events"
irish_easter_rising:0 "Easter Rising has Occured"
wsv_england.15.t:0 "British Proposal to Divide the Middle East"
wsv_england.15.d:0 "Given the ongoing war with the Ottomans, Britain is proposing we carve up the Middle East between the two of us."
wsv_england.15.a:0 "A good idea"
wsv_england.15.b:0 "No"
wsv_england.16.t:0 "France Agrees to Sykes-Picot"
wsv_england.16.d:0 "France has agreed to our proposal to divide the Middle East."
wsv_england.16.a:0 "Excellent"
wsv_england.17.t:0 "France Rejects Sykes-Picot"
wsv_england.17.d:0 "France has rejected our proposal to divide the Middle East."
wsv_england.17.a:0 "Fools"
wsv_england.20.t:0 "Occupy Egypt"
wsv_england.20.d:0 "The ongoing war with the Ottomans has exposed the weakness of the Egyptian state, and the vulnerability of the Suez under its management.  We should further integrate Egypt to protect our vital interests."
wsv_england.20.a:0 "Do it"
spawn_persia_rifles_tt:0 "Will spawn §Y5§! units of §YSouth Persia Rifles§! in §YPersia§!."
wsv_england.21.t:0 "British Troops Occupy Persia"
wsv_england.21.d:0 "Alarming reports indicate that the British has seized control of Persia exposing our eastern flank.  We must move troops there to counter them."
wsv_england.21.a:0 "Another front"
wsv_england.25.t:0 "Britain Suggests Forming a Faction"
wsv_england.25.d:0 "Given that we are both fighting the United States and are not in a faction, Britain has suggested we form a faction to coordinate our war effort better."
wsv_england.25.a:0 "An excellent idea"
wsv_england.25.b:0 "Nah"
wsv_england.26.t:0 "Confederateas Agree to Form a Faction"
wsv_england.26.d:0 "The Confederates have agreed to create a faction with us."
wsv_england.26.a:0 "Excellent"
wsv_england.27.t:0 "Confederateas Reject Forming a Faction"
wsv_england.27.t:0 "The Confederates have declined to create a faction with us."
wsv_england.27.a:0 "Fools"
#  wsv_england.3.t:0 "Canadian Expeditionary Force?"
#  wsv_england.3.d:0 "The British AI seems to have a problem defending Canada.  As a result, this event forces them to give some divisions to Canada.  If you are a player, you can ignore this event (unless you'd like to give some divisions to Canada)."
#  wsv_england.3.a:0 "The British Army will remain seperate"
#  wsv_england.3.b:0 "A wise idea"
#  wsv_england.4.t:0 "Deploy Canadian Expeditionary"
#  wsv_england.4.d:0 "The time has come.  The defence of Canada has begun."
#  wsv_england.4.a:0 "Send the men"
wsv_england.100.t:0 "British Diplomats Visit Berlin"
wsv_england.100.d:0 "British diplomats have made a visit to Berlin, where they discussed easing tenions between Britain and Germany.  As a testament to their genuine nature, they suggested that future talks of a detente could entail Britain giving Germany a more free reign in Europe... in exchange for German concessions in other areas."
wsv_england.100.a:0 "An interesting suggestion"
wsv_england.101.t:0 "Britian Proposes a Treaty of Detente"
wsv_england.101.d:0 "The British are approaching us with an interesting proposal.  In exchange for us severing military ties with the United States and agreeing to limit our navy to 60% of the size of the Royal Navy, the British are promising to serve military ties with France, Russia, and the Low Countries, effectively giving us a blank cheque in Europe."
wsv_england.101.a:0 "We won't abandon the U.S."
wsv_england.101.b:0 "Sure, but we wont limit our navy so much"
england_revised_detente_treaty_tt:0 "§LBritain and Germany will end the naval arms race.  Germany will limit its navy to not exceed the size of the Royal Navy, and will cancel military ties with the United States.  Britain will end military ties with France, and Russia, and will stop guaranteeing the Low Countries.§!"
england_must_agree_to_revision_tt:0 "§RBritain must agree to the revision for the proposal to take effect.§!"
wsv_england.101.c:0 "We accept"
england_full_detente_treaty_tt:0 "§LBritain and Germany will end the naval arms race.  Germany will limit its navy to 60% of the Royal Navy, and will cancel military ties with the United States.  Britain will end military ties with France, and Russia, and will stop guaranteeing the Low Countries.§!"
wsv_england.102.t:0 "Germany Proposes a Revision"
wsv_england.102.d:0 "The Germans have agreed to most points of our proposal.  However they explained that they still need to mantain a large navy to fight their enemies, and thus only agree to ensure their navy does not exceed the size of the Royal Navy."
wsv_england.102.a:0 "No deal"
wsv_england.102.b:0 "This is acceptable"
wsv_england.103.t:0 "[From.GetName] Agrees to Proposal"
wsv_england.103.d:0 "[From.GetName] has agreed to our proposal for detente."
wsv_england.103.a:0 "Excellent"
wsv_england.104.t:0 "[From.GetName] Rejects Proposal"
wsv_england.104.d:0 "[From.GetName] has rejected our proposal for detente."
wsv_england.104.a:0 "Fools"
wsv_england.105.t:0 "British-German Treaty of Understanding & Detente"
wsv_england.105.d:0 "Shocking news have arrived that the British Empire and the German Empire has signed a treaty of detente.  Per this treaty, both countries agree to reduce their naval build-up, and to give the other more 'freedom of movement in their sphere of influence'. Observers note that this likely means the British will pull out of European affairs, while the Germans are likely to pull out of the Americas.  If true, this is harsh blow for France and the United States, who both have lost a potential alliance partner."
wsv_england.105.a:0 "This will serve us greatly"
wsv_england.105.b:0 "Those traitors!"
wsv_england.105.c:0 "A very interesting turn of events"
british_german_detente:0 "British-German Detente Occured"

#France
wsv_france.1.t:0 "France Sends Arms"
wsv_france.1.d:0 "France has sent us an arms shipment of ?. This will prove useful for supplying our troops."
wsv_france.1.a:0 "Many thanks"
wsv_france.2.t:0 "France Provides Financial Loan"
wsv_france.2.d:0 "France has provided us a financial loan so we can boost our industry.  With this loan we will be able to construct new factories and roads."
wsv_france.2.a:0 "Many thanks"
wsv_france.3.t:0 "France Supports Our Austrian Claims"
wsv_france.3.d:0 "France has informed us that they support our claims to part of Austrian territory, and would be interested in pursuing an alliance with us over this matter."
wsv_france.3.a:0 "Glad they're on our side"
wsv_france.4.t:0 "France Calls Us to War"
wsv_france.4.d:0 "France is asking us to aid them in their ongoing war with Austria-Hungary.  Although there is no formal alliance between our countries, France has promised to compensate us with the Austrian territory we claim, should we be victorious."
wsv_france.4.a:0 "We are not ready for war"
wsv_france.4.b:0 "An excellent idea"
wsv_france.5.t:0 "Italy Refuses Call"
wsv_france.5.d:0 "Italy has refused to help us in our war with Austria-Hungary, stating their unpreparedness for war and the desire to remain neutral."
wsv_france.5.a:0 "Cowards"
wsv_france.10.t:0 "Mutinies in the French Army"
wsv_france.10.d:0 "News sources are reporting widespread unrest amongst the French Army, as soldiers have begun refusing orders to attack.  The French soldiers claim they are tired of wasteful offensives, and are demanding better pay and longer leave from the front.  Although French High Command is assuring its allies that all is well, the news of the mutinies is another blow to the Entente."
wsv_france.10.a:0 "This is bad for France"
wsv_france.11.t:0 "Dealing the Mutinies"
wsv_france.11.d:0 "Although large scale arrests have been conducted against the mutineers, army morale has failed to improve. High Command is now debating whether to listen to the demands of the mutineers to improve morale, or to simply continue with the arrests."
wsv_france.11.a:0 "We must listen to our men"
wsv_france.11.b:0 "We wont bargain with traitors"
wsv_france.12.t:0 "Mutinies Quelled"
wsv_france.12.d:0 "Our actions seem to have paid off, and most of the soldiers have returned to their post. In the end only a handful of ringleaders were executed... to show an example of course."
wsv_france.12.a:0 "At least its over"
wsv_france.13.t:0 "Our People Yearn for Peace"
wsv_france.13.d:0 "The recent mutinies in the army have only exposed the exhaution of the French people with the ongoing war. If we cannot achieve victory soon, it is likely we will have to sue for peace."
wsv_france.13.a:0 "We must win"
wsv_france.50.t:0 "France Cancels Non-Aggression Pact"
wsv_france.50.d:0 "France has cancelled their non-aggression pact, likely due to our lack of support in Morocco. The situation does not bode well for Franco-British relations."
wsv_france.50.a:0 "Unfortunate"
wsv_france.51.t:0 "French Invasion of Belgium"
wsv_france.51.d:0 "Shocking news today has arrived that French troops have marched into Belgium.  Once a staunch supporters of the ..., France now seems to have changed its mind and forgone its treaty obligations.  The French leader, [FRA.GetLeader] has claimed this move is necessary to secure Belgium and France against possible German incursion, however the Germans have vigoruously denied these allegations.  Regardless, it is expected that Britain may intervene to protect the independence of Belgium.  A general European war may be on the horizon."
wsv_france.51.a:0 "We must secure our borders"
wsv_france.51.b:0 "Grave news"

# Germany
wsv_germany.1.t:0 "State of the Triple Alliance"
wsv_germany.1.d:0 "Though we are nominally allied with both Italy and Austria-Hungary, the situation is much more complicated than it seems.  Italy has designs on the Austrian territories, which has strained relations between the two states and made it unlikely that they will work together in the future.  Going forward then we must decided which of the two countries we will back."
wsv_germany.1.a:0 "Tough times indeed"
wsv_germany.2.t:0 "Germany Provides Financial Loan"
wsv_germany.2.d:0 "Germany has provided us a financial loan so we can boost our industry.  With this loan we will be able to construct new factories and roads."
wsv_germany.2.a:0 "Many thanks"
wsv_germany.3.t:0 "A German Call to War"
wsv_germany.3.d:0 "Germany is requesting that we join them in their struggle against the Entente.  They promise to compensate us territorially if we do so."
wsv_germany.3.a:0 "A great opportunity"
join_war_with_central_powers_tt:0 "§RWill result in war with Germany's enemies.§!"
wsv_germany.3.b:0 "War is for fools"
wsv_germany.4.t:0 "[From.GetName] Heeds Our Call"
wsv_germany.4.d:0 "[From.GetNameDef] has heeded our call and joined our faction.  They will stand with us."
wsv_germany.4.a:0 "A wise decision"
wsv_germany.5.t:0 "[From.GetName] Refuses to Join"
wsv_germany.5.d:0 "[From.GetNameDef] has refused our offer of alliance against the Entente."
wsv_germany.5.a:0 "Cowards"
wsv_germany.6.t:0 "Germany Offers Alliance"
wsv_germany.6.d:0 "Germany is requesting we join them in their war against Russia, promising in return compensate us with Finland -- which use to be part of Sweden two centuries ago."
wsv_germany.6.a:0 "We are not interested"
wsv_germany.6.b:0 "For the glory of Sweden!"
wsv_germany.7.t:0 "[From.GetName] Heeds Our Call"
wsv_germany.7.d:0 "[From.GetNameDef] has heeded our call and joined our faction.  They will stand with us."
wsv_germany.7.a:0 "A wise decision"
wsv_germany.8.t:0 "[From.GetName] Refuses to Join"
wsv_germany.8.d:0 "[From.GetNameDef] has refused our offer of alliance against the Entente."
wsv_germany.8.a:0 "Cowards"
wsv_germany.10.t:0 "Schliffen Plan Failed"
wsv_germany.10.d:0 "Our attempt to knockout the French by outflanking their forces through Belgium and driving for Paris has failed.  It seems Germany will now be forced to fight a two-front war."
wsv_germany.10.a:0 "We're in for the long haul"
wsv_germany.11.t:0 "Kaiserschlacht Failed"
wsv_germany.11.d:0 "Our attempt to win the war through a last ditch breakthrough in the West has failed.  Our troops our now exhausted, and the civilian populace at home is sick of the war."
wsv_germany.11.a:0 "Not good"
wsv_germany.12.t:0 "Rationing Begins"
wsv_germany.12.d:0 "The British blockade has forced us to begin ratioing our food supply.  Although our people may be a bit unhappy, this will delay the onset of food shortages -- for now."
wsv_germany.12.a:0 "Do what must be done"
wsv_germany.13.t:0 "National Food Crisis"
wsv_germany.13.d:0 "Despite our best attempts to stretch out our food reserves, they could simply not last for ever.  Now food crises are beginning to rock the cities and army, as the nation goes hungry."
wsv_germany.13.a:0 "This is not good news"
wsv_germany.100.t:0 "Germany Proposes a Secret Pact"
wsv_germany.100.d:0 "Germany has approached us with a clandestine proposal, where in return for supporting them in a war against Austria-Hungary, they would grant us the territories we claim from the Habsburgs."
wsv_germany.100.a:0 "An excellent idea"
secret_pact_against_AUH_tt:0 "§RGermany will expect us to join their war against Austria-Hungary.§!"
wsv_germany.100.b:0 "We're not interested"
wsv_germany.101.t:0 "[From.GetName] Agrees to Secret Pact"
wsv_germany.101.d:0 "[From.GetName] has agreed to our plan for a pact against Austria-Hungary.  When war comes they will stand by our side."
wsv_germany.101.a:0 "Excellent"
wsv_germany.102.t:0 "[From.GetName] Rejects Secret Pact"
wsv_germany.102.d:0 "[From.GetName] has rejected our plan for a pact against Austria-Hungary."
wsv_germany.102.a:0 "Fools"
wsv_germany.103.t:0 "Bruder's War"
wsv_germany.103.d:0 "Shocking news today, as the German Empire has seemingly turned against and invaded its former ally Austria-Hungary.  [GER.GetLeader] has declared the Habsburg Empire as a rotten structure that needs to be elimated, and claimed this war is necessary not only to restore stability in Europe but also to complete the process of uniting the German people under one flag.  The Habsburgs meanwhile have denounced the Germans as traitors, and vow to defend their Empire at all costs."
wsv_germany.103.a:0 "Damn those Germans!"
wsv_germany.103.b:0 "A shocking turn of events"
wsv_germany.104.t:0 "Fulfill the Terms of the Secret Pact?"
wsv_germany.104.d:0 "Now that Germany has gone to war with Austria-Hungary, we should join as well as per the terms of our secret pact with Germany."
wsv_germany.104.a:0 "Do it"
wsv_germany.104.b:0 "On second thought..."
wsv_germany.105.t:0 "The War is Lost"
wsv_germany.105.d:0 "We have failed to beat back the Germans.  It is time to sue for peace."
wsv_germany.105.a:0 "This is the end"
wsv_germany.106.t:0 "End of Austria-Hungary"
wsv_germany.106.d:0 "The stunning news of the Bruder's War has now been surpassed by the total defeat of Austria-Hungary.  Gone from the map now is the Habsburg realm, replaced by various smaller ethnic nations.  Austria proper has been absorbed into Germany, which is now a giant in the center of Europe."
wsv_germany.106.a:0 "A hegemon is born"

# Austria-Hungary
wsv_auh.2.t:0 "Separatist Agitation Escalates"
wsv_auh.2.d:0 "Despite our efforts, nationalist agitators have gained momentum. Their calls for separation spread unrest and weaken faith in the empire’s leadership."
wsv_auh.2.a:0 "A blow to imperial unity."
wsv_auh.3.t:0 "Bosnian Insurgents Grow Bolder"
wsv_auh.3.d:0 "In Bosnia, nationalist networks are becoming more active. Underground organizations and secret societies quietly expand their influence, fueling disobedience and weakening our grip on the province."
wsv_auh.3.a:0 "A troubling development in Bosnia."
wsv_auh.19.t:0 "Imperial Council Dissolved"
wsv_auh.19.d:0 "With the outbreak of war, parliamentary obstruction has become intolerable. Nationalist deputies stall debates while the army requires swift action. To prosecute the war more effectively, the Imperial Council has been dissolved, granting the government authority to rule by emergency decree."
wsv_auh.19.a:0 "The war effort must come first."
wsv_auh.20.t:0 "Impose Wartime Censorship"
wsv_auh.20.d:0 "Separatists and nationalist agitators are using the war as an excuse to spread doubt and division across the empire. To ensure unity and protect the war effort, we must silence these voices through strict censorship, surveillance, and the arrest of opposition leaders. It will not be popular, but it is necessary."
wsv_auh.20.a:0 "There will be no room for dissent"
AUH_imposed_wartime_censorship:0 "Wartime censorship imposed"
wsv_auh.21.t:0 "Food Shortages"
wsv_auh.21.d:0 "The war has taken its toll, and agricultural production has dropped significantly as men have abandoned their fields to go fight at the front. Our government reports some areas are experiencing food shortages, but its probably nothing too bad to worry about -- for now."
wsv_auh.21.a:0 "Bad signs"
wsv_auh.22.t:0 "Severe Food Shortages"
wsv_auh.22.d:0 "Our govenment reports the food situation has deteriorated drastically across the country, cities seeing massive bread lines and soldiers reporting have insufficent rations.  Who knows how much longer we can last like this."
wsv_auh.22.a:0 "Not good"
wsv_auh.23.t:0 "Invade Montenegro"
wsv_auh.23.d:0 "Our forces have bogged down against the Serbs, however we may be able to open a new front through Montenegro."
wsv_auh.23.a:0 "A great idea"
wsv_auh.24.t:0 "Serbian Troops Flee Through Albania"
wsv_auh.24.d:0 "Reports indicate Serbia troops are fleeing through Albania to escape our forces."
wsv_auh.24.a:0 "After them!"

wsv_auh.40.t:0 "Rising Ethnic Tensions"
wsv_auh.40.d:0 "After years of grueling war, the delicate balance between the empire’s many peoples has begun to unravel. The strains of the battlefield are now mirrored at home, as rival nationalities accuse each other of disloyalty and demand greater autonomy. The empire holds together for now, but the cracks are widening."
wsv_auh.40.a:0 "The empire trembles, but endures for now."
wsv_auh.44.t:0 "A House of Cards"
wsv_auh.44.d:0 "The pressures of war have made the Habsburg state increasingly fragile. The parliament is restless, nationalist demands grow louder, and the army is weary. The once-mighty Dual Monarchy now resembles a house of cards—one strong gust could bring it crashing down."
wsv_auh.44.a:0 "We will hold on as long as we can."
wsv_auh.45.t:0 "Mass Desertions in the Army"
wsv_auh.45.d:0 "Reports from the front are grim. Entire units, especially among Slavic and Romanian soldiers, have abandoned their posts. Some simply return home, others join nationalist militias forming in the countryside. The once-formidable imperial army is dissolving before our eyes."
wsv_auh.45.a:0 "The army is falling apart!"
wsv_auh.46.t:0 "Ethnic Parliaments Proclaimed"
wsv_auh.46.d:0 "National councils and parliaments are springing up across the empire. Czechs, South Slavs, and other groups are seizing the moment to assert their independence. Authority in Vienna is slipping away as the peoples of the monarchy create their own governments."
wsv_auh.46.a:0 "The empire is breaking apart!"
wsv_auh.50.t:0 "Collapse of Austria-Hungary"
wsv_auh.50.d:0 "The strains of war have proven too much to bear for the Austro-Hungarian Empire, and the preexisting ethnic tensions that existed in the Empire have finally exploded.  Over the past few days the Czechs, Southern Slavs, and Hungarians have all proclaimed the formation of their own independent republics.  Troops from these ethnic groups have begun deserting the front and returning back to their respective nations, casuing the Austro-Hungarian lines to evaporate.  Entente forces have begun advancing on all fronts, and rumors abound that the Austria Emperor has even abdicated the throne. It seems this is the end of the Habsburg Empire."
wsv_auh.50.a:0 "The end of 700 years of Habsburg rule"
AUH_collapsed:0 "The Austro-Hungarian Empire has collapsed"
wsv_auh.51.t:0 "The War is Lost"
wsv_auh.51.d:0 "The collapse of our Empire wipes away any reason we had for fighting this war.  It is time to sue for peace."
wsv_auh.51.a:0 "This is the end"
wsv_auh.52.t:0 "Italy Occupies Tyrol"
wsv_auh.52.d:0 "Italy has occupied Tyrol in order to attack the German Empire--which it is still at war with--from the south.  Italy will return this land to Austria once the war is over."
wsv_auh.52.a:0 "Ok"
wsv_auh.53.t:0 "Italy Returns Tyrol"
wsv_auh.53.d:0 "Italy has returned Tyrol to Austria, now that the former's war with the German Empire is over."
wsv_auh.53.a:0 "Ok"


# Russia
wsv_russia.20.t:0 "Russia Becomes Our Patron"
wsv_russia.20.d:0 "Due to the recent strengthening of relations with Russia, they have informed us they will now be supporting us more closely in the Balkans, both diplomatically and militarily."
wsv_russia.20.a:0 "We are grateful"
wsv_russia.21.t:0 "Austria-Hungary Attacks Serbia"
wsv_russia.21.d:0 "Austria-Hungary has attacked our brother nation of Serbia.  We must come to their defense at once."
wsv_russia.21.a:0 "Inform the Austrians to withdraw"
wsv_russia.21.b:0 "Not right now"
wsv_russia.22.t:0 "Russia Demands We Withdraw"
wsv_russia.22.d:0 "Russia is demanding we withdraw from Serbia, on pain of war if we refuse.  We have 5 days to answer."
wsv_russia.22.a:0 "Very well"
wsv_russia.22.b:0 "Make us"
wsv_russia.23.t:0 "Austria-Hungary Withdraws"
wsv_russia.23.d:0 "Austria-Hungary has withdraw its troops from Serbia."
wsv_russia.23.a:0 "A wise move"
wsv_russia.24.t:0 "Austria-Hungary Defiant"
wsv_russia.24.d:0 "Austria-Hungary has declined to answer our ultimatum."
wsv_russia.24.a:0 "Then it is war"
wsv_russia.50.t:0 "A New Name for Saint Petersburg?"
wsv_russia.50.d:0 "Saint Petersburg, the glorious capital of Imperial Russia, has a long and prestigous history. However, its Russian name of Saint Petersburg has too much German influence. ''Petrograd'', conversely, is as Russian as Fish Pirogi! Hopefully, the new name will catch on."
wsv_russia.50.a:0 "Change to Petrograd!"
wsv_russia.50.b:0 "We have other things to do"
wsv_russia.51.t:0 "The Grain Dilemma"
wsv_russia.51.d:0 "With the war dragging on and supplies dwindling, the Russian Empire faces a grave choice. The army at the front demands more food and ammunition, yet civilians in the cities are starving. Prioritizing the soldiers could sustain the war effort, but neglecting the home front risks unrest and revolution."
wsv_russia.51.a:0 "The army must eat first!"
wsv_russia.51.b:0 "We must feed the people!"
wsv_russia.52.t:0 "The Great Retreat"
wsv_russia.52.d:0 "German and Austro-Hungarian offensives have shattered our front lines. Warsaw and much of Poland are lost. Our generals urge a massive withdrawal to save the army from encirclement. Entire regions must be abandoned, and the scorched earth policy has been ordered—railways torn up, villages burned, civilians fleeing eastward by the millions. Though morale plummets, this retreat may be the only way to preserve the army for future battles."
wsv_russia.52.a:0 "Withdraw and regroup—Russia must endure!"
wsv_russia.53.t:0 "Tsar Nicholas Takes Command"
wsv_russia.53.d:0 "The chaos of the Great Retreat has finally subsided. In a move meant to restore confidence in the army and the monarchy, Tsar Nicholas II has personally assumed command of the armed forces. Many see this as a patriotic gesture, while others fear the Tsar’s inexperience will only deepen Russia’s crisis. The Empire rallies behind its sovereign—for now."
wsv_russia.53.a:0 "The Tsar will lead us to victory—or ruin."
wsv_russia.55.t:0 "Rationing Introduced"
wsv_russia.55.d:0 "The war has dragged on far longer than anyone expected, and our food reserves are starting to run low. With so many farmers now serving at the front, agricultural output has fallen sharply. To keep the nation fed, we have no choice but to introduce rationing. For now, the shortages are mild, and most civilians can still get by—but unease is growing."
wsv_russia.55.a:0 "A necessary measure"
wsv_russia.56.t:0 "Worsening Food Shortages"
wsv_russia.56.d:0 "The food situation has worsened drastically. Bread and potatoes have become scarce, and many households can no longer meet even basic dietary needs. Reports of hunger and malnutrition are spreading, particularly in the cities. Frustration is mounting as people begin to lose faith in the government’s ability to provide for them."
wsv_russia.56.a:0 "This cannot continue"
wsv_russia.57.t:0 "Nationwide Food Crisis"
wsv_russia.57.d:0 "Our food stores are exhausted. Desperate civilians are foraging for roots, stray animals, or anything edible. In some regions, outright starvation has taken hold. Social order is breaking down as hunger drives people to desperation. Without immediate relief, a full-scale famine will soon engulf the nation."
wsv_russia.57.a:0 "The home front is breaking"
wsv_russia.60.t:0 "The February Riots in Petrograd"
wsv_russia.60.d:0 "What began as demonstrations by women workers demanding 'Bread and Peace' on International Women’s Day has erupted into a full-scale uprising in Petrograd. Factories have shut down, crowds fill the streets, and soldiers sent to restore order are joining the protesters instead. With the capital in chaos and the army wavering, calls for the Tsar’s abdication grow louder by the hour. The old order trembles on the brink of collapse..."
wsv_russia.60.a:0 "The Tsar must step down."
wsv_russia.61.t:0 "Collapse of the Front, Collapse of the Tsar"
wsv_russia.61.d:0 "German forces have swept across the western front, capturing Minsk, Kiev, and even approaching the outskirts of Petrograd itself. Panic grips the empire as food runs short and faith in the monarchy evaporates. In the streets, masses demand peace, bread, and the Tsar’s abdication. Facing military defeat and domestic revolt, Nicholas II finds himself utterly isolated — the empire he inherited now crumbling around him."
wsv_russia.61.a:0 "The Tsar has no choice but to abdicate."
wsv_russia.63.t:0 "Fall of the Romanovs"
wsv_russia.63.d:0 "After months of growing unrest and catastrophic defeats at the front, the Russian Empire has reached its breaking point. Food shortages and rampant inflation drove tens of thousands into the streets of Petrograd, where strikes and demonstrations quickly spiraled into full-scale riots. When soldiers refused orders to fire on the crowds and instead joined the protesters, the fate of the monarchy was sealed.\n\nFacing the collapse of both the front and the capital, Tsar Nicholas II has abdicated the throne, bringing an end to more than three centuries of Romanov rule. A Provisional Government has taken power in Petrograd, pledging reform and the continuation of the war — though few believe Russia’s turmoil is truly over."
wsv_russia.63.a:0 "A new chapter for Russia begins"
wsv_russia.64.t:0 "The Soviets Assert Authority"
wsv_russia.64.d:0 "During the fall of the Tsar, workers and soldiers in Petrograd formed the Soviets—councils that now wield real power over the population and the armed forces. The Provisional Government finds itself compelled to share authority with these councils, recognizing their role in maintaining order."
wsv_russia.64.a:0 "We have no choice but to share power with the Soviets"
wsv_russia.65.t:0 "Soviets Issue Directives"
wsv_russia.65.d:0 "The Soviets have issued Order No. 1, directing soldiers to follow the councils’ commands rather than those of the government in matters affecting the population.\n\nAt the same time, they demand an immediate end to all offensive war plans. With unrest spreading across the country and the army increasingly under Soviet influence, there is no room for resistance—the councils’ authority must be accepted."
wsv_russia.65.a:0 "We have no choice but to comply"
RUS_drop_offensive_wargoals_tt:0 "§YWe will drop all claims on enemy states (unless we have cores on that state)!§!"
wsv_russia.66.t:0 "Lenin Returns to Russia"
wsv_russia.66.d:0 "After years in exile, Vladimir Lenin has returned to Petrograd. With the aid of the Germans, he traveled across Europe in a sealed train, stepping onto Russian soil once more to a rapturous welcome from the Bolsheviks. \n\nFrom the steps of the Finland Station, he denounced the Provisional Government as a tool of the bourgeoisie and called for 'All power to the Soviets!' His arrival electrifies the revolutionary left and threatens to upend the fragile balance we have fought to preserve. If his rhetoric continues to spread, our authority may soon be challenged by something far more radical."
wsv_russia.66.a:0 "A dangerous man has returned..."
wsv_russia.67.t:0 "The Kerensky Offensive Fails"
wsv_russia.67.d:0 "The summer offensive, launched as a last ditch attempt to win the war, has ended in disaster.  Many soldiers refused orders to attack, and some even mutinied against their officers.  At home confidence in the Provisional Government is fading fast and the calls for 'All Power to the Soviets' grow ever louder."
wsv_russia.67.a:0 "A disaster"
wsv_russia.68.t:0 "The Kerensky Offensive Succeeds"
wsv_russia.68.d:0 "Defying pessimistic predictions, and against all odds, the Kerensky Offensive has achieved a stunning success. Our forces have driven the enemy from Russian soil, the public is jubilant, and confidence in the Provisional Government surges."
wsv_russia.68.a:0 "A miracle!"
delayed_bolshevik_coup_tt:0 "§YThe Bolshevik coup has been delayed.§!"
wsv_russia.69.t:0 "The July Days"
wsv_russia.69.d:0 "Petrograd has erupted into chaos. Thousands of workers, soldiers, and sailors have taken to the streets, shouting for 'All Power to the Soviets!' and denouncing the Provisional Government. Bolshevik agitators fan the unrest, urging the people to seize control of the city. Loyal troops are scattered and uncertain, and gunfire echoes through Nevsky Prospekt. If this disorder spreads, the government's grip on Russia may collapse entirely."
wsv_russia.69.a:0 "We must restore order at once!"
wsv_russia.70.t:0 "Bolshevik Militias Forming"
wsv_russia.70.d:0 "Reports indicate that Bolshevik supporters are arming themselves across Petrograd and the industrial centers. So-called 'Red Guards' are organizing under party banners, drilling openly, and stockpiling weapons from army depots and factories. Though they claim these groups exist for self-defense, it is clear the Bolsheviks are preparing for something far greater. The authority of the Provisional Government is being openly challenged."
wsv_russia.70.a:0 "This cannot be tolerated!"
wsv_russia.75.t:0 "Bolsheviks Seize Power in Petrograd"
wsv_russia.75.d:0 "In the early hours of the morning, armed Bolshevik Red Guards stormed key government buildings in Petrograd, including the Winter Palace, seat of the Provisional Government. After brief fighting, the ministers were arrested and power was proclaimed to the Soviets.\n\nVladimir Lenin has emerged from hiding to declare the birth of a new socialist regime — the Council of People's Commissars. The old government has collapsed, and Russia has fallen into the hands of the Bolsheviks. Across the nation, loyalist officers, revolutionaries, and nationalists alike scramble to decide their next move. The world watches in shock as Russia, once an empire, now stands on the brink of civil war."
wsv_russia.75.a:0 "A new order rises from the ashes"
wsv_russia.75.b:0 "The world trembles at the red dawn"
russian_bolshevik_revolution_occured:0 "Bolshevik Revolution in Russia has Occured"
wsv_russia.76.t:0 "Offer Peace to the Central Powers"
wsv_russia.76.d:0 "The workers and peasants demand peace, not more bloodshed for the sake of imperial ambitions. The revolution cannot survive while the war drains our strength. We must reach out to the Germans and end this conflict, no matter the cost."
wsv_russia.76.a:0 "Send envoys to propose peace."



#  wsv_russia.102.t:0 "Continue the War?"
#  wsv_russia.102.d:0 "The war has become extremely popular at home, and radical factions such as the Bolsheviks are promising to sue for peace should they take power.  Although we have a commitment to our allies, withdrawing from the war may be the more politically safe move."
#  wsv_russia.102.a:0 "Just one more offensive"
#  wsv_russia.102.b:0 "Apologies allies..."
#  wsv_russia.103.t:0 "Russian Government Affirms Commitment to the War"
#  wsv_russia.103.d:0 "The Russian Provisional Government has affirmed its commitment to the ongoing war effort and its Entente allies, stating that their war aims remain the same as that of the late Russian Empire."
#  wsv_russia.103.a:0 "Thankfully they stuck by us"
#  wsv_russia.103.b:0 "Is that wise?"
# wsv_russia.104.t:0 "Kerensky Takes Power"
# wsv_russia.104.d:0  "Alexander Kerensky, leader of the social-democratic Trudovik faction, has replaced Prince Georgy Yevgenyevich Lvov as the leader of the Russian Provisional Government."
# wsv_russia.104.a:0 "A more democratic figurehead"
#  wsv_russia.105.t:0 "Bolsheviks Mobilizing"
#  wsv_russia.105.d:0 "We have recieved reports that the Bolsheviks are gathering supports and spewing inflammatory rhetoric against the current government. This could be dangerous if it continues."
#  wsv_russia.105.a:0 "We must stop them"
# wsv_russia.106.t:0 "Order Restored in Russia"
# wsv_russia.106.d:0 "Thanks to the tireless efforts of the various White factions, the Bolshevik threat has finally been eliminated.  Although sporadic rebels attempted to stage one or two insurrections throughout the country, they lacked support and were quickly crushed by the local police and White forces.  We can now focus on rebuilding Russia."
# wsv_russia.106.a:0 "Thank god"
# political_crisis_resolved:0 "Political Instability Quelled"
# wsv_russia.110.t:0 "Russian Revolution"
# wsv_russia.110.d:0 "Civil war has broken out in Russia, as months of unrest and discontent against the war and the Tsar have finally boiled over into open revolution.  The Bolsheviks, lead by Vladimir Lenin, have taken over Petrograd and declared the formation of a new Russian Soviet Republic.  The Tsar meanwhile has fled the city and gone into hiding, and a provisional government has been established to fight the Bolsheviks."
# wsv_russia.110.a:0 "What happens now?"
# wsv_russia.111.t:0 "Whites Win the Russian Civil War"
# wsv_russia.111.d:0 "Today the last pockets of Bolshevik forces were routed in Siberia.  With the destruction of the Bolshevik forces and the death of many of its leaders, the Bolshevik movement has effectively ceased to exist.  Undoubtedly revolutionary sentiment remains in Russia, but now that the war is over the Whites can turn their attention to rebuilding Russia, and stamping out any remaining dissidents. "
# wsv_russia.111.a:0 "Finally it is over"
# wsv_russia.112.t:0 "Bolsheviks Win the Russian Civil War"
# wsv_russia.112.d:0 "Today the last pockets of White forces were routed in Siberia.  With the destruction of the White forces and the death of many of its leaders, the White movement has effectively ceased to exist.  Undoubtedly Tsarist and anti-Bolshevik sentiment remains in Russia, but now that the war is over the Reds can turn their attention to rebuilding Russia, and stamping out any remaining dissidents. "
# wsv_russia.112.a:0 "Finally it is over"


# Italy
wsv_italy.2.t:0 "Italy Invades Ottoman Libya"
wsv_italy.2.d:0 "Following a sudden ultimatum to the Ottoman Empire, Italy has launched a military expedition to seize the provinces of Tripolitania and Cyrenaica. Italian warships have bombarded coastal defenses, and landing forces have already secured key ports, taking advantage of the Ottomans’ limited ability to reinforce the region. Yet local Arab and Berber fighters have rallied to resist, and early reports suggest the conflict may not be the swift victory Rome hoped for. The Mediterranean now braces for a colonial war that could reshape the balance of power in North Africa."
wsv_italy.2.a:0 "Italy asserts its rightful claims!"
wsv_italy.2.b:0 "We will not abandon Libya."
wsv_italy.2.c:0 "A new war in the Mediterranean."
wsv_italy.3.t:0 "Early Success in Libya"
wsv_italy.3.d:0 "Our forces have secured the major coastal cities, pushing Ottoman troops back and establishing firm positions. Yet resistance remains strong inland, and the campaign shows signs of turning into a prolonged struggle."
wsv_italy.3.a:0 "Onwards!"
wsv_italy.4.t:0 "The War Drags On"
wsv_italy.4.d:0 "Instead of a quick colonial occupation, our troops are mired in a stubborn war of ambushes, desert marches, and entrenched positions. Ottoman officers and local fighters refuse to yield, and the expedition is lasting far longer than planned."
wsv_italy.4.a:0 "We must endure."
wsv_italy.5.t:0 "Italy Seizes the Dodecanese"
wsv_italy.5.d:0 "Italian naval forces have landed on Rhodes and rapidly overrun the Ottoman garrison there. With our attention fixed on the fighting in Libya, the Italians exploited our weakness in the Aegean and have taken control of the Dodecanese. Their foothold in the islands is now a fait accompli, further tightening their grip on the Eastern Mediterranean."
wsv_italy.5.a:0 "A serious setback."
wsv_italy.6.t:0 "Defeat in Libya"
wsv_italy.6.d:0 "After a prolonged campaign, our forces have been pushed back and the Ottomans have regained control of Libya. The expedition has ended in failure."
wsv_italy.6.a:0 "A bitter defeat."
wsv_italy.7.t:0 "Italy Secures Libya"
wsv_italy.7.d:0 "Italian forces now control the key provinces of Tripolitania and Cyrenaica. With our grip on Libya a fait accompli and unrest mounting in the Balkans, it is time to cut our losses and bring the conflict to an end."
wsv_italy.7.a:0 "Prepare to accept the loss."
wsv_italy.8.t:0 "Libya Secured"
wsv_italy.8.d:0 "The Ottoman Empire has formally approached us to negotiate peace, ready to hand over Libya and acknowledge Italian control."
wsv_italy.8.a:0 "Victory, at last."
wsv_italy.9.t:0 "Great Powers Step in to Mediate"
wsv_italy.9.d:0 "After over a year of stalemate, the Great Powers have stepped in to force negotiations. Both Italy and the Ottoman Empire are pressured to agree to terms, bringing the war toward an end and preventing further bloodshed in North Africa."
wsv_italy.9.a:0 "We must heed their demands."
wsv_italy.10.t:0 "Italy Victorious in Libya"
wsv_italy.10.d:0 "After months of hard fighting across the deserts of Tripolitania and Cyrenaica, Italy has secured a decisive triumph. The Ottoman Empire has formally ceded the region, placing Libya firmly under Italian rule. As Rome moves to establish its authority over the new territories—where unrest still simmers—European capitals take note. The balance of power in the Mediterranean has shifted, and Italy emerges emboldened on the colonial stage."
wsv_italy.10.a:0 "A new colonial chapter begins."
wsv_italy.10.b:0 "Victory at last!"
wsv_italy.10.c:0 "Libya falls to Italy."
wsv_italy.11.t:0 "Italian Defeat in Libya"
wsv_italy.11.d:0 "Italy’s bid to conquer Libya has ended in a sobering setback. Ottoman forces have driven back the invasion and reasserted their control over Tripolitania and Cyrenaica. In Rome, outrage and disappointment spread as the government faces scrutiny for the costly and fruitless campaign. Across the Mediterranean, observers note the Ottomans’ unexpected resilience—while Italy is left to reassess the limits of its imperial ambitions."
wsv_italy.11.a:0 "A humiliating defeat."
wsv_italy.11.b:0 "We have failed in Libya."
wsv_italy.11.c:0 "Ottoman control restored."
wsv_italy.12.t:0 "Great Powers Broker Peace in the Italo-Turkish War"
wsv_italy.12.d:0 "After more than a year of inconclusive fighting across the Mediterranean, the Italo-Turkish War has been brought to an unexpected close.  Alarmed by the risk of escalation and weary of the disruption to regional commerce, the Great Powers of Europe stepped in to impose a settlement on both Rome and Constantinople.\n\nUnder the agreement, the Ottoman Empire will retain formal sovereignty over Libya, while Italy is granted effective administrative control of the territory—an arrangement not unlike Britain’s position in Egypt. The compromise satisfies the European capitals eager for stability, but leaves both belligerents disgruntled."
wsv_italy.12.b:0 "A victory in name only."
wsv_italy.12.c:0 "A peace imposed, not chosen."
italoturkish_war_over:0 "Italo-Turkish War has Ended"



# wsv_italy.2.t:0 "Italo-Turkish War"
# wsv_italy.2.d:0 "An ultimatum was presented to the Ottoman government by Italy, demanding full transfer of Libya. Through Austrian intermediation, the Ottomans replied with the proposal of transferring control of Libya without war, but maintaining a formal Ottoman suzerainty. The Italian refused, and war is now declared."
# wsv_italy.2.a:0 "A war for a piece of sand?"
# wsv_italy.2.b:0 "Let's Fight!"
# wsv_italy.3.t:0 "Italian invasion of Libya"
# wsv_italy.3.d:0 "Those godless Italians have mounted an invasion of our territory, trying to steal it for their own! They seem to be after Libya specifically, and our defense of the area seems to be a long shot at best. Still, nothing the Sublime Sultanate can't stand, surely! Libyan volunteers have already been rallied, and Regulars are on their way from the contiguous empire!"
# wsv_italy.3.a:0 "Mobilise Libyian volunteers to the defense!"
# wsv_italy.4.t:0 "Ottomans Offer Terms"
# wsv_italy.4.d:0 "The Turks have been pushed to the point of surrender. They are offering us Libya and a temporary occupation of the Dodecanese islands, though no doubt we can make that permenant. These are great terms for a short war. We can push for more, but perhaps this peace is enough?"
# wsv_italy.4.a:0 "Take Libya and the Dodecanese"
# wsv_italy.4.b:0 "Nothing but total victory!"
# wsv_italy.5.t:0 "Italy Won the Italo-Turkish War"
# wsv_italy.5.d:0 "Yesterday, Italy and the Ottoman Empire signed a treaty in Ouchy near Lausanne. The Ottomans would withdraw all military personnel from Trablus and Benghazi vilayets."
# wsv_italy.5.a:0 "Italy won the Italo-turkish War"
# wsv_italy.5.b:0 "A Great Victory!"
# wsv_italy.5.c:0 "Let's go home..."
# wsv_italy.6.t:0 "Italians Offer Terms"
# wsv_italy.6.d:0 "We have managed to hold off the Italian attack on Libya, and now they are calling it quits."
# wsv_italy.6.a:0 "A great victory"
# wsv_italy.7.t:0 "Ottoman Empire Won the Italo-turkish "
# wsv_italy.7.d:0 "Italy lost the Italo-Turkish War."
# wsv_italy.7.a:0 "Ottoman Empire won the Italo-turkish War"
# wsv_italy.7.b:0 "Let's go home..."
# wsv_italy.7.c:0 "A Great Victory!"
# wsv_italy.8.t:0 "Defeat in Libya"
# wsv_italy.8.d:0 "The last of our forces in Libya have been defeated, and the Italians now control the entire region.  The war is lost."
# wsv_italy.8.a:0 "It is time for peace"

# Greece
wsv_greece.1.t:0 "Entente Troops Land in Thessaloniki"
wsv_greece.1.d:0 "French and British troops have landed in Thessaloniki without offical approval from the Greek government.  The Entente claims it as necessary to establish an evacuation route for Serbia troops, and state they were given unilateral permission by the Greek Prime Minister.  However the Greek King has vigorously protested the action of his Prime Minister, fearful that it might drag his country to war.  A tense stand-off ensues within the Greek government."
wsv_greece.1.a:0 "We must link up with the Serbs"
wsv_greece.1.b:0 "Worriesome"
wsv_greece.2.t:0 "Entente Troops Occupy Thrace"
wsv_greece.2.d:0 "Entente troops have expanded their presence in Greece, occupying Thrace."
wsv_greece.2.a:0 "Worriesome"
wsv_greece.2.b:0 "We must prepare against the Bulgarians"
wsv_greece.3.t:0 "Greek National Front Forms"
wsv_greece.3.d:0 "A splinter government in Greece has taken over control of the northern part of the country and thrown itself in league with the Entente."
wsv_greece.3.a:0 "Forwads for Serbia!"
wsv_greece.3.b:0 "Attack them!!"
wsv_greece.3.c:0 "Not good for Greece"
wsv_greece.4.t:0 "Greece Reunifies"
wsv_greece.4.d:0 "Both sides of the Greek government have finally come to share the same view of supporting the Entente.  Greece can reunify."
wsv_greece.4.a:0 "Excellent news"
greece_forced_into_entente_tt:0 "§LGreece will absorb the Greek National Front and join the Entente.§!"


# China
wsv_china.1.t:0 "Wuchang Uprising"
wsv_china.1.d:0 "Armed rebellion has broken out among members of the New Army. Similar revolts have now broke out spontaneously around the country, and revolutionaries in all provinces of the country have renounced the Qing dynasty."
wsv_china.1.a:0 "For the people!"
wsv_china.1.b:0 "For the Qing!"
wsv_china.2.t:0 "Xinhai Revolution"
wsv_china.2.d:0 "Long beset by both external and domestic problems, the ailing Qing Empire has suffered another revolt, as members of its 'New Army' have taken up arms against the government.  However various other revolutionaries have now taken up arms against the Qing as well, calling for an end to the monarchy.  Civil war has now broken out in China."
wsv_china.2.a:0 "Turmoil in China"
wsv_china.3.t:0 "We Are Beatened"
wsv_china.3.d:0 "Our army is falling back under the onslaught of the revolutionaries.  Perhaps we should sue for peace."
wsv_china.3.a:0 "Very well"
wsv_china.3.b:0 "No we shall prevail"
wsv_china.4.t:0 "Republic of China Victorious"
wsv_china.4.d:0 "Unable to withstand the might of the Revolutionary armies, the Qing Emperor has abdicated the throne and fled China. The Revolutionaries have now proclaimed victory and the establishment of the Republic of China."
wsv_china.4.a:0 "The end of imperial China"
wsv_china.5.t:0 "Qing Dynasty Victorious"
wsv_china.5.d:0 "Despite the best efforts of the Revolutionaries, the Imperial Qing armies were able to successfully route the uprisings, albeit at the cost of much blood.  It seems the Qing have managed to cling to power for a while longer."
wsv_china.5.a:0 "The rabble were no match"


# Haiti
wsv_haiti.t.99:0 "General Cincinnatus Leconte Goes AWOL"
wsv_haiti.d.99:0 "General Cincinnatus Leconte and his entire staff are nowhere to be found. They were summoned for a routine government meeting but never appeared. Some fear this may be the beginning of a coup."
wsv_haiti.a.99:0 "Where did he go..."
wsv_haiti.100.t:0 "Revolt by General Leconte in Haiti"
wsv_haiti.100.d:0 "Fighting has erupted in Haiti after former General Cincinnatus Leconte and his forces seized control of Cap-Haïtien, the nation's second-largest city. The rebels are now advancing south toward Port-au-Prince, where the government is scrambling to organize a defense. While Leconte claims to be leading a democratic uprising against the autocratic rule of President Antoine Simon, many observers believe this is merely a power grab. Nonetheless, several local Firminist militias have joined his cause, swelling the ranks of the rebellion."
wsv_haiti.100.a:0 "We can't afford to lose Haiti"
wsv_haiti.100.b:0 "This could be useful..."
wsv_haiti.100.c:0 "An interesting turn of events"
wsv_haiti.101.t:0 "Haitian Government Victorious"
wsv_haiti.101.d:0 "With the last rebel forces surrounded and defeated, General Leconte has fled the country.  The revolt is at an end."
wsv_haiti.101.a:0 "Thank god"
wsv_haiti.102.t:0 "General Leconte Victorious"
wsv_haiti.102.d:0 "This morning General Leconte marched into Port-au-Prince, deposing the old Haitian government.  The former President, Antoine Simon, has fled the country for the United States.  Although Leconte originally promsied to host elections, he has now siezed power for himself and declared hismelf the new President of Haiti."
wsv_haiti.102.a:0 "A new era"
wsv_haiti.103.t:0 "National Palace Explosion"
wsv_haiti.103.d:0 "A shocking tragedy struck this morning as the National Palace in Haiti was rocked by a massive explosion. President [HAI.GetLeader] was killed in the blast, along with several hundred soldiers. While some sources attribute the incident to a munitions accident, others claim it was a targeted assassination. The truth remains uncertain — but dark days lie ahead for Haiti."
wsv_haiti.103.a:0 "What on Earth..."
wsv_haiti.104.t:0 "Civil War Breaks Out"
wsv_haiti.104.d:0 "Whether it be a power-hungry general, or democratic idealists tired of autocratic rule, another political faction has risen in open revolt. Militias have already begun to mobilize, and their leaders have vowed to march on Port-au-Prince. Once again, Haiti is thrust into chaos as civil war erupts."
wsv_haiti.104.a:0 "Not again..."
wsv_haiti.105.t:0 "The Warlord Era Begins in Haiti"
wsv_haiti.105.d:0 "With the death of the Haitian president in the National Palace explosion, a power vacuum has emerged. In the days since, several rival generals have declared themselves the rightful leader of Haiti. The nation has once again descended into civil war. Though some generals have formed uneasy alliances, observers fear that even a victory will not bring stability. For now, Haiti stands fractured, and its future uncertain."
wsv_haiti.105.a:0 "This is a terrible blow for us"
wsv_haiti.105.b:0 "A great blow to the U.S."
wsv_haiti.105.c:0 "Poor Haiti"

# Dominican Republic
wsv_dr.100.t:0 "President Ramón Cáceres Assassinated!"
wsv_dr.100.d:0 "Earlier today, several conspirators ambushed President Ramón Cáceres's horse-drawn carriage. In the ensuing shootout, the President was killed—though several conspirators were also slain. The leader of the plot, General Luis Tejera, was quickly captured and executed. With both the president and ringleader now dead, the question remains--who will take control of the government?"
wsv_dr.100.a:0 "Troubling times"
wsv_dr.101.t:0 "Civil War in the Dominican Republic"
wsv_dr.101.d:0 "Following last month's assassination of President Ramón Cáceres, a power vacuum has emerged in Santo Domingo. General Alfredo Victoria, commander of the Dominican Army, has seized power and appointed his uncle, Eladio Victoria, as president. However, many throughout the country have rejected this claim. A popular uprising—led by the formerly exiled Horacio Vásquez and supported by General Desiderio Arias—has formed with the goal of overthrowing Alfredo Victoria and restoring democracy to the Dominican Republic."
wsv_dr.101.a:0 "What a mess"
wsv_dr.101.b:0 "This could be an opportunity"

# Carribean Game
USA_latam_decisions_available_tt:0 "§YDecisions§! are available under §YThe Little Game in Latin America.§!"
CSA_latam_decisions_available_tt:0 "§YDecisions§! are available under §YExpansion in Latin America.§!"
wsv_carib_game.2.t:0 "Government Forces Win Civil War "
wsv_carib_game.2.d:0 "The forces of President Antoine Simon have emerged victorious from the civil war.  Order and peace can now return to Haiti."
wsv_carib_game.2.a:0 "Our aid surely helped"
wsv_carib_game.3.t:0 "Rebel Forces Win Civil War "
wsv_carib_game.3.d:0 "The forces of General Leconte Cincinnatus have successfully taken Port-Au-Prince and proclaimed the general the new President of Haiti.  Meanwhile former President Antoine Simon has fled into exile."
wsv_carib_game.3.a:0 "We must work with the new government"
wsv_carib_game.100.t:0 "[FROM.GetName] Sends Rifles"
wsv_carib_game.100.d:0 "[From.GetNameDef] has sent us some rifles to aid us in our struggle."
wsv_carib_game.100.a:0 "Many thanks"
wsv_carib_game.101.t:0 "[FROM.GetName] Sends Warships to Support Us"
wsv_carib_game.101.d:0 "[FROM.GetNameDef] has sent several warships to bombard the positions of our adversaries.  This should make future offensives easier -- assuming the warships stick around."
wsv_carib_game.101.a:0 "This will prove useful"
wsv_carib_game.102.t:0 "[FROM.GetName] Sends Warships to Support [minor_country_supported.GetName]"
wsv_carib_game.102.d:0 "[FROM.GetNameDef] has sent several warships to asist forces of [minor_country_supported.GetNameDef]. Although we do not care much about the outcome of the battle, the act of sending warships into our zone of influence is a directly challenge to us, and cannot go unanswered."


### Agadir Crisis
wsv_agadir.1.t:0 "French Troops Occupy Morocco"
wsv_agadir.1.d:0 "A recent rebellion in Morocco has prompted the French government to occupy the country, citing the need to protect European lives and property.  While Morocco is nominally under French control, Germany has a large economic influence in the region, and has been promised a say in the affairs of Morocco by treaties signed in 1909. The recent move by France has thus been met by condemnation by Germany, and it is likely they will respond before long."
wsv_agadir.1.a:0 "Morocco is French"
wsv_agadir.1.b:0 "How dare they!"
wsv_agadir.1.c:0 "This doesnt look good"
wsv_agadir.2.t:0 "Agadir Crisis"
wsv_agadir.2.d:0 "In what seems like a repeat of the First Morrocan Crisis, Germany has denounced the growing French influence in Morocco--and in order to assert their position, has despatched the gunboat Panther to the Moroccan city of Agadir.  The move has raised alarm bells in Europe, and both Germany and France have iniated limited mobilizations.  If not resolved with care, this crisis could lead to the first colonial war between the European powers."
wsv_agadir.2.a:0 "How dare they!"
wsv_agadir.2.b:0 "Your move baguette-heads"
wsv_agadir.2.c:0 "Over Morocco?"
wsv_agadir.3.t:0 "Intervene in Morocco?"
wsv_agadir.3.d:0 "The dispute between France and Germany over Morocco has the potential of sparking off a wider war.  It may be in our best interest to intervene and try to mediate a solution.  The French likely expect our support too, and may be upset if we stay on the sidelines."
wsv_agadir.3.a:0 "Send warships to Morocco"
wsv_agadir.3.b:0 "Its not our concern"
france_less_likely_ally_tt:0 "§RThis will upset France, which may choose to cancel their Non-Aggression Pact with us!.§!"
britain_response_to_agadir:0 "Britain Has Responded to Crisis"
wsv_agadir.4.t:0 "Britain Intervenes in Morocco"
wsv_agadir.4.d:0 "In a show of support for the French, the British have dispatched warships of their own to the port city of Agadir.  They warn Germany against taking any aggressive action against the French."
wsv_agadir.4.a:0 "So they choose to intervene.."
wsv_agadir.4.b:0 "Those damn Brits!"
wsv_agadir.4.c:0 "What will happen now?"
britain_backs_france_in_agadir:0 "Britain Backed France in Morocco"
wsv_agadir.5.t:0 "Britain Chooses not to Intervene"
wsv_agadir.5.d:0 "The British government has informed us that they will not be intervening in the ongoing crisis, as they are not obligated under the Entente Cordial and view this an affair between France and Germany."
britain_abandoned_france_in_agadir:0 "Britain Abandoned France in Morocco"
wsv_agadir.5.a:0 "Thanks for nothing"
wsv_agadir.6.t:0 "Britain Intervenes on Our Side"
wsv_agadir.6.d:0 "The British government has informed us that they recognize our right to occupy Morocco and will stand with us should the Germans try any aggressive actions."
wsv_agadir.6.a:0 "Always good to have more help"
wsv_agadir.8.t:0 "Germany Sends Initial Demands"
wsv_agadir.8.d:0 "Germany informs us that, while they have no territorial ambitions in Morocco itself, they demand compensation in the French Congo. Specifically, they insist on the cession of the entire French Congo from the Sangha River to the sea. Such audacity cannot be ignored."
wsv_agadir.8.a:0 "Those demands are far too harsh"
wsv_agadir.8.b:0 "If that is the price of peace..."
wsv_agadir.9.t:0 "Germany's Shocking Demands"
wsv_agadir.9.d:0 "Germany has presented France with extreme terms, including nearly the entire French Congo. The sheer brazenness of these demands lays bare the boundless arrogance of German diplomacy."
wsv_agadir.9.a:0 "Denounce the demands publicly"
wsv_agadir.9.b:0 "Best to maintain tact for now"
wsv_agadir.10.t:0 "George Lloyd's Mansion House Speech"
wsv_agadir.10.d:0 "As Franco-German negotiations over Morocco stalled and tensions mounted across Europe, the world watched to see whether diplomacy would hold. It was in this charged atmosphere that Chancellor of the Exchequer David Lloyd George delivered his Mansion House Speech.\n\nIn a firm warning aimed squarely at Berlin, he declared that Britain could not stand aside if France were coerced or the European balance upset. His words echoed across the continent, signaling a sharp escalation in Britain’s stance and deepening fears that the crisis might soon spiral beyond control."
wsv_agadir.10.a:0 "Surely Europe will not go to war over Morocco?"
wsv_agadir.11.t:0 "France Rejects Our Demands"
wsv_agadir.11.d:0 "France has refused our initial demands for the French Congo, labeling them excessive. We must now decide whether to soften our stance or terminate negotiations altogether."
wsv_agadir.11.a:0 "Present more moderate demands"
wsv_agadir.11.b:0 "End negotiations"
wsv_agadir.12.t:0 "Germany Revises Its Demands"
wsv_agadir.12.d:0 "Germany has returned with revised terms, dropping claims to the entire Congo and now only requesting compensation that includes a portion of northern Kamerun and Togoland. It is more reasonable, but we must consider the wider diplomatic context."
wsv_agadir.12.a:0 "Stall for time... what do the British think?"
wsv_agadir.12.b:0 "These are acceptable terms"
wsv_agadir.13.t:0 "France Asks Our Position"
wsv_agadir.13.d:0 "France seeks our guidance regarding Germany’s revised demands, which are significantly more moderate than before. How should we advise them?"
wsv_agadir.13.a:0 "Advise them to compromise"
wsv_agadir.13.b:0 "We will give nothing to these Germans"
wsv_agadir.14.t:0 "Britain Urges Compromise"
wsv_agadir.14.d:0 "Britain recommends that we accept Germany's moderated demands to avoid escalating tensions and potential conflict. Their counsel carries great weight."
wsv_agadir.14.a:0 "Understood, we will comply"
wsv_agadir.15.t:0 "Britain Signals Resolve"
wsv_agadir.15.d:0 "Britain has made clear its disapproval of German aggression and its commitment to our defense should hostilities arise. We are tacitly encouraged to reject Germany’s demands only if doing so serves our national interest."
wsv_agadir.15.a:0 "Noted"
wsv_agadir.16.t:0 "France Stalls"
wsv_agadir.16.d:0 "Despite our softened demands, the French are evasive, providing vague replies whenever we request updates. We must apply pressure to compel a clear decision."
wsv_agadir.16.a:0 "Demand an immediate response"
wsv_agadir.17.t:0 "Germany Demands a Decision"
wsv_agadir.17.d:0 "Germany presses for a definitive answer on their softened terms. They warn that failure to respond promptly will be interpreted as a rejection, leaving them no choice but to act unilaterally."
wsv_agadir.17.a:0 "Very well, we accept the demands"
wsv_agadir.17.b:0 "We will not be intimidated by Germany"
agadir_negotiations_will_end_tt:0 "§RNegotiations will end.§!"
small_chance_germany_breaks_off_negotiations_tt:0 "§RThere is a small chance that Germany will abandon talks entirely.§!"
give_germany_all_of_congo_tt:0 "§LGermany will receive full compensation in the French Congo, securing the entire region from the Sangha River to the sea.§!"
give_germany_part_of_congo_tt:0 "§LGermany will receive partial compensation in Africa, including northern Kamerun and Togoland.§!"
FRA_agadir_britain_will_not_support_tt:0 "§RBritain will not support us in a war against Germany if we refuse compromise.§!"
wsv_agadir.18.t:0 "France Rejects Our Final Terms"
wsv_agadir.18.d:0 "Despite our decision to moderate our demands and offer France a reasonable basis for settlement, they have once again refused to accept our terms. We had hoped that concessions on our part would open the path to a diplomatic resolution, but the French appear determined to stall or defy us at every step."
wsv_agadir.18.b:0 "Enough—negotiations are over."
wsv_agadir.19.t:0 "France Accepts German Demands"
wsv_agadir.19.d:0 "After weeks of tension, delays, and diplomatic maneuvering, France has finally agreed to German terms. The Agadir Crisis, which once threatened to destabilize all of Europe, is now resolved.\n\n\Implementation of the deal itself will take some time."
wsv_agadir.19.a:0 "An agreement at last"
wsv_agadir.20.t:0 "Negotiations Collapse in the Agadir Crisis"
wsv_agadir.20.d:0 "The long-running negotiations between Germany and France over the Agadir Crisis have collapsed without agreement. Weeks of tense exchanges, shifting demands, and diplomatic warnings have ended in total deadlock. In Berlin, frustration is mounting amid talk that Germany may soon act decisively to defend its interests. Across Europe, governments watch anxiously, fearing that the breakdown could tip the continent toward a wider confrontation."
wsv_agadir.20.a:0 "France has forced our hand"    
wsv_agadir.20.b:0 "A grave turn for Europe"      
wsv_agadir.21.t:0 "Agadir Crisis Resolved Through Compromise"
wsv_agadir.21.d:0 "After months of tense diplomatic standoff, Germany and France have reached a compromise ending the Agadir Crisis. Under the agreement, France will formalize its protectorate over Morocco, while Germany receives territorial compensation in Central Africa.\n\nThough the settlement averts the immediate threat of conflict, the crisis has exposed the fragile balance of power on the continent and deepened mistrust among the Great Powers. Many observers warn that the bitterness left in its wake may only be a prelude to even greater tensions ahead, as Europe’s rival blocs continue their quiet march toward confrontation."
wsv_agadir.21.a:0 "A welcome relief"
agadir_crisis_compromise_reached:0 "Compromise Reached in the Agadir Crisis"
 wsv_agadir.22.t:0 "Germany Issues Ultimatum to France"
 wsv_agadir.22.d:0 "In a dramatic escalation of the Agadir Crisis, the German government has issued a formal ultimatum demanding that France withdraw entirely from Morocco. Berlin accuses Paris of overreach following its expanded military presence in the region and insists that only a full retreat can preserve the balance of power.\n\nDiplomatic observers warn that the situation has now entered its most dangerous phase. If France refuses the ultimatum, Europe may be just days away from a general war."
 wsv_agadir.22.a:0 "The crisis sharpens."
 wsv_agadir.23.t:0 "Germany Demands Our Withdrawal from Morocco"
 wsv_agadir.23.d:0 "Berlin has delivered a blunt ultimatum-- France must withdraw all forces and administrative personnel from Morocco or face the prospect of war with Germany.\n\nThe demand is humiliating and unprecedented. Yet with tensions already inflamed after the Agadir incident and negotiations failing to offer a clear resolution, rejecting the ultimatum may plunge Europe into immediate conflict.\n\nOur government must choose its path — accept a diplomatic defeat, or stand firm and risk war."
 wsv_agadir.23.a:0 "We will withdraw to preserve peace."
 wsv_agadir.23.b:0 "We refuse. France will not be intimidated."
 withdraw_from_morocco_tt:0 "§RFrance will withdraw from Morocco, accepting Germany's ultimatum.§!"
 war_with_germany_tt:0 "§RRejecting the ultimatum will lead to war with Germany.§!"
 wsv_agadir.24.t:0 "France Accepts German Ultimatum"
 wsv_agadir.24.d:0 "In a stunning turn of events, the French government has agreed to withdraw from Morocco, capitulating to Germany’s ultimatum. Berlin has hailed the decision as a triumph of firmness, while Paris faces embarrassment at home and abroad.\n\nGerman guarantees to Morocco and the transfer of several territories have formally ended the crisis, yet the repercussions are already spreading. France's prestige has suffered a serious blow, and political divisions within the country are sharpening.\n\nAcross Europe, critics fear that the settlement has merely postponed an inevitable clash between the great powers — a foreboding sign of the mounting tensions that continue to destabilize the continent."
 wsv_agadir.24.a:0 "A victory for German diplomacy."
 wsv_agadir.24.b:0 "A humiliation for France…"
 wsv_agadir.24.c:0 "A troubling omen for Europe."
 wsv_agadir.25.t:0 "France Rejects German Ultimatum"
 wsv_agadir.25.d:0 "France has refused Germany’s demand to withdraw from Morocco, declaring that such a concession would compromise national honor and European stability. Berlin has condemned the decision and responded by placing its forces on heightened alert.\n\nDiplomats across the continent are scrambling to contain the fallout, but the crisis now appears to be slipping beyond control. With both powers mobilizing politically and militarily, observers warn that Europe stands at the edge of a continental conflict."
 wsv_agadir.25.a:0 "Over Morocco?!"
 wsv_agadir.26.t:0 "France Rejects Our Ultimatum"
 wsv_agadir.26.d:0 "Paris has refused our demand to withdraw from Morocco. Their defiance leaves little room for further diplomatic maneuvering. Reports indicate that the French government is preparing for conflict \n\nGermany must now decide how to respond. The Reichstag and the public expect decisive action — and all of Europe watches closely to see whether the Empire will assert its strength or retreat in the face of French obstinacy."
 wsv_agadir.26.a:0 "France has chosen war."
withdraw_from_morocco_tt:0 "§RWe will withdraw entirely from Morocco.§!"
war_with_germany_tt:0 ""§RWill mean war with Germany!.§!""
wsv_agadir.27.t:0 "Too Late to Act"
wsv_agadir.27.d:0 "Our hesitation has cost us dearly. Events in Morocco have moved beyond our control, and any chance to influence the outcome has slipped from our grasp. This failure will not go unnoticed at home or abroad."
wsv_agadir.27.a:0 "A costly embarrassment..."
wsv_agadir.28.t:0 "Italy Eyes an Opportunity"
wsv_agadir.28.d:0 "The mounting tensions between France and Germany have created an opening for us. If we court the right Great Power, we may secure diplomatic support for our ambitions in Libya."
wsv_agadir.28.a:0 "Approach France"
wsv_agadir.28.b:0 "Approach Germany"
wsv_agadir.29.t:0 "Italy Requests Our Support"
wsv_agadir.29.d:0 "Italy has approached us seeking diplomatic backing for an expedition in Libya against the Ottoman Empire. Supporting their aims could strengthen ties with Rome, but may complicate our wider strategic interests."
wsv_agadir.29.a:0 "We will support Italy"
wsv_agadir.29.c:0 "We cannot support them"
wsv_agadir.30.t:0 "Support Secured"
wsv_agadir.30.d:0 "Our diplomatic outreach has succeeded. [FROM.GetName] has agreed to back our ambitions in Libya, giving our initiative newfound legitimacy and momentum."
wsv_agadir.30.a:0 "Excellent"
wsv_agadir.31.t:0 "Support Denied"
wsv_agadir.31.d:0 "Our request to [FROM.GetName] for support for our Libyan ambitions has been declined. Disappointing—yet another Great Power may still be willing to assist us, if we act swiftly."
wsv_agadir.31.a:0 "Approach France instead"
wsv_agadir.31.b:0 "Approach Germany instead"
wsv_agadir.31.c:0 "We have exhausted our options"


### Balkan League Formation + First Balkan War
balkan_league_formed:0 "Balkan League Formed"
balkan_league_member:0 "Balkan League Member"
wsv_firstbalkan.1.t:0 "Serbia Proposes a Balkan Alliance"
wsv_firstbalkan.1.d:0 "Envoys from [FROM.GetName] have arrived with a formal proposal—to bind our nations together in a defensive alliance against the Ottoman Empire.\n\nThey argue that only coordinated action can secure the remaining Christian lands still under Ottoman rule, and that cooperation now will determine the balance of power in the Balkans for years to come."
wsv_firstbalkan.1.a:0 "We will stand with [FROM.GetName]."
wsv_firstbalkan.1.b:0 "We cannot commit to this alliance."
wsv_firstbalkan.2.t:0 "[ROOT.GetName] Joins the Balkan League"
wsv_firstbalkan.2.d:0 "[ROOT.GetName] has accepted Serbia’s proposal and agreed to join the emerging Balkan League.\n\nTheir government has declared its readiness to participate in coordinated military planning and future territorial discussions aimed at liberating Ottoman-held lands."
wsv_firstbalkan.2.a:0 "Another ally joins our cause."
wsv_firstbalkan.3.t:0 "[ROOT.GetName] Declines the Alliance"
wsv_firstbalkan.3.d:0 "Diplomats from [ROOT.GetName] have delivered a formal rejection of our proposed alliance. Concerns over regional stability, distrust among the Balkan states, or a simple reluctance to provoke the Ottomans may have influenced their decision.\n\nRegardless, they will not join the League."
wsv_firstbalkan.3.a:0 "A disappointing setback."
wsv_firstbalkan.4.t:0 "Balkan League Territorial Negotiations Open"
wsv_firstbalkan.4.d:0 "With the outlines of a Balkan alliance taking shape, the member states have agreed to open formal negotiations on the division of Ottoman territories.\n\nThese talks will determine who lays claim to Macedonia, Thrace, and other contested regions should war break out. The outcome may strengthen unity—or plant the seeds of future conflict."
wsv_firstbalkan.4.a:0 "Let the negotiations begin."
wsv_firstbalkan.5.t:0 "Dispute Over [league_target_state.GetName]"
wsv_firstbalkan.5.d:0 "[From.GetName] has claimed [league_target_state.GetName] in the negotiations, directly conflicting with our own aims. We must decide whether to contest their demand or step aside."
wsv_firstbalkan.5.a:0 "We will not yield"
wsv_firstbalkan.5.b:0 "Let them have it"
wsv_firstbalkan.6.t:0 "[From.GetName] Accepts Our Claim"
wsv_firstbalkan.6.d:0 "[From.GetName] has conceded our claim to [league_target_state.GetName], easing tensions within the League."
wsv_firstbalkan.6.a:0 "Good"
wsv_firstbalkan.7.t:0 "[From.GetName] Contests Our Claim"
wsv_firstbalkan.7.d:0 "[From.GetName] has challenged our claim to [league_target_state.GetName]. The dispute will have to be settled later."
wsv_firstbalkan.7.a:0 "So be it"
wsv_firstbalkan.8.t:0 "Forced to Withdraw from the Talks"
wsv_firstbalkan.8.d:0 "War has broken out, leaving us unable to continue participating in the Balkan League’s territorial negotiations. With our attention now required on the battlefield, we must formally withdraw from the discussions."
wsv_firstbalkan.8.a:0 "We have no choice"
wsv_firstbalkan.9.t:0 "[FROM.GetName] Leaves the Negotiations"
wsv_firstbalkan.9.d:0 "[FROM.GetName] has withdrawn from the Balkan League’s territorial negotiations. Their departure complicates the talks and raises concern about whether the League can maintain a coordinated position."
wsv_firstbalkan.9.a:0 "A setback for unity"
wsv_firstbalkan.10.t:0 "The Balkan League Is Formed"
wsv_firstbalkan.10.d:0 "After months of discussion and disputes, the territorial negotiations have concluded. The participating states have accepted a framework for cooperation and agreed to set aside their rivalries—at least for the moment.\n\nThe Balkan League now stands united, prepared to coordinate military action against the Ottoman Empire."
wsv_firstbalkan.10.a:0 "A new alliance rises in the Balkans."
balkan_league_territorial_negotiations_over:0 "Balkan League Territorial Negotiations have Concluded"
wsv_firstbalkan.11.t:0 "The Balkan League Forms"
wsv_firstbalkan.11.d:0 "Reports have indicated that several Balkan states have signed alliances binding them together.  Although these alliances are claimed to be defensive in nature, the true purpose may be territorial expansion at the expense of either Austria-Hungary or Ottoman Turkey."
wsv_firstbalkan.11.a:0 "Concerning"
wsv_firstbalkan.11.b:0 "A pleasing development"
wsv_firstbalkan.12.t:0 "The First Balkan War"
wsv_firstbalkan.12.d:0 "At dawn today, the Balkan League—led by Serbia and joined by its allies—launched coordinated offensives against the Ottoman Empire, determined to reclaim long-disputed territories still under Ottoman rule. The Sublime Porte, already weakened by internal unrest and recent military setbacks, now faces a united coalition intent on reshaping the map of southeastern Europe.\n\nIn the capitals of the Great Powers—particularly in Vienna—observers watch with growing unease. A decisive victory for the Balkan League could dramatically shift the balance of power across the continent."
wsv_firstbalkan.12.a:0 "War returns to the Balkans."
wsv_firstbalkan.13.t:0 "The War Turns Against Us"
wsv_firstbalkan.13.d:0 "The situation has deteriorated beyond recovery. Large stretches of Macedonia, Epirus, and Thrace have fallen to the Balkan League, and our forces are no longer able to contain their advance.\n\nWith the frontline collapsing and morale shaken, officials in Constantinople acknowledge that the war cannot be won. Preparations for seeking terms are already underway."
wsv_firstbalkan.14.t:0 "The Ottoman Empire Seeks an Armistice"
wsv_firstbalkan.14.d:0 "Envoys from Constantinople have approached our government, signaling the Ottoman Empire’s willingness to end hostilities. Their forces are exhausted, and continued resistance appears futile.\n\nVictory is within our grasp—now the terms must be settled."
wsv_firstbalkan.15.t:0 "The Balkan War Cannot Continue"
wsv_firstbalkan.15.d:0 "The situation in the Balkans has deteriorated sharply. The Balkan League is faltering, with some members nearing collapse as the fighting drags on. If the conflict continues unchecked, it risks destabilizing the entire region.\n\nTo preserve the European balance and prevent a wider crisis, we may need to step in and press both sides to end the war."
wsv_firstbalkan.16.t:0 "A Stalemate in the Balkans"
wsv_firstbalkan.16.d:0 "The war between the Ottoman Empire and the Balkan League has settled into an exhausting stalemate. Months have passed with no decisive breakthrough, and the continued fighting threatens to inflame regional tensions.\n\nAs one of the Great Powers, it falls to us to help impose order. Intervention may now be necessary to force a ceasefire before matters escalate further."
wsv_firstbalkan.17.t:0 "Great Powers Demand a Ceasefire"
wsv_firstbalkan.17.d:0 "Diplomatic representatives of the Great Powers have jointly informed us that they will no longer tolerate continued fighting in the Balkans. Citing regional instability and the risk of escalation, they have issued a formal demand for an immediate halt to hostilities.\n\nBoth sides are expected to comply."
wsv_firstbalkan.18.t:0 "Ceasefire Declared in the First Balkan War"
wsv_firstbalkan.18.d:0 "After months of brutal fighting, the First Balkan War has been brought to a halt. Under pressure from the Great Powers, both the Ottoman Empire and the Balkan League have agreed to a ceasefire.\n\nControl of Ottoman-held territories will be determined by the positions of the armies at the front, while diplomats prepare to negotiate the final settlement. Europe watches closely, aware that the outcome may redraw the borders of the region."
wsv_firstbalkan.20.t:0 "Balkan League Triumphs in the First Balkan War"
wsv_firstbalkan.20.d:0 "The First Balkan War has ended with a decisive victory for the Balkan League. Ottoman forces have been driven out of Europe, and the victorious allies are now in possession of vast new territories. Celebrations erupt across Serbia, Greece, and Bulgaria as their banners rise over long-contested lands.\n\n Yet beneath the jubilation lies a simmering unease. Rivalries over Macedonia and other contested regions have already sparked fierce disagreements within the League, which has promptly collapsed. Though the Ottomans have been expelled, the future of the Balkans is anything but settled."
wsv_firstbalkan.20.a:0 "A new map of the Balkans emerges."
wsv_firstbalkan.21.t:0 "Ottoman Empire Triumphs in the First Balkan War"
wsv_firstbalkan.21.d:0 "Against all expectations, Ottoman armies have managed to repel the armies of the Balkan League, and eventually drove deep into Serbia and Bulgaria.  Alarmed by the sudden collapse of the Balkan League and determined to prevent a total Ottoman restoration in Europe, the Great Powers intervened to force an immediate ceasefire. \n\nUnder the imposed settlement, the Balkan states must accept non-aggression agreements with the Ottoman Empire and shoulder heavy indemnities. Yet, though the Sultan’s armies were halted by diplomacy rather than defeat, Constantinople celebrates a stunning reversal of fortune."
wsv_firstbalkan.21.a:0 "A dramatic turn of the war"
wsv_firstbalkan.22.t:0 "Stalemate in the First Balkan War"
wsv_firstbalkan.22.d:0 "After months of brutal fighting in the Balkans, the Great Powers have intervened to impose a ceasefire and prevent further bloodshed. The Balkan armies achieved notable gains, yet not to the were not able to fully expel the Ottomans from Europe.
\nUnder the enforced settlement, the Balkan League secures limited territorial concessions, while Albania is to be established as an independent principality under international supervision. Though the guns have fallen silent, few in the region are satisfied—as rivalries are merely postponed, not resolved."
wsv_firstbalkan.22.a:0 "A fragile peace descends on the Balkans"
wsv_firstbalkan.25.t:0 "Advance into Albania"
wsv_firstbalkan.25.d:0 "Balkan League forces have pushed the Ottomans out of Albania. In the wake of their retreat, our units have moved in alongside our allies to secure key positions across the region.\n\nThis foothold marks an important step in shaping the postwar settlement."
wsv_firstbalkan.25.a:0 "Secure the region"
wsv_firstbalkan.26.t:0 "Serbia Occupies Albanian Territory"
wsv_firstbalkan.26.d:0 "Reports from the Balkans confirm that Serbia has expanded its advance into Albania amid the ongoing war with the Ottomans. This development is deeply concerning to us.  Allowing Belgrade to establish itself on the shoreline risks empowering Serbian ambitions and emboldening pan-Slavic agitation within our own borders. Swift diplomatic action may be required before the situation becomes irreversible."
wsv_firstbalkan.26.a:0 "Send a warning to Belgrade"
wsv_firstbalkan.27.t:0 "Austria-Hungary Issues Warning"
wsv_firstbalkan.27.d:0 "A stern communiqué has arrived from Vienna. Austria-Hungary warns us that our occupation of Albanian territory will not be tolerated and urges an immediate halt to our advance. Though not yet a formal ultimatum, the message makes clear that the Habsburg monarchy will oppose any attempt by Serbia to gain a permanent foothold on the Adriatic coast."
wsv_firstbalkan.27.a:0 "We will not be intimidated"
wsv_firstbalkan.28.t:0 "Austria-Hungary Acts Over Albania"
wsv_firstbalkan.28.d:0 "Diplomatic cables from Vienna confirm that Austria-Hungary has issued a warning to Serbia over its occupation of Albanian territory. Officially, Vienna claims it is acting to preserve stability in the Balkans. Unofficially, many believe the Habsburgs are far more concerned with limiting Serbian strength than with the fate of Albania itself."
wsv_firstbalkan.28.a:0 "Make a public statement supporting our ally"
wsv_firstbalkan.29.t:0 "Tensions Rise Over Albania"
wsv_firstbalkan.29.d:0 "The Serbian occupation of northern Albania and Austria-Hungary’s subsequent warning to Belgrade have triggered widespread alarm across Europe. In the chancelleries of the Great Powers, diplomats fear the situation may ignite a broader conflict should either Serbia or Austria-Hungary refuse to back down.\n\nThough open war has not yet erupted, the crisis has underscored the fragility of peace in the Balkans and the explosive rivalries that lie just beneath the surface. Many now worry that the next misstep—however small—could plunge the continent into catastrophe."
wsv_firstbalkan.29.a:0 "A dangerous moment"
wsv_firstbalkan.40.t:0 "The Albanian Question Reopens"
wsv_firstbalkan.40.d:0 "With the First Balkan War drawing to its conclusion, the unresolved Albanian Question has once again come to the fore. Only weeks ago, Europe stood on edge as the Balkan armies advanced toward the Adriatic and conflicts of interest over Albania surfaced. Now, as borders settle, we must decide whether to press our ally’s ambitions—or whether to urge restaint."
wsv_firstbalkan.40.a:0 "Counsel restraint; Albania is not worth a European war"
wsv_firstbalkan.40.b:0 "Encourage firmness; we will not back down"
wsv_firstbalkan.41.t:0 "Advice for Restraint from [From.GetName]"
wsv_firstbalkan.41.d:0 "Our ally [From.GetName] has communicated its desire that we act with caution regarding the Albanian Question. They warn that escalation could plunge the Great Powers into confrontation."
wsv_firstbalkan.41.a:0 "We will take that into consideration"
wsv_firstbalkan.42.t:0 "[From.GetName] Urges a Firm Stance"
wsv_firstbalkan.42.d:0 "Our ally [From.GetName] has urged us to stand firm over the Albanian Question, signalling support even if tensions with rival powers rise as a result."
wsv_firstbalkan.42.a:0 "Then we shall not yield"
wsv_firstbalkan.43.t:0 "Russia and the Albanian Question"
wsv_firstbalkan.43.d:0 "As the crisis over Albania resurfaces, Serbia once again looks to us for guidance, while Austria watches the Adriatic with cold determination. The Great Powers are on edge, but our allies have made their stances clear. We must now decide whether to encourage Serbia forward or counsel moderation."
wsv_firstbalkan.43.a:0 "Support Serbian ambitions—Austria must be challenged"
wsv_firstbalkan.43.b:0 "Order Serbia to back down"
wsv_firstbalkan.44.t:0 "Russia Supports Our Claims"
wsv_firstbalkan.44.d:0 "Russia has signaled its backing for our ambitions in Albania. With such support, we may choose to press our claims—though doing so risks confrontation with Austria-Hungary."
wsv_firstbalkan.44.a:0 "We will hold onto Albania"
wsv_firstbalkan.44.b:0 "We must avoid war with Austria-Hungary"
wsv_firstbalkan.45.t:0 "Russia Advises Restraint"
wsv_firstbalkan.45.d:0 "Russia has urged caution, warning that Albania is not worth provoking Austria-Hungary. Dropping our claims may preserve peace—but at the cost of our strategic ambitions."
wsv_firstbalkan.45.a:0 "Very well—we will abandon our claims"
wsv_firstbalkan.46.t:0 "Serbia Backs Down from Albania"
wsv_firstbalkan.46.d:0 "Serbia has formally withdrawn its claims to Albania. The tensions that recently threatened to engulf Europe have eased, and the crisis appears to be subsiding."
wsv_firstbalkan.46.a:0 "A satisfactory outcome"
wsv_firstbalkan.47.t:0 "Serbia Refuses to Yield in Albania"
wsv_firstbalkan.47.d:0 "Despite mounting diplomatic pressure, Serbia has resolved to hold onto its claims in Albania. This defiance threatens our influence in the western Balkans and may force us to consider an ultimatum."
wsv_firstbalkan.47.a:0 "Prepare an ultimatum."
wsv_firstbalkan.47.b:0 "This is not the time to risk war."
may_lead_to_a_diplomatic_crisis_tt:0 "§RThis may lead to a diplomatic crisis between the Great Powers.§!"
may_lead_to_war_with_auh_tt:0 "§RPressing the Albanian claim may lead to war with Austria-Hungary.§!"
AUH_prepares_ultimatum_over_albania_tt:0 "§YAustria-Hungary will begin preparations for an ultimatum to Serbia.§!"
wsv_firstbalkan.48.t:0 "Albania Declares Independence"
wsv_firstbalkan.48.d:0 "Following intense pressure from the Great Powers, a new Albanian state has been created in the lands once claimed by Serbia, Montenegro, and Greece. \nThough the League had sought to annex these territories, diplomacy has forced their release Austria-Hungary and Italy now guarantee the security of the fledgling nation."
wsv_firstbalkan.48.a:0 "There is little we can do"
wsv_firstbalkan.50.t:0 "Drafting an Ultimatum"
wsv_firstbalkan.50.d:0 "Serbia has refused to relinquish the Albanian territories it occupied during the First Balkan War, despite repeated warnings. Vienna now prepares a final ultimatum, confident that Belgrade will defy it—but determined to assert its authority in the Balkans"
wsv_firstbalkan.50.a:0 "The note will be delivered"
wsv_firstbalkan.51.t:0 "The Albanian Crisis"
wsv_firstbalkan.51.d:0 "Tensions that simmered throughout the First Balkan War have erupted into full crisis. During the peace negotiations, France and Russia repeatedly assured Serbia that they would support its claims along the Adriatic, despite Austria-Hungary’s growing alarm and warnings that a Serbian coastline was unacceptable.\n\nNow, with the treaty signed and Serbia still holding Albanian territory, Vienna has issued a stark ultimatum--withdraw at once, or face armed intervention. Few in Europe believe Belgrade will yield—and fewer still doubt that any misstep could plunge the continent into a wider war."
wsv_firstbalkan.51.a:0 "Europe inches towards war"
austria_ultimatum_over_albania:0 "Austria Has Issued Ultimatum Over Albania"
wsv_firstbalkan.52.t:0 "Britain Faces a Choice"
wsv_firstbalkan.52.d:0 "Austria-Hungary has issued its ultimatum, and Serbia shows no sign of yielding. France and Russia stand firmly behind Belgrade. London must now decide whether to uphold solidarity with its partners—or quietly step back from a crisis that threatens to ignite Europe"
wsv_firstbalkan.52.a:0 "We stand with France and Russia"
wsv_firstbalkan.52.b:0 "We will not court disaster over Albania"
wsv_firstbalkan.53.t:0 "Britain Stands Firm"
wsv_firstbalkan.53.d:0 "Britain has confirmed its support for France and Russia, signaling unity among the Great Powers opposed to Austria-Hungary’s pressure on Serbia. The diplomatic front now appears solid as the crisis deepens"
wsv_firstbalkan.53.a:0 "A resolute stance"
wsv_firstbalkan.54.t:0 "Britain Steps Back"
wsv_firstbalkan.54.d:0 "Britain has chosen not to support France and Russia in the Albanian dispute, weakening the diplomatic front behind Serbia. The Entente now faces Vienna with one of its pillars absent"
wsv_firstbalkan.54.a:0 "A disappointing hesitation"
wsv_firstbalkan.55.t:0 "Austria-Hungary Demands Withdrawal"
wsv_firstbalkan.55.d:0 "Vienna has delivered its ultimatum. Despite Franco-Russian assurances, the decision rests with Belgrade alone--abandon Albania, or risk a clash with the Habsburg Empire. The fate of the crisis now lies in Serbia’s hands"
wsv_firstbalkan.55.a:0 "We will not yield"
wsv_firstbalkan.55.b:0 "We must back down"
wsv_firstbalkan.56.t:0 "Serbia Withdraws from Albania"
wsv_firstbalkan.56.d:0 "Despite earlier assurances from France and Russia, Serbia has unexpectedly agreed to comply with Austria-Hungary’s ultimatum and evacuate Albania. Belgrade’s decision has shocked observers across Europe, where most believed the Great Powers’ commitments made a confrontation inevitable. Instead, Serbia has stepped back from the brink—though at the cost of considerable prestige and deep resentment at home."
wsv_firstbalkan.56.a:0 "A close call for Europe"
wsv_firstbalkan.56.b:0 "A bitter retreat"
wsv_firstbalkan.57.t:0 "Serbia Defies Austria-Hungary"
wsv_firstbalkan.57.d:0 "Serbia has formally rejected Austria-Hungary’s ultimatum, declaring its intention to retain control of Albania. With France and Russia already committed to supporting Belgrade, the refusal leaves Vienna little option but to prepare for war. Diplomats scramble, but few hold out hope—Europe stands on the edge, and the guns may speak before the ink on the maps has dried."
wsv_firstbalkan.57.a:0 "The Balkans ignite once more"
wsv_firstbalkan.58.t:0 "The Hour of War"
wsv_firstbalkan.58.d:0 "Serbia has rejected the ultimatum, and the path to conflict appears unavoidable. Vienna must now enforce its demands by force, aware that doing so may draw in the Great Powers and plunge the continent into war"
wsv_firstbalkan.58.a:0 "When the pen fails the sword must be drawn"

## Second Balkan War
wsv_secondbalkan.1.t:0 "The Question of Northern Macedonia"
wsv_secondbalkan.1.d:0 "The Treaty of London has left us dissatisfied. Serbia continues to occupy the northern Macedonian districts that were, by prior agreement, to be transferred to us following victory.\n\nOur government is united--Serbia must be reminded of its obligations and pressed to fulfill the accord."
wsv_secondbalkan.1.a:0 "Send our demand to Belgrade"
wsv_secondbalkan.2.t:0 "Bulgaria Demands Northern Macedonia"
wsv_secondbalkan.2.d:0 "Sofia has formally invoked the pre-war agreement concerning Macedonia and now demands that we transfer the northern districts to Bulgarian control.\n\nMany in the government object, arguing that circumstances have changed and that Serbia fought hard for these territories. Yet a refusal risks shattering relations with our former ally."
wsv_secondbalkan.2.a:0 "Agree to the transfer"
wsv_secondbalkan.2.b:0 "We refuse their demand"
wsv_secondbalkan.3.t:0 "Serbia Accepts Our Claim"
wsv_secondbalkan.3.d:0 "Belgrade has notified us that it will honor the pre-war agreement and transfer administration of the northern Macedonian districts. Although Serbian public opinion appears hostile, their government has nevertheless yielded.\n\nThis is a significant diplomatic success for Bulgaria."
wsv_secondbalkan.3.a:0 "Excellent"
wsv_secondbalkan.4.t:0 "Serbia Rejects Our Demand"
wsv_secondbalkan.4.d:0 "Serbia has outright refused to cede the northern Macedonian territories. Their cabinet insists the agreement is void due to wartime developments and Serbian sacrifices.\n\nThis refusal has caused outrage across Bulgaria. Many now argue that the matter cannot remain a diplomatic dispute alone."
wsv_secondbalkan.4.a:0 "Prepare for conflict"
likely_war_with_serbia_and_greece_tt:0 "§RWill lead to war with Serbia and possibly Greece.§!"
wsv_secondbalkan.4.b:0 "We will drop the issue… for now"
wsv_secondbalkan.5.t:0 "Bulgaria Breaks Off Relations"
wsv_secondbalkan.5.d:0 "Following our refusal to cede northern Macedonia, Bulgaria has withdrawn its ambassadors and suspended formal diplomatic contact. Bulgarian newspapers openly discuss mobilization, and their officers have been seen inspecting the frontier.\n\nA clash between our two states may now be inevitable."
wsv_secondbalkan.5.a:0 "Tensions rise again"
wsv_secondbalkan.6.t:0 "A Defensive Pact with Greece?"
wsv_secondbalkan.6.d:0 "With Bulgaria openly preparing for conflict over Macedonia, our diplomats warn that Serbia risks standing alone if fighting breaks out.\n\nGreece, likewise wary of Bulgarian ambitions, may be receptive to a mutual defensive arrangement. Such a pact could secure our southern flank and deter Sofia from rash action."
wsv_secondbalkan.6.a:0 "Approach Greece about an alliance"
wsv_secondbalkan.7.t:0 "Serbia Proposes a Defensive Alliance"
wsv_secondbalkan.7.d:0 "Belgrade has approached us with a proposal for a mutual defensive pact. Concerns over Bulgarian intentions have strained regional stability, and Serbia now seeks assurances that it will not face Sofia alone.\n\nAccepting their offer would bind us more closely together—but also risks drawing Greece into the conflict Serbia expects."
wsv_secondbalkan.7.a:0 "Accept their proposal"
wsv_secondbalkan.7.b:0 "We must decline"
wsv_secondbalkan.8.t:0 "Greece Accepts Our Offer"
wsv_secondbalkan.8.d:0 "Athens has agreed to a defensive pact. Greek and Serbian interests now align formally, and the two nations pledge to support one another should Bulgaria resort to arms.\n\nWith this alliance secured, Serbia stands stronger and more confident in the face of Bulgarian pressure."
wsv_secondbalkan.8.a:0 "A welcome partnership"
wsv_secondbalkan.9.t:0 "Greece Declines Our Offer"
wsv_secondbalkan.9.d:0 "Athens has politely rejected our proposed defensive pact. While acknowledging shared concerns about Bulgaria, the Greek government insists the moment is not right for binding commitments.\n\nThis refusal leaves Serbia more exposed as tensions continue to rise."
wsv_secondbalkan.9.a:0 "A disappointing refusal"
wsv_secondbalkan.10.t:0 "Serbia Cedes Northern Macedonia"
wsv_secondbalkan.10.d:0 "In a surprising turn of events, Serbia has agreed to relinquish Northern Macedonia, transferring the territory to Bulgarian control without further dispute. Whether this reflects diplomatic pressure, internal calculation, or simple exhaustion, Sofia now stands strengthened—and curious as to what prompted Belgrade’s sudden change of heart."
wsv_secondbalkan.10.a:0 "An unexpected but welcome concession"
wsv_secondbalkan.15.t:0 "The Second Balkan War"
wsv_secondbalkan.15.d:0 "Tensions simmering since the end of the First Balkan War have finally boiled over. Bulgaria, deeply dissatisfied with the territorial settlement and furious at Serbia and Greece for refusing to cede their promised gains in Macedonia, has launched a sudden attack against Serbian positions. What Sofia did not anticipate, however, was the existence of a secret Greco-Serbian defensive agreement prepared precisely for this moment.\n\nWith fighting now erupting across the region, the fragile Balkan balance threatens to collapse entirely."
wsv_secondbalkan.15.a:0 "Here we go again"
wsv_secondbalkan.16.t:0 "Romanian Intervention"
wsv_secondbalkan.16.d:0 "Dobruja has remained a divided land since the Congress of Berlin, its population split among Romanians, Bulgarians, and Turks. Now, with Bulgaria embroiled in war on multiple fronts, many in Bucharest argue that the moment has come to settle the Dobruja question once and for all.\n\nWith no Bulgarian forces free to oppose them, Romania could act with near impunity."
wsv_secondbalkan.16.a:0 "Move against Bulgaria"
wsv_secondbalkan.16.b:0 "Let it go"
wsv_secondbalkan.17.t:0 "Turkish Intervention"
wsv_secondbalkan.17.d:0 "Edirne, the ancient Ottoman stronghold, was wrested away by the Balkan League during the last war. Now that Bulgaria has turned against its former allies, the Sublime Porte sees a rare opportunity--with Sofia distracted and exhausted, the empire might reclaim at least some of its lost Thracian territories.\n\nWhether to strike now is the question."
wsv_secondbalkan.17.a:0 "Move against Bulgaria"
wsv_secondbalkan.17.b:0 "Let it go"
wsv_secondbalkan.18.t:0 "Romania Joins the Second Balkan War"
wsv_secondbalkan.18.d:0 "Romania has entered the conflict, seizing the chance to secure full control over Dobruja while Bulgaria remains overstretched. With the region’s mixed Romanian, Bulgarian, and Turkish population offering little clarity, Bucharest argues that only decisive action can resolve the dispute.\n\nBulgaria now finds itself pressed on yet another front."
wsv_secondbalkan.18.a:0 "Bulgaria is in a tough spot"
wsv_secondbalkan.19.t:0 "Ottoman Empire Joins the Second Balkan War"
wsv_secondbalkan.19.d:0 "The Ottoman Empire has taken advantage of the chaos and declared its intention to recover lost Thracian territories. With Bulgarian forces already locked in combat against Serbia and Greece—and now facing Romanian incursions as well—the return of the Ottomans adds yet another blow.\n\nFor Bulgaria, the situation grows increasingly desperate."
wsv_secondbalkan.19.a:0 "Bulgaria is in a tough spot"


# wsv_secondbalkan.11.t:0 "Bulgaria Surrenders"
# wsv_secondbalkan.11.d:0 "Recognizing the inevitable, Bulgaria has admitted defeat in the Second Balkan War, and sues for peace."
# wsv_secondbalkan.11.a:0 "They were fools to try us"
# wsv_secondbalkan.12.t:0 "Bulgarian Defeat in Second Balkan War"
# wsv_secondbalkan.12.d:0 "Beset by enemies on all sides, Bulgaria has been forced to admit defeat in the Second Balkan War.  As punishment, they have been stripped of territory by Serbia, Greece, Romania, and the Ottomans."
# wsv_secondbalkan.12.a:0 "A catastrophe for them"
# wsv_secondbalkan.13.t:0 "Anti-Bulgarian Coalition Surrenders"
# wsv_secondbalkan.13.d:0 "The Anti-Bulgarian Coalition has admitted defeat in the war, and wishes to sue for peace."
# wsv_secondbalkan.13.a:0 "Victory at last"
# wsv_secondbalkan.14.t:0 "Bulgarian Victory in Second Balkan War"
# wsv_secondbalkan.14.d:0 "Against all odds Bulgaria has emerged victorious in the Second Balkan War, besting Serbia, Greece, Romania, and the Ottomans. Without doubt they are the Prussia of the Balkans.  The Bulgarian Golden Age has begun."
# wsv_secondbalkan.14.a:0 "A hegemon is born"


## Carribean Powderkeg Events
wsv_carib.1.t:0 "Civil War in Nicaragua"
wsv_carib.1.d:0 "Although the conflict between the Liberals and Conservatives in Nicaragua has been going on for some time, the violence has recently escalated with the revolt of General Mena.  Backed by a large portion of the Liberals, Mena and his forces have siezed the capitol of Nicaragua--Managua, driving the Conservatives into the countryside.  However the Conservatives are far from beaten, and it seems the violence will continue into the foreseable future."
wsv_carib.1.a:0 "This might be useful..."
enables_nic_intervention_tt:0 "Unlocks §YIntervention in Nicaragua§! Decision."
wsv_carib.1.b:0 "Interesting"
nic_civil_war:0 "Nicaraguan Civil War"
wsv_carib.2.t:0 "Confederate Marines Land in Nicaragua"
wsv_carib.2.d:0 "We have recieved notice that the Confederacy has landed marines in the Nicaraguan capital of Managua, under the pretext of needing to safeguard Confederate business interests and citizens in the region.  Given the geostrategic importance of Nicaragua, allowing this presence to go unchallenged may enbolden the Confederates to stay in the country indefinitely."
wsv_carib.2.a:0 "Blockade Managua"
may_lead_to_war_with_csa_tt:0 "§RMay lead to war with the Confederate States.§!"
wsv_carib.2.b:0 "It is not worth fighting over"
wsv_carib.3.t:0 "U.S. Blockades Managua"
wsv_carib.3.d:0 "Earlier this week, Confederate Marines landed in the capitol of the Central American country of Nicaragua, under the pretext of safeguarding Confederate businesses from the ongoing civil strife in the country. Although Nicaragua is a rather small and poor country, it sits on one of the two sites for a viable Trans-American canal, and thus holds significant geostrategic importance.  The United States has thus seen the Confederate occupation as a threat, and in response has sent out a squadron in its Pacific Fleet to blockade the capital.  With its troops cut off from supply and surronded in a hostile country, the Confederacy now faces a dire situation-- attempt diplomacy, or save their troops through force?"
wsv_carib.3.a:0 "Your move rebs"
wsv_carib.3.b:0 "This is like a repeat of Morocco..."
nic_crisis_decisions_available_tt:0 "§YNicaragua Crisis§! Decisions are now available."
nicaragua_crisis_threat_tt:0 "Nicaragua Crisis"
wsv_carib.3.c:0 "This is like a repeat of Morocco..."
wsv_carib.4.t:0 "Mediating the Crisis"
wsv_carib.4.d:0 "The Confederate States is proposing terms to resolve the ongoing crisis peacefully.  They request that we recognize Nicaragua as their protectorate, but promise us that no canal will be built without consulting us.  They furthermore promise to recognize Haiti as our protectorate and within our sphere of influence."
wsv_carib.4.a:0 "These terms are acceptable"
csa_recognize_us_in_haiti_tt:0 "The CSA will recognize Haiti as part of our sphere of influence."
wsv_carib.4.b:0 "We will never let them have Nicaragua"
negociate_for_germany_support_tt:0 "§RGermany will not support us as we did not negociate.§!"
will_lead_to_war_with_csa_tt:0 "§RWill lead to war with the Confederate States.§!"
wsv_carib.4.c:0 "Aren't you a little late?"
wsv_carib.5.t:0 "Nicaragua Crisis Resolution"
wsv_carib.5.d:0 "To the relief of everyone around the world, the United States and Confederacy have managed to come to a peaceful resolution over the crisis in Nicaragua.  Although the U.S. has ultimately recognized Nicaragua as a Confederate protectorate, the Confederacy has promised not to build a canal in the region without consulting the United States. Furthermore, Haiti has been recognized as a protectorate of the United States by the Confederacy. With the signing of the agreement, the United States has recalled its Pacific squadron, and the blockade of Managua--and the Nicaragua Crisis--has now ended."
wsv_carib.5.a:0 "Cooler heads prevailed"
wsv_carib.6.t:0 "United States Rejects Confederate Terms"
wsv_carib.6.d:0 "The United States has rejected Confederate attempts to negociate a peaceful solution to the crisis in Nicaragua.  Despite the Confederacy offering terms to recognize Haiti as a U.S. protectorate and to not consult a canal in Nicaragua without consulting the U.S., the United States remains intent on mantaining its blockade of Managua and forcing a surrender of the Confederate garrison.  This really only leaves the Confederacy with one choice..."
wsv_carib.6.a:0 "We wont accept their lousy terms"
wsv_carib.6.b:0 "They leave us no choice"
wsv_carib.6.c:0 "A war over Nicaragua?!"
wsv_carib.7.t:0 "Nicaragua Crisis Explodes"
wsv_carib.7.d:0 "Today, a Confederate naval relief force bound for Managua exchanged fire with American ships outside the Nicaraguan capital.  Although the battle was brief, two American destroyers were sunk, while one Confederate cruiser was badly damaged.  The bold Confederate raid did succeed in lifting the blockade, but it also effectively marks a state of war between the two North American countries."
wsv_carib.7.a:0 "How dare they!"
wsv_carib.7.b:0 "We had no choice"
wsv_carib.7.c:0 "I cant believe this" 
wsv_carib.8.t:0 "Clash With Confederate Navy"
wsv_carib.8.d:0 "The Confederate Navy has engaged the Pacific Fleet outside Managua in a short but fierce battle.  Although our navy preformed well, we were forced to pull back to regroup, effectively ending the blockade.  This brazen attack can only be responded to in one way."
wsv_carib.8.a:0 "A declaration of war"
wsv_carib.9.t:0 "Confederate Troops in Managua Capitulate"
wsv_carib.9.d:0 "Cut off from supplies and with no hope of relief, the Confederate garrison in Nicaragua has announced its surrender to the local Nicaraguan forces.  The news deals a crippling blow to the prestige of the Confederacy, which had hoped to establish itself as the regional power in the Caribbean, but now finds itself unable to operate under the watchful gaze of the United States.  It is unlikely there will be any future Confederate interventions in the region, given how disasterous this one went."
wsv_carib.9.a:0 "How could we let this happen"
wsv_carib.9.b:0 "How humiliating for them"
wsv_carib.10.t:0 "Confederate Occupation of Nicaragua"
wsv_carib.10.d:0 "After have landing marines in the capital of Nicaragua a few weeks back, the Confederacy today has announced the offical occupation of the country of Nicaragua.  Claiming the need to mantain stability and order in the volatile region, the Confederacy has now sent nearly a divison of troops to occupy the major ports and cities of the country.  The United States for its part failed to materialize any challenge to the Confederate moves, and now it is too late to take any action."
wsv_carib.10.a:0 "How could we let this happen"
wsv_carib.10.b:0 "A victory for the Confederacy"
wsv_carib.11.t:0 "Intervene in Nicaragua?"
wsv_carib.11.d:0 "The United States and Confederate States are locking in a crisis not unsimilar to the one over Morocco only a few years ago.  Although we would prefer not to get involve, our current treaty with the Confederates stipulates that we must come to their aid in the case of U.S. aggression..."
wsv_carib.11.a:0 "Give them full backing"
likely_war_with_usa_tt:0 "§RWill likely lead to war with the U.S.§!"
wsv_carib.11.b:0 "Back them, but demand they negociate first"
may_lead_to_war_with_usa_tt:0 "§RMay lead to war with the U.S.§!"
wsv_carib.11.c:0 "This isn't our concern"
csa_break_antiusa_defense_treaty_tt:0 "§RThe Confederate States will end their guarantee of Canada.§!"
wsv_carib.12.t:0 "British Backing in Nicaragua"
wsv_carib.12.d:0 "The British has promised to support us in Nicaragua, and give us a green light for any action we may take."
wsv_carib.12.a:0 "Excellent"
wsv_carib.13.t:0 "British Conditional Backing in Nicaragua"
wsv_carib.13.d:0 "Britain has come to our aid in Nicaragua, as per our treaty.  However, privately the British government has warned us that the British public will not support an aggressive colonial war, and that we must negociate with the U.S. if possible."
wsv_carib.13.a:0 "Fine"
wsv_carib.14.t:0 "Britain Fails to Support Us"
wsv_carib.14.d:0 "The British have refused to come to our aid in Nicaragua, violating the terms of our treaty with them.  We can no longer count on them as allies."
wsv_carib.14.a:0 "Cowards"
wsv_carib.15.t:0 "British Intervention in Nicaragua"
wsv_carib.15.d:0 "The British have stated their support for the Confederate States, and have sent a small battlefleet off the coast of Managua to assert their presence.  The stakes of crisis have now grown, and the local dispute may turn into a global conflagration."
wsv_carib.15.a:0 "I hate Great Power politics"
wsv_carib.16.t:0 "Intervene in Nicaragua?"
wsv_carib.16.d:0 "The British have backed the Confederate States in Nicaragua, putting the U.S. in a dire situation.  As per the terms of our treaty with the U.S., we should come to their aid in the event of British aggression."
wsv_carib.16.a:0 "Sure... for a price"
likely_war_with_england_tt:0 "§RWill likely lead to war with Britain.§!"
wsv_carib.16.b:0 "If we must, but they must negociate"
may_lead_to_war_with_england_tt:0 "§RMay lead to war with Britain.§!"
wsv_carib.16.c:0 "This is not our concern"
usa_break_americangerrman_pact_tt:0 "§RThe United States will end their defensive pact with us.§!"
wsv_carib.17.t:0 "German Backing in Nicaragua"
wsv_carib.17.d:0 "The Germans have informed us that they will support us in any action we take in Nicaragua, and will come to our aid if the British declare war.  However, they have made it known that, should the worst come to pass, they expect territorial compensation from British holdings in South America..."
wsv_carib.17.a:0 "Very well"
wsv_carib.18.t:0 "German Conditional Backing in Nicaragua"
wsv_carib.18.d:0 "The Germans have informed us that they will support us, in the event of a war with Great Britain.  However, they have also stated that they expect us to negociate, and may be unable to come to our aid if we do not."
wsv_carib.18.a:0 "I see then"
wsv_carib.19.t:0 "Germany Fails to Support Us"
wsv_carib.19.d:0 "The Germans have refused to come to our aid in Nicaragua against the British, violating the terms of our treaty with them.  We can no longer count on them as allies."
wsv_carib.19.a:0 "Cowards"
wsv_carib.20.t:0 "German Intervention in Nicaragua"
wsv_carib.20.d:0 "The Germans have stated their support for the United States, and have sent a small battlefleet off the coast of Managua to assert their presence.  The stakes of crisis have now grown, and threaten to turn the local dispute into a global conflagration."
wsv_carib.20.a:0 "I hate Great Power politics"
wsv_carib.21.t:0 "Haitian Instability"
wsv_carib.21.d:0 "Haiti has never been a particularly stable ally, but this past decade has seen the country rocked with political turmoil.  The current administration is now asking for a loan to help them shore up their grip on the country, as recent protests over corruption and quality of life have rocked the capital.  While it is rather annoying to sink even more money into them, failing to do so might have grave reprocussions in the long term."
wsv_carib.21.a:0 "Send them some aid I guess"
wsv_carib.21.b:0 "We have other things to deal with"
wsv_carib.22.t:0 "Haiti Collapses into Anarchy"
wsv_carib.22.d:0 "Due to our failure to support the Haitian government, several Haitian generals have risen up and overthrown the government.  The country has now descended into violence and the generals turn on each other.  Although Haiti was never a particularly useful ally to begin with, the collapse of the government in the country means we will be unable to use their ports for the forseeable future."
wsv_carib.22.a:0 "Unbelievable"
wsv_carib.23.t:0 "U.S. Ships Pull Out of Haiti"
wsv_carib.23.d:0 "Our reports indicate that U.S. naval ships have left Port-au-Prince, due to the recent explosion of violence in Haiti."
wsv_carib.23.a:0 "Interesting"
wsv_carib.25.t:0 "United States Intervenes in Haiti"
wsv_carib.25.d:0 "This morning, U.S. warships docked in the Haitian capital of Port-au-Prince, unloading several hundred Marines that soon secured the city.  The United States claims this move was at the request of the Haitian government, and stresses that it is not replacing the current Haitian government but merely bringing order and security to Haiti.  However outside observers predict that this move will not be taken lightly by the Confederate States, which has long regarded the America-Haitian partnership as a threat to its national security and interests in the Caribbean."
wsv_carib.25.a:0 "As is our right"
wsv_carib.25.b:0 "Well we did give them permission"
wsv_carib.25.c:0 "How dare they?!"
wsv_carib.25.e:0 "Won't this provoke the CSA?"
wsv_carib.26.t:0 "How to Respond to the Situation in Haiti?"
wsv_carib.26.d:0 "The occupation of Haiti by the United States is a highly aggressive provocation that cannot be ignored.  We should take action to assert our dominion over the Caribbean, less we be seen as weak by the rest of the world."
wsv_carib.26.a:0 "Send troops to occupy the D.R."
wsv_carib.26.b:0 "We have other things to worry about"
wsv_carib.27.t:0 "Confederate States Occupies the D.R."
wsv_carib.27.d:0 "In reponse to the American occupation of Haiti, the Confederate States has landed Marines in the Dominican capital of Santo Domingo, disbanding the government and proclaiming control of the small nation.  [CSA.GetLeader], the President of the CSA, justified this move by claiming that Haiti has become a U.S. military base on the doorstep of the Confederacy, and that the Confederate States had to secure its borders against this new threat."
wsv_carib.27.a:0 "Damn those Rebs!"
wsv_carib.27.b:0 "Take that Yanks"
wsv_carib.27.c:0 "An expected response"


#Franz Ferdiand
wsv_franzferdinand.1.t:0 "Franz Ferdinand is Dead!"
wsv_franzferdinand.1.d:0 "Franz Ferdinand, the esteemed Archduke of Austria-Este, and crown prince of the Austro-Hungarian Empire, has been killed!  Earlier this morning, the Archduke and his wife had been taking part in a motorcade through the streets of Sarajevo, when members of the Serbian terrorist group, the Black Hand, lobbed a bomb into the Archduke’s vehicle, killing him and his wife instantly.  Although the Serbian government officially denies involvement with assassins, the Austro-Hungarian Empire is holding Serbia responsible." 
wsv_franzferdinand.1.a:0 "We'll make those Serbs pay!"
wsv_franzferdinand.1.b:0 "Uh oh..."
franzferdiand_dead_tt:0 "Franz Ferdinand Assassinated"
wsv_franzferdinand.2.t:0 "Austria-Hungary Requests Backing"
wsv_franzferdinand.2.d:0 "After the murder of Franz Ferdinand in Sarajevo, the Austrian government is itching for revenge.  However, they wish to ensure they have our support in any future action they take."
wsv_franzferdinand.2.a:0 "Issue a Blank Checkque"
wsv_franzferdinand.3.t:0 "Germany Issues Blank Checkque"
wsv_franzferdinand.3.d:0 "Germany has promised their unconditional support in any action we might take against the Serbs.  All thats left to do now is to pull the lever."
wsv_franzferdinand.3.a:0 "We'lll make those Serbs pay"
wsv_franzferdinand.4.t:0 "Russia Issues Support for Serbia"
wsv_franzferdinand.4.d:0 "The Russian Empire has informed us that although they recognize the delicate nature of the situation, they will not tolerate any actions that infringe on the independence of Serbia."
wsv_franzferdinand.4.a:0 "All bluff"
wsv_franzferdinand.5.t:0 "Stand with Russia?"
wsv_franzferdinand.5.d:0 "The Russian Empire has formally pledged to defend Serbia in case of an Austro-Hungarian attack.  Although we technically are their ally and should pledge our support as well, the Balkans are a rather remote place.."
wsv_franzferdinand.5.a:0 "We will fulfill our duty"
wsv_franzferdinand.5.b:0 "The Balkans do not concern us"
wsv_franzferdinand.6.t:0 "France Stands with Us"
wsv_franzferdinand.6.d:0 "France has pledged its support in the event of a war with Austria-Hungary over Serbia.  This greatly strengthens our position."
wsv_franzferdinand.6.a:0 "Very good"
wsv_franzferdinand.6.b:0 "Cowards"
wsv_franzferdinand.7.t:0 "Franco-Russian Schism"
wsv_franzferdinand.7.d:0 "In a shocking turn of events, France and Russia have publicly severed military ties.  Due to the current crisis in the Balkans, Russia has pushed forward an aggressive military policy towards Germany and Austria-Hungary, demanding they refrain from attacking Serbia.  However France disagrees with this bold move, and does not see the Balkans as an important enough reason to go to war.  Unable to agree on a joint course of action, the two countries have decided to part ways."
wsv_franzferdinand.7.a:0 "A shocking turn of events"
wsv_franzferdinand.8.t:0 "Mobilization Across Europe"
wsv_franzferdinand.8.d:0 "As the crisis in the Balkans heats up, countries across Europe have begun mobilizing for war.  The Russian Empire has mobilized its armies to defend Serbia, which has prompted Germany and Austria Hungary to mobilize their forces to the east.  Not wanting to leave their allies in the lurch, France has now also mobilized its forces to the German border, and Great Britain is even considering intervention.  What was once a regional dispute is poised to turn into a general European conflagaration."
wsv_franzferdinand.8.a:0 "Some damn foolish thing in the Balkans"
news_of_european_mobilization:0 "Mobilization Has Begun in Europe"
wsv_franzferdinand.9.t:0 "The United States Begins to Mobilize"
wsv_franzferdinand.9.d:0 "Our intelligence reports indicate that the United States has begun mobilizing its military for war.  We believe this is due to the ongoing crisis in Europe, which may provide the Americans an opportunity to settle their greivances with us."
wsv_franzferdinand.9.a:0 "We best do the same"
wsv_franzferdinand.10.t:0 "Mobilization Across North America"
wsv_franzferdinand.10.d:0 "Spurred on by the worsening situation in Europe and eager to support their European allies, mobilizations have begun across North America.  First the United States, and then Confederate States and Canada have mobilized their forces to their borders, preparing for what seems to be a war in North America.  If the worst comes to past, it will be the most devastating conflict seen in North America to date."
wsv_franzferdinand.10.a:0 "And so the dominos fall"
wsv_franzferdinand.11.t:0 "Investigation Complete"
wsv_franzferdinand.11.d:0 "Having completed our investigation into the death of the Archduke, we have uncovered significant evidence indicating that Serbian officals were either directly involved or at least knew of the plot.  With their guilt clearly established, we must now move to punish the Serbs."
wsv_franzferdinand.11.a:0 "Issue the ultimatum"
wsv_franzferdinand.12.t:0 "Austria-Hungary Issues Ultimatum"
wsv_franzferdinand.12.d:0 "Following the assassination of the Archduke Franz Ferdinand, Austria-Hungary has issued an ultimatum to Serbia, demanding they comply with a list of stringent demands or else face war.  Experts do not expect the Serbians to agree to the demands, due to several of said demands that clearly violate Serbian sovereignty.  While the other powers have not made an offical statements so far, Russia for sure must be looking on with trepidation for its Slavic brethern.  If the situation is not resolved diplomatically, the next Great European War may indeed come from some damn foolish thing in the Balkans."
wsv_franzferdinand.12.a:0 "Choose wisely Serbs"
wsv_franzferdinand.12.b:0 "This is not looking good"
july_austria_ultimatum_tt:0 "Austria Issues Ultimatum"
wsv_franzferdinand.13.t:0 "Austria-Hungary Issues Ultimatum"
wsv_franzferdinand.13.d:0 "Citing the murder of the Archduke Franz Ferdinand as pretext, the Austrians have issued us a list of demands that essentially amount to becoming a protectorate of theirs.  Our options look grim."
wsv_franzferdinand.13.a:0 "Serbia will never bow"
july_serbia_defiant_tt:0 "§RWill lead to war with Austria-Hungary.§!"
wsv_franzferdinand.13.b:0 "We have no choice but to accept..."
july_serbia_submits_tt:0 "§RWe will become a puppet of Austria-Hungary.§!"
wsv_franzferdinand.14.t:0 "Serbia Rejects Ultimatum"
wsv_franzferdinand.14.d:0 "Serbia has rejected the Austro-Hungarian ultimatum stating that their demands are tantamount to a relinquishment of Serbian sovereignty.  The Austro-Hungarian on their part insist the terms were more than lenient, and that if Serbia will not agree, then they have no choice but to resort to war."
wsv_franzferdinand.14.a:0 "So they want war"
wsv_franzferdinand.14.b:0 "Let those Austrians come"
wsv_franzferdinand.14.c:0 "This is not looking good"
wsv_franzferdinand.15.t:0 "Serbia Accepts Ultimatum"
wsv_franzferdinand.15.d:0 "Under pressure from the Great Powers, Serbia has acceded to the Austro-Hungarian demands.  Experts say the agreement effectively turns Serbia into a protectorate of Austria-Hungary.  The Serbians on their part claim they had no choice, and accuse the international community of abandoning them to 'Habsburg Tyranny'."
wsv_franzferdinand.15.a:0 "They chose wisely"
wsv_franzferdinand.15.b:0 "We had no choice..."
wsv_franzferdinand.15.c:0 "The end of Serbian independence"
wsv_franzferdinand.16.t:0 "Serbia Rejects Our Ultimatum"
wsv_franzferdinand.16.d:0 "Despite the reasonable nature of our ultimatum, Serbia has decided to reject our ultimatum.  They leave us no choice but to resort to war."
wsv_franzferdinand.16.a:0 "When the pen fails, the sword must be drawn"


## NewsEvents
#  wsv_news.40.t:0 "The Republic of Quebec is Established"
#  wsv_news.40.d:0 "After taking Montreal and the City of Quebec, the United States has declared the creation of the 'République du Québec'-- a Francophone country following the provicial boundaries of Quebec.  Several members of the Central Powers, including Haiti, Germany, and Austria-Hungary, have already recognize the independence of this state.  The countries of the Entente on the otherhand, have unilaterially decried it as a U.S. puppet, and refused to recognized its independence.  In the newly formed Republic of Quebec attitudes are mixed, with the people there just hoping that the war will end soon."
#  wsv_news.40.a:0 "Vive la République du Québec"
#  wsv_news.40.b:0 "Quebec is Canadian!"
#  wsv_news.40.c:0 "An interesting turn of events"
wsv_news.100.t:0 "Fall of Richmond"
wsv_news.100.d:0 "After eliminating the last pockets of resistance, American troops troops have fully secured the Confederate capitol of Richmond.  The dream of the U.S. army, which it had failed to achieve in the War of Secession and Second Mexican War, has finally come true.  The loss of Richmond is expected to come as heavy blow to the Confederacy, who had often touted the city has unconquerable.  In the meantime the Confederate government has withdrawn to Atlanta, and where it is expected to make all efforts to reclaim Richmond."
wsv_news.100.a:0 "An significant turn of events"
wsv_news.101.t:0 "Fall of Nashville"
wsv_news.101.d:0 "After eliminating the last pockets of resistance, American troops troops have fully secured Nashville.  Confederate generals downplayed the event, insisting a counterattack would shortly reclaim the city.  American sources meanwhile are hailing it as a great victory, and it is expected to boost morale in the U.S."
wsv_news.101.a:0 "An interesting turn of events"
wsv_news.102.t:0 "Fall of Atlanta"
wsv_news.102.d:0 "After eliminating the last pockets of resistance, American troops troops have fully secured Atlanta.  A vital railhub linking the western and eastern portions of the South, the loss of such a critical city is expected to seriously hamper any future Confederate war efforts.  It will not be long before the South is cut in two, and after that the war for the Confederacy will be as good as lost."
wsv_news.102.a:0 "An significant turn of events"
wsv_news.103.t:0 "Fall of Washington D.C."
wsv_news.103.d:0 "After eliminating the last pockets of resistance, Confederate troops have fully secured Washington D.C.  The U.S. government, which had moved to Philadelphia since the start of the war, dismissed the capture of the city as insignificant.  Meanwhile, Confederate news outlets are hailing it as a great victory and an omen of good fortunes to come.  Either way, the Confederate flag now waves atop the old Capitol building of these once united states."
wsv_news.103.a:0 "An significant turn of events"
wsv_news.104.t:0 "Fall of Philadelphia"
wsv_news.104.d:0 "After eliminating the last pockets of resistance, Confederate troops have fully secured the U.S capitol of Philadelphia.  This marks a significant victory for the Confederate States, and U.S. morale is expected to plumet in the face of this defeat.  Although the American government remains defiant and insists on the final victory, international experts do not believe the United States can hold out much longer."
wsv_news.104.a:0 "An significant turn of events"
wsv_news.105.t:0 "Fall of New York"
wsv_news.105.d:0 "After eliminating the last pockets of resistance, Confederate troops have fully secured New York City.  U.S. generals downplayed the event, insisting a counterattack would shortly reclaim the city.  Confederate sources meanwhile are hailing it as a great victory, and it is expected to boost morale in the South."
wsv_news.105.a:0 "An interesting turn of events"
wsv_news.106.t:0 "Fall of Ottowa"
wsv_news.106.d:0 "After eliminating the last pockets of resistance, U.S. troops troops have fully secured Ottowa.  Canadian generals downplayed the event, insisting a counterattack would shortly reclaim the city.  American sources meanwhile are hailing it as a great victory, and it is expected to boost morale in the U.S."
wsv_news.106.a:0 "An interesting turn of events"
wsv_news.107.t:0 "Fall of Toronto"
wsv_news.107.d:0 "After eliminating the last pockets of resistance, American troops troops have fully secured Toronto.  Canadian generals downplayed the event, insisting a counterattack would shortly reclaim the city.  American sources meanwhile are hailing it as a great victory, and it is expected to boost morale in the U.S."
wsv_news.107.a:0 "An interesting turn of events"
wsv_news.108.t:0 "Fall of Winnipeg"
wsv_news.108.d:0 "After eliminating the last pockets of resistance, American troops troops have fully secured Winnipeg.  Canadian generals downplayed the event, insisting a counterattack would shortly reclaim the city.  American sources meanwhile are hailing it as a great victory, and it is expected to boost morale in the U.S."
wsv_news.108.a:0 "An interesting turn of events"


## Generic
wsv_generic.1.t:0 "[From.GetName] Requests Non-Aggression Pact"
wsv_generic.1.d:0 "Due to improved relations, [From.GetNameDef] have offered a non-aggression pact."
wsv_generic.1.a:0 "Peace in our time"
wsv_generic.1.b:0 "No, we will never trust them"
wsv_generic.2.t:0 "[From.GetName] Signs Pact"
wsv_generic.2.d:0 "[From.GetNameDef] has signed the Non-Aggression Pact"
wsv_generic.2.a:0 "Security at last"
wsv_generic.3.t:0 "[From.GetName] Rejects Pact"
wsv_generic.3.d:0 "[From.GetNameDef] has refused to sign the Non-Aggression Pact"
wsv_generic.3.a:0 "Some men just want to watch the world burn"
wsv_generic.4.t:0 "[From.GetName] Requests Military Aid"
wsv_generic.4.d:0 "[From.GetNameDef] has requested 5000 rifles from us in order to bolster their military forces, should we accept?"
wsv_generic.4.a:0 "We have some guns to spare"
wsv_generic.4.b:0 "We need everything we have"
wsv_generic.5.t:0 "[From.GetName] Gives Us Military Aid"
wsv_generic.5.d:0 "[From.GetNameDef] has granted our request and sent over 5000 rifles."
wsv_generic.5.a:0 "This will be very helpful"
wsv_generic.6.t:0 "[From.GetName] Refuses to Give Military Aid"
wsv_generic.6.d:0 "[From.GetNameDef] has denied our request of 5000 rifles, stating that they need them for their own armed forces."
wsv_generic.6.a:0 "They are cheap"
wsv_generic.7.t:0 "[From.GetName] Breaks Away!"
wsv_generic.7.d:0 "[From.GetNameDef] has broken away from under our control, declaring themselves an independent nation!"
wsv_generic.7.a:0 "Traitors!"
wsv_generic.7.b:0 "We will bring them back by force!"
wsv_generic.8.t:0 "First Chemical Gas Attack"
wsv_generic.8.d:0 "This morning, [From.GetNameDef] unleashed chlorine gas on the battlefield for the first time in history, in direct violation of the 1899 Hague Declaration Concerning Asphyxiating Gases and the 1907 Hague Convention on Land Warfare, which prohibited the use of "poison or poisoned weapons" in warfare.  The opposing army that faced this attack quickly broke and fled, as they had no protection against the gas.  Nevertheless some soldiers fell victim to the gas, and doctors who examined them reported that exposure to the gas could cause blindness, scarring of the lungs, and death by asphyxiation."  
wsv_generic.8.a:0 "All is fair in war..."
wsv_generic.8.b:0 "What other horrors await us in this war?"
wsv_generic.9.t:0 "Christmas Truce"
wsv_generic.9.d:0 "This morning, on Christmas day, in several areas across the war-torn battlefields of Europe and North America, soldiers from both sides ceased firing and came out of their trenches to greet one another and celebrate Christmas.  It is reported that soldiers even exchanged gifts with the enemy, and played soccer with them.  This spontaneous act of civility is truely marvelous, and a stark contrast to the brutal fighting that has been raging for the past few months."  
wsv_generic.9.a:0 "This will ruin the fighting spirit of our men!"
wsv_generic.9.b:0 "There is still some humanity in this war"
wsv_generic.10.t:0 "[From.GetName] Joins [From.GetFactionName]"
wsv_generic.10.d:0 "The leader of [From.GetNameDef], [From.GetLeader], has announced today that [From.GetNameDef] will be joining the [From.GetFactionName].  This has caused a flurry of concern amongst experts, who worry that the alliance is a sign of growing tensions in the world."
wsv_generic.10.a:0 "The network of alliances grows ever larger"


