l_english:
 # --- Destroyers ---
 ship_gw_hull_coastal_destroyer:0 "Coastal Destroyer"
 ship_gw_hull_coastal_destroyer_desc:0 "Small, short-ranged torpedo boat destroyers built to hunt down enemy torpedo boats. Poor sea-keeping limits these vessels to home waters."

 ship_gw_hull_light_1:0 "Early Destroyer"
 ship_gw_hull_light_1_desc:0 "A raised forecastle and improved hull form finally make destroyers seaworthy enough for sustained ocean operations, trading some speed for reliability at sea."
 
 ship_gw_hull_light_2:0 "Improved Destroyer"
 ship_gw_hull_light_2_desc:0 "Modern destroyers combining the speed of early designs with the seaworthiness of their immediate predecessors."
 
 ship_gw_hull_light_3:0 "Advanced Destroyer"
 ship_gw_hull_light_3_desc:0 "Wartime experience has driven rapid development of larger, faster hulls with room for additional armament and depth charge equipment."

 # --- Battleships ---
 ship_gw_predreadnought_hull:0 "Pre-Dreadnought Battleship"
 ship_gw_predreadnought_hull_desc:0 "Mixed-caliber battleships representing the standard heavy warship design before the all-big-gun revolution."
 
 ship_gw_hull_heavy_1:0 "Dreadnought Battleship"
 ship_gw_hull_heavy_1_desc:0 "A revolutionary all-big-gun battleship design, rendering all previous battleships obsolete overnight."
 
 ship_gw_hull_heavy_2:0 "Super-Dreadnought Battleship"
 ship_gw_hull_heavy_2_desc:0 "The next generation of capital ship, mounting heavier main guns arranged for a full broadside."
 
 ship_gw_hull_heavy_3:0 "Advanced Battleship"
 ship_gw_hull_heavy_3_desc:0 "The latest generation of capital ship design, with improved survivability, speed, and firepower."

 # --- Submarines ---
l_english:
 # --- Submarines ---
 ship_gw_hull_coastal_sub_1:0 "Coastal Submarine"
 ship_gw_hull_coastal_sub_1_desc:0 "Early submarines of limited range and questionable reliability, suited only for coastal defense."
 
 ship_gw_hull_fleet_sub_1:0 "Fleet Submarine I"
 ship_gw_hull_fleet_sub_1_desc:0 "The first genuinely sea-faring submarines, capable of operating alongside the fleet rather than being confined to home waters."
 
 ship_gw_hull_fleet_sub_2:0 "Fleet Submarine II"
 ship_gw_hull_fleet_sub_2_desc:0 "Wartime experience and improved engines allow these submarines to range much farther from home waters."
 
 ship_gw_hull_cruiser_sub_1:0 "Cruiser Submarine"
 ship_gw_hull_cruiser_sub_1_desc:0 "A large, long-ranged submarine fitted with additional weapon stations for extended independent operations far from friendly waters."

 # --- Carriers ---
 ship_gw_hull_carrier_1:0 "Experimental Carrier"
 ship_gw_hull_carrier_1_desc:0 "Early trials in shipborne naval aviation, using temporary flight platforms fitted to existing hulls."
 
 ship_gw_hull_carrier_2:0 "Aircraft Carrier"
 ship_gw_hull_carrier_2_desc:0 "The first purpose-built aircraft carriers, representing the cutting edge of naval aviation."