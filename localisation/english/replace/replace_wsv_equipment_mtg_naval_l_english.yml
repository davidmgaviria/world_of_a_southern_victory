 l_english:
 # --- Destroyers ---
 ship_gw_hull_coastal_destroyer:0 "Coastal Destroyer Hull"
 ship_gw_hull_coastal_destroyer_desc:0 "Small, short-ranged torpedo boat destroyers built to hunt down enemy torpedo boats. Poor sea-keeping limits these vessels to home waters."
 ship_gw_hull_light_1:0 "Early Destroyer Hull"
 ship_gw_hull_light_1_desc:0 "A raised forecastle and improved hull form finally make destroyers seaworthy enough for sustained ocean operations, trading some speed for reliability at sea."
 ship_gw_hull_light_2:0 "Improved Destroyer Hull"
 ship_gw_hull_light_2_desc:0 "Modern destroyers combining the speed of early designs with the seaworthiness of their immediate predecessors."
 ship_gw_hull_light_3:0 "Advanced Destroyer Hull"
 ship_gw_hull_light_3_desc:0 "Wartime experience has driven rapid development of larger, faster hulls with room for additional armament and depth charge equipment."
 # --- Heavy Ships (Battleships / Battlecruisers) ---
 ship_gw_predreadnought_hull:0 "Pre-Dreadnought Hull"
 ship_gw_predreadnought_hull_desc:0 "Mixed-caliber heavy ships representing the standard heavy warship design before the all-big-gun revolution."
 ship_gw_hull_heavy_1:0 "Early Heavy Ship Hull"
 ship_gw_hull_heavy_1_desc:0 "A revolutionary all-big-gun hull, built as either a battleship or a fast, lightly-armored battlecruiser, rendering all previous heavy ships obsolete overnight."
 ship_gw_hull_heavy_2:0 "Improved Heavy Ship Hull"
 ship_gw_hull_heavy_2_desc:0 "The next generation of heavy ship hull, mounting heavier main guns arranged for a full broadside, whether built up as a battleship or a battlecruiser."
 ship_gw_hull_heavy_3:0 "Advanced Heavy Ship Hull"
 ship_gw_hull_heavy_3_desc:0 "The latest generation of heavy ship hull, with improved survivability, speed, and firepower — and, for battlecruisers built on this hull, the hard lessons of a major fleet action finally reflected in their armor."
 # --- Cruisers ---
 ship_gw_hull_cruiser_1:0 "Early Cruiser Hull"
 ship_gw_hull_cruiser_1_desc:0 "A general-purpose cruiser dating from the twilight of the protected and armored cruiser era, before dedicated light cruisers came into their own."
 ship_gw_hull_cruiser_2:0 "Improved Cruiser Hull"
 ship_gw_hull_cruiser_2_desc:0 "A faster, more modern cruiser built for fleet scouting and screening duties."
 ship_gw_hull_cruiser_3:0 "Advanced Cruiser Hull"
 ship_gw_hull_cruiser_3_desc:0 "A wartime-refined cruiser, faster and better armed than its predecessors."
 # --- Submarines ---
 ship_gw_hull_coastal_sub_1:0 "Coastal Submarine Hull"
 ship_gw_hull_coastal_sub_1_desc:0 "Early submarines of limited range and questionable reliability, suited only for coastal defense."
 ship_gw_hull_fleet_sub_1:0 "Fleet Submarine Hull"
 ship_gw_hull_fleet_sub_1_desc:0 "The first genuinely sea-faring submarines, capable of operating alongside the fleet rather than being confined to home waters."
 ship_gw_hull_fleet_sub_2:0 "Improved Fleet Submarine Hull"
 ship_gw_hull_fleet_sub_2_desc:0 "Wartime experience and improved engines allow these submarines to range much farther from home waters."
 ship_gw_hull_cruiser_sub_1:0 "Cruiser Submarine Hull"
 ship_gw_hull_cruiser_sub_1_desc:0 "A large, long-ranged submarine fitted with additional weapon stations for extended independent operations far from friendly waters."
 # --- Carriers ---
 ship_gw_hull_carrier_1:0 "Converted Carrier Hull"
 ship_gw_hull_carrier_1_desc:0 "Early trials in shipborne naval aviation, using temporary flight platforms fitted to existing hulls."
 ship_gw_hull_carrier_2:0 "Aircraft Carrier Hull"
 ship_gw_hull_carrier_2_desc:0 "The first purpose-built aircraft carriers, representing the cutting edge of naval aviation."


############################ Modules ############################

 # --- Light Battery (Destroyer main guns) ---
 ship_gw_light_battery_1:0 "Quick-Firing Gun I (3in)"
 ship_gw_light_battery_1_desc:0 "A light, fast-firing gun suited to destroyer main armament."
 ship_gw_light_battery_2:0 "Quick-Firing Gun II (4in)"
 ship_gw_light_battery_2_desc:0 "An enlarged quick-firer giving destroyers a real punch against similarly-sized opponents."
 ship_gw_light_battery_3:0 "Quick-Firing Gun III (4.7in)"
 ship_gw_light_battery_3_desc:0 "Wartime experience has pushed destroyer armament to a heavier standard caliber."
 ship_gw_light_battery_4:0 "Quick-Firing Gun IV (4.7in)"
 ship_gw_light_battery_4_desc:0 "Refined shells and mountings extract further performance from the standard destroyer gun."
 # --- Light-Medium Battery (Light cruiser main guns) ---
 ship_gw_light_medium_battery_1:0 "Light Battery I (4in)"
 ship_gw_light_medium_battery_1_desc:0 "A modest gun typical of early scout cruisers before 6-inch guns became the light cruiser standard."
 ship_gw_light_medium_battery_2:0 "Light Battery II (6in)"
 ship_gw_light_medium_battery_2_desc:0 "The gun that becomes the standard light cruiser main armament for a generation."
 ship_gw_light_medium_battery_3:0 "Light Battery III (6in)"
 ship_gw_light_medium_battery_3_desc:0 "Refined propellants and shell design improve range and hitting power without changing caliber."
 ship_gw_light_medium_battery_4:0 "Light Battery IV (6in)"
 ship_gw_light_medium_battery_4_desc:0 "The latest refinement of the light cruiser's standard gun."
 # --- Medium Battery (Heavy cruiser main guns) ---
 ship_gw_medium_battery_1:0 "Medium Battery I (7.5in)"
 ship_gw_medium_battery_1_desc:0 "A heavy gun fitted to armored cruisers seeking to outgun lighter opponents."
 ship_gw_medium_battery_2:0 "Medium Battery II (8in)"
 ship_gw_medium_battery_2_desc:0 "A heavier-caliber gun increasingly favored for large cruisers built to fight, not just scout."
 ship_gw_medium_battery_3:0 "Medium Battery III (8in)"
 ship_gw_medium_battery_3_desc:0 "Refinements to shell and propellant technology improve on the standard heavy cruiser gun."
 # --- Secondaries (Capital ship secondary battery) ---
 ship_gw_secondaries_1:0 "Secondaries I (4in)"
 ship_gw_secondaries_1_desc:0 "A light gun fitted to capital ships for defense against torpedo boats and destroyers."
 ship_gw_secondaries_2:0 "Secondaries II (6in)"
 ship_gw_secondaries_2_desc:0 "A heavier secondary gun capable of dealing with larger, faster torpedo craft."
 ship_gw_secondaries_3:0 "Secondaries III (6in)"
 ship_gw_secondaries_3_desc:0 "A refined secondary battery incorporating the latest gunnery improvements."
 dp_ship_gw_secondaries_1:0 "Dual-Purpose Secondaries I (4in)"
 dp_ship_gw_secondaries_1_desc:0 "A secondary gun mounted and fused for use against both surface torpedo craft and aircraft."
 dp_ship_gw_secondaries_2:0 "Dual-Purpose Secondaries II (4in)"
 dp_ship_gw_secondaries_2_desc:0 "A refined dual-purpose mounting with improved elevation and fire control for anti-aircraft use."
 # --- Heavy Battery (Battleship main guns) ---
 ship_gw_heavy_battery_1:0 "Heavy Battery I (12in)"
 ship_gw_heavy_battery_1_desc:0 "The standard all-big-gun battleship armament of the dreadnought era."
 ship_gw_heavy_battery_2:0 "Heavy Battery II (12in)"
 ship_gw_heavy_battery_2_desc:0 "A refined mounting and shell design extract further performance from the standard dreadnought gun."
 ship_gw_heavy_battery_3:0 "Heavy Battery III (14in)"
 ship_gw_heavy_battery_3_desc:0 "A significant jump in caliber, mounted on the fastest and most powerful battleships afloat."
 ship_gw_heavy_battery_4:0 "Heavy Battery IV (16in)"
 ship_gw_heavy_battery_4_desc:0 "The next generation of heavy naval gun, though few ships will carry it into battle before the war's end."
 ship_gw_heavy_battery_5:0 "Heavy Battery V (18in)"
 ship_gw_heavy_battery_5_desc:0 "An experimental gun representing the theoretical limit of current battleship design; no navy has yet built a ship around it."
 # --- Twin Heavy Battery (Wing-mounted battleship guns) ---
 ship_gw_twin_heavy_battery_1:0 "Wing-mounted Heavy Batteries I (12in)"
 ship_gw_twin_heavy_battery_1_desc:0 "An older turret arrangement mounting guns on the ship's sides rather than the centerline, limiting the number of guns that can fire on a single broadside."
 ship_gw_twin_heavy_battery_2:0 "Wing-mounted Heavy Batteries II (12in)"
 ship_gw_twin_heavy_battery_2_desc:0 "A refined version of the outdated wing-turret arrangement."
 ship_gw_twin_heavy_battery_3:0 "Wing-mounted Heavy Batteries III (14in)"
 ship_gw_twin_heavy_battery_3_desc:0 "A powerful gun poorly served by an obsolete mounting scheme."
 # --- Submarine Deck Gun ---
 ship_gw_sub_deck_gun:0 "Submarine Deck Gun (4in)"
 ship_gw_sub_deck_gun_desc:0 "A gun allowing a surfaced submarine to sink unarmed or lightly-defended merchant ships without expending a torpedo."
 # --- Torpedoes (Surface Ships) ---
 ship_gw_torpedo_1:0 "Torpedo Launcher"
 ship_gw_torpedo_1_desc:0 "A single torpedo tube mount, the standard armament of the early torpedo boat and destroyer."
 ship_gw_torpedo_2:0 "Twin Torpedo Launcher"
 ship_gw_torpedo_2_desc:0 "Dual torpedo tube mounts allow a heavier spread to be fired in a single salvo, compensating for the low reliability of individual torpedoes."
 ship_gw_torpedo_3:0 "Triple Torpedo Launcher"
 ship_gw_torpedo_3_desc:0 "Triple torpedo tube mounts, doubling the salvo weight a destroyer can bring to bear in a single attack."
 # --- Torpedoes (Submarines) ---
 ship_gw_torpedo_sub_1:0 "Submarine Torpedo Tube"
 ship_gw_torpedo_sub_1_desc:0 "Bow-mounted torpedo tubes, the primary weapon of the early submarine, hampered by primitive periscope targeting."
 ship_gw_torpedo_sub_2:0 "Improved Submarine Torpedo Tube"
 ship_gw_torpedo_sub_2_desc:0 "Refined torpedoes and improved targeting methods driven by hard-won wartime experience."
 # --- Fire Control ---
 ship_gw_fire_control_system_1:0 "Dreyer Table"
 ship_gw_fire_control_system_1_desc:0 "Mechanical computing tables that integrate range, bearing, and rate of change to generate continuous firing solutions against maneuvering targets."
 ship_gw_fire_control_system_2:0 "Centralized Fire Control"
 ship_gw_fire_control_system_2_desc:0 "Director-controlled fire control, feeding range and bearing from a single elevated station to all main guns simultaneously for greater accuracy at extended range."
 # --- Mines ---
 ship_gw_mine_layer_1:0 "Naval Mine Layer"
 ship_gw_mine_layer_1_desc:0 "Equipment allowing a surface ship to deploy naval mines in enemy shipping lanes and coastal waters."
 ship_gw_mine_sweeper_1:0 "Minesweeping Gear"
 ship_gw_mine_sweeper_1_desc:0 "Towed sweeping gear capable of clearing a path through enemy minefields."
 ship_gw_mine_layer_sub:0 "Submarine Mine Layer"
 ship_gw_mine_layer_sub_desc:0 "Specialized equipment allowing a submarine to covertly deploy mines in waters too well-defended for surface minelayers to approach."
 # --- Sonar / Hydrophones ---
 ship_gw_sonar_1:0 "Basic Hydrophone"
 ship_gw_sonar_1_desc:0 "An early passive listening device used to detect submarines by the sound of their engines and propellers, though unable to give a clear bearing to the source."
 ship_gw_sonar_2:0 "Directional Hydrophone"
 ship_gw_sonar_2_desc:0 "An improved hydrophone array capable of giving a bearing toward a detected submarine, not merely confirming its presence."
 # --- Depth Charges ---
 ship_gw_depth_charge_1:0 "Depth Charge Rails"
 ship_gw_depth_charge_1_desc:0 "Depth charges rolled from racks at the stern, giving surface ships their first real means of attacking a submerged submarine directly astern."
 ship_gw_depth_charge_2:0 "Depth Charge Thrower"
 ship_gw_depth_charge_2_desc:0 "A propellant-fired thrower capable of flinging depth charges off to the sides, allowing a much wider pattern to be laid in a single pass."
 # --- Seaplane Tender ---
 ship_gw_seaplane_support:0 "Seaplane Tender"
 ship_gw_seaplane_support_desc:0 "Cranes and launching equipment allowing a capital ship to carry and deploy a spotter seaplane."
 # --- Carrier Equipment ---
 ship_gw_deck_space:0 "Deck Space"
 ship_gw_deck_space_desc:0 "Flight deck space allowing aircraft to be stowed, launched, and recovered at sea."
 # --- Engines: Light (Destroyer) ---
 light_gw_ship_engine_1:0 "Destroyer Engine I"
 light_gw_ship_engine_1_desc:0 "An early destroyer powerplant."
 light_gw_ship_engine_2:0 "Destroyer Engine II"
 light_gw_ship_engine_2_desc:0 "An improved destroyer powerplant, offering greater speed."
 light_gw_ship_engine_3:0 "Destroyer Engine III"
 light_gw_ship_engine_3_desc:0 "A refined destroyer powerplant, offering greater speed."
 # --- Engines: Cruiser ---
 cruiser_gw_ship_engine_1:0 "Cruiser Engine I"
 cruiser_gw_ship_engine_1_desc:0 "An early cruiser powerplant."
 cruiser_gw_ship_engine_2:0 "Cruiser Engine II"
 cruiser_gw_ship_engine_2_desc:0 "An improved cruiser powerplant, offering greater speed."
 cruiser_gw_ship_engine_3:0 "Cruiser Engine III"
 cruiser_gw_ship_engine_3_desc:0 "A refined cruiser powerplant, offering greater speed."
 # --- Engines: Heavy (Battleship) ---
 heavy_gw_ship_engine_0:0 "Pre-Dreadnought Engine"
 heavy_gw_ship_engine_0_desc:0 "A reciprocating steam powerplant typical of the pre-dreadnought era."
 heavy_gw_ship_engine_1:0 "Battleship Engine I"
 heavy_gw_ship_engine_1_desc:0 "A turbine powerplant offering greater speed and reliability than the reciprocating engines it replaces."
 heavy_gw_ship_engine_2:0 "Battleship Engine II"
 heavy_gw_ship_engine_2_desc:0 "An improved battleship powerplant, offering greater speed."
 heavy_gw_ship_engine_3:0 "Battleship Engine III"
 heavy_gw_ship_engine_3_desc:0 "A refined battleship powerplant, offering greater speed."
 heavy_gw_ship_engine_4:0 "Battleship Engine IV"
 heavy_gw_ship_engine_4_desc:0 "The latest battleship powerplant, offering greater speed."
 # --- Engines: Carrier ---
 carrier_gw_ship_engine_1:0 "Carrier Engine I"
 carrier_gw_ship_engine_1_desc:0 "An early carrier powerplant."
 carrier_gw_ship_engine_2:0 "Carrier Engine II"
 carrier_gw_ship_engine_2_desc:0 "An improved carrier powerplant, offering greater speed."
 # --- Engines: Submarine ---
 sub_gw_ship_engine_1:0 "Submarine Engine I"
 sub_gw_ship_engine_1_desc:0 "An early gasoline-powered submarine engine, prone to dangerous fumes and short range."
 sub_gw_ship_engine_2:0 "Submarine Engine II"
 sub_gw_ship_engine_2_desc:0 "A diesel-powered submarine engine, offering greater range and far safer operation than earlier gasoline engines."
 sub_gw_ship_engine_3:0 "Submarine Engine III"
 sub_gw_ship_engine_3_desc:0 "A refined diesel submarine engine, offering greater range and quieter running."
 sub_gw_ship_engine_4:0 "Submarine Engine IV"
 sub_gw_ship_engine_4_desc:0 "The latest diesel submarine engine, offering greater range and quieter running."
 # --- Armor: Battleship ---
 ship_gw_armor_bb_1:0 "Battleship Armor I (11in/280mm)"
 ship_gw_armor_bb_1_desc:0 "A conventional belt armor scheme typical of the dreadnought era, evolved only incrementally from pre-dreadnought practice."
 ship_gw_armor_bb_2:0 "Battleship Armor II (12in/305mm)"
 ship_gw_armor_bb_2_desc:0 "A modestly thickened belt, kept in step with the growing caliber of battleship main guns."
 ship_gw_armor_bb_3:0 "Battleship Armor III (13in/330mm)"
 ship_gw_armor_bb_3_desc:0 "A further-thickened belt incorporating sloped plating and improved deck protection, a response to the growing threat of plunging fire at long range."
 ship_gw_armor_bb_4:0 "Battleship Armor IV (15in/380mm)"
 ship_gw_armor_bb_4_desc:0 "Reinforced deck and turret-roof protection, informed by hard lessons on magazine vulnerability learned from major fleet actions."
 # --- Armor: Battlecruiser ---
 ship_gw_armor_bc_1:0 "Battlecruiser Armor I (6in/150mm)"
 ship_gw_armor_bc_1_desc:0 "A deliberately light armor scheme, trading protection for speed on the doctrine that a fast ship can dictate its own engagement range."
 ship_gw_armor_bc_2:0 "Battlecruiser Armor II (9in/230mm)"
 ship_gw_armor_bc_2_desc:0 "A modest increase in protection, though still built around the belief that speed, not armor, is a battlecruiser's true defense."
 ship_gw_armor_bc_3:0 "Battlecruiser Armor III (12in/300mm)"
 ship_gw_armor_bc_3_desc:0 "A substantial overhaul of turret, deck, and magazine protection, forced by the catastrophic loss of lightly-armored battlecruisers in a major fleet action. The doctrine of speed over armor has been abandoned."
 # --- Armor: Cruiser ---
 ship_gw_armor_cruiser_1:0 "Cruiser Armor I (4in/100mm)"
 ship_gw_armor_cruiser_1_desc:0 "A thin protective scheme typical of cruisers, which rely on speed rather than armor to survive."
 ship_gw_armor_cruiser_2:0 "Cruiser Armor II (6in/150mm)"
 ship_gw_armor_cruiser_2_desc:0 "A thicker belt for cruisers intended to fight rather than merely scout, at some cost to speed."

