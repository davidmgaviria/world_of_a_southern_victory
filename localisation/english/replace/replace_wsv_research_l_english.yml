 ## Electronics ##
electronic_mechanical_engineering:0 "Electrical Engineering"
electronic_mechanical_engineering_desc:0 "At the turn of the 20th century, advances in electrical engineering—ranging from power generation to early electronic components—laid the groundwork for modern industry, communications, and military technology."
communications1:0 "Early Communication Systems"
communications1_desc:0 "Field telephones, telegraphs, and basic wired signal networks began to improve battlefield coordination in the early 1900s, though their range and reliability were still limited."
communications2:0 "Improved Communication Systems"
communications2_desc:0 "Advances in switchboards, portable telephones, and emerging wireless sets greatly enhanced command and control, enabling faster and more flexible communication during modern warfare."
mechanical_computing1:0 "Mechanical Computing"
mechanical_computing1_desc:0 "Early mechanical calculators and analytical devices can perform basic arithmetic and table-based computations, improving accuracy in engineering, surveying, and artillery preparation."
mechanical_computing2:0 "Improved Mechanical Computing"
mechanical_computing2_desc:0 "Refined calculating machines and more advanced differential mechanisms greatly enhance the speed and precision of machine-assisted computation, supporting complex logistics, engineering, and ballistics work by the end of the war."
hoi4tgw_encryption:0 "Encryption I – Vigenère Disk"
hoi4tgw_encryption_desc:0 "Most pre-war ciphers rely on basic substitution methods and the centuries-old Vigenère Disk. All encoding is performed manually, making messages slow to prepare and vulnerable to patient cryptanalysts."
hoi4tgw_decryption:0 "Decryption I – Code Books"
hoi4tgw_decryption_desc:0 "Early decryption techniques depend on captured code books, frequency analysis, and manual pattern matching. Skilled cryptographers can break many early ciphers through persistent trial and error."
hoi4tgw_encryption2:0 "Encryption II – Mechanical Aids"
hoi4tgw_encryption2_desc:0 "By 1915, improved codebooks and simple mechanical tools assist in generating more reliable ciphers. These systems reduce human error and make intercepted messages harder to decode."
hoi4tgw_decryption2:0 "Decryption II – Tape Teletype System"
hoi4tgw_decryption2_desc:0 "The first electrical decryption devices, such as the Tape Teletype System, automate parts of the decoding process. Reels of predefined characters help reconstruct plaintext more efficiently than manual methods."
hoi4tgw_encryption3:0 "Encryption III – Advanced Code Systems"
hoi4tgw_encryption3_desc:0 "Late-war encryption introduces more complex codebooks, progressive cipher sequences, and early machine-assisted methods, greatly improving the security of military communications."
hoi4tgw_decryption3:0 "Decryption III – Analytical Machines"
hoi4tgw_decryption3_desc:0 "Improved mechanical analyzers and expanded cryptographic bureaus enable systematic attacks on even advanced ciphers, forming the foundation of modern cryptanalysis."
chemical_research:0 "Early Chemical Studies"
chemical_research_desc:0 "Foundational research into the nature of chemical substances, their reactions, and their practical applications began taking shape in the late 19th century, laying the groundwork for future industrial and military chemistry."
chemical_research2:0 "Modern Chemical Studies"
chemical_research2_desc:0 "By the early 20th century, advances in analytical methods and industrial chemistry enabled more precise control over chemical compounds, opening the door to both beneficial innovations and more destructive uses."
chemical_research3:0 "Chlorine & Phosgene Gas"
chemical_research3_desc:0 "Introduced in 1915, chlorine gas became the first widely used chemical agent in warfare. Its dense green cloud caused severe lung damage but was relatively easy to detect. Phosgene soon followed—far deadlier and capable of inflicting fatal pulmonary damage with far fewer warning signs."
chemical_research3b:0 "Haber–Bosch Process"
chemical_research3b_desc:0 "The Haber–Bosch Process allows atmospheric nitrogen to be fixed into ammonia on an industrial scale. Perfected during the war, it provides essential feedstock for fertilizers and explosives, ensuring a steady supply of nitrates even under blockade."
chemical_research4:0 "Mustard Gas"
chemical_research4_desc:0 "Developed later in the war, mustard gas—also known as LOST—caused blistering of the skin, eyes, and lungs. Its persistence on the battlefield made it more effective and feared than earlier choking agents."
chemical_research5:0 "Neurotoxins"
chemical_research5_desc:0 "By the 1930s and 1940s, breakthroughs in organophosphate chemistry produced nerve agents capable of disrupting the body's central nervous system, making them far deadlier than earlier chemical weapons."

## WW2
electronic_ww2:0 "Electronic Mechanical Engineering"
electronic_ww2_desc:0 "We live in an age when electrical machines can no longer only warm and light us, but help us think and communicate. Electronics will be key to military intelligence in the coming century."
radio2:0 "Improved Radio"
radio2_desc:0 "Adopting the inventions of amateur radio operators and extending the use of FM radio will reduce radio interference and allow us to find new uses for radio technology."
radio3:0 "Advanced Radio"
radio3_desc:0 "Adopting the inventions of amateur radio operators and extending the use of FM radio will reduce radio interference and allow us to find new uses for radio technology."
radar_tech:0 "Y-Range Tech"
radio_detection:0 "Radio Detection"
radio_detection_desc:0 "The development of Y-Range allows using radio waves to detect physical objects. Research is highly secretive, considering the impact these inventions could have on locating units."
decimetric_radar:0 "Decimetric Y-Range"
decimetric_radar_desc:0 "Many units rely on the element of surprise for their efficiency. Development of decimetric y-range allows us to deprive them of this advantage."
improved_decimetric_radar:0 "Improved Decimetric Y-Range"
improved_decimetric_radar_desc:0 "The use of y-range has already proven crucial, but our decimetric y-range sets are too few to ensure good coverage. Fitting more units with y-range will allow us to maximize our technological edge."
centimetric_radar:0 "Centimetric Y-Range"
centimetric_radar_desc:0 "New y-range operating in the microwave bands enable us to detect objects too small for previous y-ranges to pick up."
improved_centimetric_radar:0 "Improved Centimetric Y-Range"
improved_centimetric_radar_desc:0 "Introducing cutting-edge y-range techniques like monopulse y-ranges in key operations will allow for extreme tracking accuracy."
advanced_centimetric_radar:0 "Advanced Centimetric Y-Range"
advanced_centimetric_radar_desc:0 "Despite our advanced y-ranges, there are still ways for the enemy to avoid detection. New developments like the Pulse-Doppler y-range allows us to eliminate many of these limitations in our equipment."
nukes:0 "Superbombs"
nukes_desc:0 "A project to construct a superbomb will be one of the most secretive and difficult tasks a nation can undertake, but, if successful, may change not only the course of today's wars but of the future of the world."
 

 ## Industry ##
 MODIFIER_PRODUCTION_OIL_FACTOR:0 "Oil"
 ww1_oil1:0 "Oil Drilling I"
 ww1_oil1_desc:0 "Oil and its uses have been known since the late 19th century, and sadly, most of our oil extraction ability dates much the same. Modernizing our oil wells will increase our take of this valuable substance to a good degree."
 ww1_oil2:0 "Oil Drilling II"
 ww1_oil2_desc:0 "Oil is elusive- it hides underground, where none can see it. For this reason, it's imperitive that we develop more efficient ways to locate it. By improving our oil drilling capabilities, we can find and, therefore, exploit more oil around existing reserves."
 ww1_oil3:0 "Oil Drilling III"
 ww1_oil3_desc:0 "With the recent advances in the tools to find and extract oil, we cannot let our workers be the reason our efforts fall behind. By establishing training standards for oil field workers in both the private and public sector, we can make sure less oil is wasted, further bolstering our newfound reserves of black gold."
 ww1_bergiusprocess:0 "Bergius Process"
 ww1_bergiusprocess_desc:0 "The Bergius Process is a method of production of liquid hydrocarbons for use as synthetic fuel by hydrogenation of high-volatile bituminous coal at high temperature and pressure."
