l_english:

## Generic ###
infantry_equipment:0 "Infantry Equipment"
infantry_equipment_0:0 "Early Repeating Rifle"
infantry_equipment_0_short:0 "Early Repeating Rifle"
infantry_equipment_0_desc:0 "Basic infantry weapons centered on early service rifles. Simple mechanisms and limited rate of fire reflect an older generation of small arms."
infantry_equipment_1:0 "Bolt-Action Rifle"
infantry_equipment_1_short:0 "Bolt-Action Rifle"
infantry_equipment_1_desc:0 "Refined bolt-action rifles with improved machining, sights, and standardized ammunition enhance accuracy and battlefield reliability."
infantry_equipment_2:0 "Improved Bolt-Action Rifle"
infantry_equipment_2_short:0 "Bolt-Action Rifle II"
infantry_equipment_2_desc:0 "Upgraded actions, stronger materials, and better mass-production methods produce reliable rifles suited for the demands of modern warfare."
infantry_equipment_3:0 "Early Submachine Gun"
infantry_equipment_3_short:0 "Submachine Gun I"
infantry_equipment_3_desc:0 "Compact automatic weapons designed for close-quarters combat, offering assault troops a marked increase in short-range firepower."
infantry_equipment_4:0 "Submachine Gun"
infantry_equipment_4_short:0 "Submachine Gun II"
infantry_equipment_4_desc:0 "Refined submachine guns with improved magazines and handling give infantry dependable automatic fire in confined fighting."
infantry_equipment_5:0 "Improved Submachine Gun"
infantry_equipment_5_short:0 "Submachine Gun III"
infantry_equipment_5_desc:0 "Enhanced ergonomics and sturdier components yield reliable, high-capacity submachine guns ideal for trench assaults and mobile operations."
infantry_equipment_6:0 "Assault Rifle"
infantry_equipment_6_short:0 "Assault Rifle"
infantry_equipment_6_desc:0 "A versatile automatic rifle firing an intermediate cartridge, balancing accuracy and firepower across a wide range of combat situations."
heavy_weapons_equipment:0 "Machine Gun Equipment"
heavy_weapons_equipment_short:0 "Machine Gun Eq."
heavy_weapons_equipment_1:0 "Maxim Gun"
heavy_weapons_equipment_1_short:0 "Maxim Gun"
heavy_weapons_equipment_1_desc:0 "A heavy, water-cooled machine gun capable of delivering sustained fire, though its weight and bulk severely limit mobility."
heavy_weapons_equipment_2:0 "Improved Heavy Machine Gun"
heavy_weapons_equipment_2_short:0 "Improved HMG"
heavy_weapons_equipment_2_desc:0 "Refinements to heavy machine guns—improved cooling, sturdier feed systems, and greater standardization—allow for more reliable long-duration fire."
heavy_weapons_equipment_3:0 "Standard Heavy Machine Gun"
heavy_weapons_equipment_3_short:0 "Standard HMG"
heavy_weapons_equipment_3_desc:0 "Modernized heavy machine guns optimized for frontline service provide consistent firepower and better battlefield handling."
heavy_weapons_equipment_4:0 "Portable Machine Gun"
heavy_weapons_equipment_4_short:0 "Portable MG"
heavy_weapons_equipment_4_desc:0 "Lighter, more mobile automatic weapons give infantry improved flexibility, offering sustained firepower even beyond entrenched positions."
motorized_equipment:0 "Transport Vehicles"
motorized_equipment_0:0 "Basic Trucks"
motorized_equipment_0_desc:0 "Civilian trucks converted for army usage."
motorized_equipment_1:0 "Improved Trucks"
motorized_equipment_1_desc:0 "Special made army trucks, with improved reliability and fuel economy."
EQUIPMENT_MOTORIZED:0 "Transport Vehicles"
#  motorized_equipment_0:0 "Horse-drawn Vehicles"
#  motorized_equipment_0_desc:0 "Carts drawn by Horses used to supply mobile divisions before the advent of Army Motorization."
#  motorized_equipment_2:0 "Motorized Infantry"
#  motorized_equipment_2_desc:0 "Motorizing infantry is the first stage towards the mechanization of an army. Civilian trucks are readily adaptable to military uses of transporting soldiers, towing guns, and carrying equipment and supplies. This greatly increases the strategic mobility of infantry units, which would otherwise rely on marching."
#  motorised_hospital:0 "Motorised Ambulances"
#  motorised_hospital_desc:0 "By creating specialized trucks with medical equipment, we can decrease the chance of soldiers dying on their way to the hospital."
 # EQUIPMENT_MOTORIZED:0 "Motorized"


 # USA
USA_infantry_equipment_0:0 "Springfield Model 1892"
USA_infantry_equipment_0_short:0 "Springfield M1892"
USA_infantry_equipment_0_desc:0 "A Krag–Jørgensen–pattern service rifle adopted in the 1890s, offering smooth operation and good accuracy, though limited by its single‑loading gate."
USA_infantry_equipment_1:0 "Springfield Model 1903"
USA_infantry_equipment_1_short:0 "Springfield M1903"
USA_infantry_equipment_1_desc:0 "A high‑quality, Mauser‑pattern rifle prized for accuracy and reliability. A hallmark of early 20th‑century American infantry firepower."
USA_infantry_equipment_2:0 "Springfield Model 1903/15"
USA_infantry_equipment_2_short:0 "Springfield 03/15"
USA_infantry_equipment_2_desc:0 "An improved Springfield pattern rifle, incorporating lessons from early Great War trench fighting—stronger sights, reinforced stock, and simplified machining."
USA_infantry_equipment_3:0 "Browning Automatic Rifle M1917"
USA_infantry_equipment_3_short:0 "BAR M1917"
USA_infantry_equipment_3_desc:0 "A prototype version of Browning’s automatic rifle concept, providing squad‑level suppressive fire in a compact, man‑portable package."
USA_infantry_equipment_4:0 "Springfield Model 1938"
USA_infantry_equipment_4_short:0 "Springfield M1938"
USA_infantry_equipment_4_desc:0 "A modernized Springfield with improved metallurgy, aperture sights, and a simplified bolt, produced to keep pace with interwar small‑arms modernization."
USA_infantry_equipment_5:0 "Thompson Model 1941"
USA_infantry_equipment_5_short:0 "Thompson M1941"
USA_infantry_equipment_5_desc:0 "A refinement of the Thompson submachine gun, offering greater reliability and simplified manufacture, ideal for close‑quarters and mechanized infantry."
USA_infantry_equipment_6:0 "Springfield Model 1943"
USA_infantry_equipment_6_short:0 "Springfield M1943"
USA_infantry_equipment_6_desc:0 "A late‑war, semi‑automatic iteration of the Springfield line, combining proven accuracy with increased rate of fire."
USA_infantry_equipment_7:0 "M14"
USA_infantry_equipment_7_short:0 "M14"
USA_infantry_equipment_7_desc:0 "A select‑fire battle rifle chambered for a modern full‑power cartridge, marking the transition to postwar infantry doctrine."
USA_ww1_helmet_equip:0 "Coalscuttle Helmet"
USA_ww1_helmet_equip_desc:0 "A German‑influenced steel helmet design adopted due to long‑standing US–German military cooperation."
USA_motorized_equipment_0:0 "Ford Model TT"
USA_motorized_equipment_1:0 "Ford Model TT-A"
USA_heavy_weapons_equipment_1:0 "Colt–Browning M1895"
USA_heavy_weapons_equipment_1_short:0 "M1895"
USA_heavy_weapons_equipment_1_desc:0 "Known as the 'Potato Digger,' this early gas‑operated machine gun offers rugged reliability and sustained fire, though at the cost of significant weight."
USA_heavy_weapons_equipment_2:0 "Browning M1910"
USA_heavy_weapons_equipment_2_short:0 "M1910"
USA_heavy_weapons_equipment_2_desc:0 "An American-built .30-06-chambered variant of the German MG 08. Although heavy and cumbersome, it delivers excellent sustained firepower."
USA_heavy_weapons_equipment_3:0 "Browning M1910/15"
USA_heavy_weapons_equipment_3_short:0 "M1910/15"
USA_heavy_weapons_equipment_3_desc:0 "An improved version of the M1910, featuring refinements to the recoil system, a lighter mount, and more durable components for extended firing."
USA_heavy_weapons_equipment_4:0 "Browning M1919"
USA_heavy_weapons_equipment_4_short:0 "M1919"
USA_heavy_weapons_equipment_4_desc:0 "A belt‑fed, air‑cooled medium machine gun capable of high sustained rates of fire. Its durability and portability made it popular among American troops late in the war."


